id: GD-API-008
priority: P1
layer: api
title: History Query Returns Ordered Versions
source: mutation
operator: history-queryable
parent: GD-005
intent: History API must return versions ordered by version_number descending (most recent first).

input:
  mode: diagram
  prompt: "Create a diagram for version history test."
  retrieval_mode: auto
  generate_multiple_versions: 3

expected:
  versions_created: 3
  history_query_returns_all_versions: true
  version_order_ascending_by_number: false
  version_order_descending_by_number: true
  first_version_is_latest: true

anti_patterns:
  - versions returned in creation order instead of version_number
  - versions returned in random order
  - older versions not included in history
  - version numbers are not sequential

notes:
  - Tests the ordering guarantee in VersionRepository.ListByVisualization.
  - Most recent version must appear first in history response.
  - Version numbers must be sequential integers starting from 1.

tags:
  - mutation
  - persistence
  - api
  - history
  - ordering

id: GD-API-011
priority: P1
layer: api
title: Asset Soft Delete Preserves Metadata
source: mutation
operator: artifact-persisted
parent: GD-001
intent: Soft deletion of assets must preserve metadata and maintain history integrity.

input:
  mode: diagram
  prompt: "Create a diagram for asset deletion test."
  retrieval_mode: auto
  delete_asset_after_creation: true

expected:
  asset_created: true
  asset_soft_deleted: true
  deleted_at_field_set: true
  asset_metadata_preserved:
    - id
    - project_id
    - mime_type
    - storage_key
    - byte_size
    - checksum_sha256
  version_artifact_still_linked: true

anti_patterns:
  - soft delete removes asset record completely
  - deleted_at field remains null
  - version_artifact link is broken after soft delete
  - checksum is lost on soft delete

notes:
  - Tests the soft delete semantics in AssetModel.
  - Soft deleted assets should not appear in normal queries.
  - History must still show the artifact link.

tags:
  - mutation
  - persistence
  - api
  - asset
  - soft-delete

id: GD-API-002
priority: P1
layer: api
title: Version Linked to Session Correctly
source: mutation
operator: version-linked-to-session
parent: GD-001
intent: A newly created version must reference the session that produced it, establishing an immutable audit chain.

input:
  mode: diagram
  prompt: "Create a diagram showing a retrieval-augmented generation pipeline."
  retrieval_mode: auto

expected:
  session_record_created: true
  version_created_on_completion: true
  version_fields:
    - id
    - visualization_id
    - session_id
    - version_number
    - created_at
  version_session_id_matches_session: true
  version_queryable_via_history: true

anti_patterns:
  - version created with null session_id
  - version session_id references non-existent session
  - version created but session_id is empty string
  - version link established but not queryable via GetVersion

notes:
  - The version-to-session link is critical for reproducibility.
  - Tests the foreign key integrity between versions and sessions.
  - The session_id in VisualizationVersion must match the SessionRecord.ID.

tags:
  - mutation
  - persistence
  - api
  - version
  - linkage

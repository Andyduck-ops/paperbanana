id: GD-API-001-M-artifact-persisted+history-queryable
priority: P1
layer: api
title: Completed Session Artifacts Are Queryable in History
source: mutation
operators:
  - artifact-persisted
  - history-queryable
parent: GD-API-001
intent: After a session completes, its artifacts must be persisted and retrievable through history queries.

input:
  mode: diagram
  prompt: "Create a diagram showing machine learning pipeline stages."
  project_id: "proj-history-001"

expected:
  final_status: completed
  artifact_persisted: true
  artifact_metadata:
    - id
    - session_id
    - kind
    - mime_type
    - created_at
  history_query_returns_session: true
  history_query_includes_artifacts: true
  artifact_bytes_retrievable: true

anti_patterns:
  - session appears in history but artifacts are missing
  - artifact metadata exists but bytes are not retrievable
  - history query returns session without artifact references
  - artifact session_id does not match the session

notes:
  - Tests the persistence boundary from session completion to history retrieval.
  - Critical for users to access past generation results.
  - Validates that HistoryService.SaveSession captures artifacts correctly.

tags:
  - mutation
  - combined
  - artifact-persisted
  - history-queryable
  - persistence

id: GD-API-015
priority: P1
layer: api
title: Visualization Current Version Pointer Updated
source: mutation
operator: version-linked-to-session
parent: GD-001
intent: After version creation, the visualization's current_version_id must be updated atomically.

input:
  mode: diagram
  prompt: "Create a diagram for current version pointer test."
  retrieval_mode: auto

expected:
  session_completed: true
  version_created: true
  visualization_current_version_updated: true
  current_version_matches_new_version: true
  visualization_fields_updated:
    - current_version_id
    - updated_at

anti_patterns:
  - version created but visualization.current_version_id is null
  - visualization.current_version_id points to old version
  - visualization.current_version_id points to non-existent version
  - update to visualization fails silently

notes:
  - Tests the SetCurrentVersion call in HistoryService.PublishVersion.
  - The visualization must point to the latest version.
  - Critical for the UI to display the current figure.

tags:
  - mutation
  - persistence
  - api
  - visualization
  - version-pointer

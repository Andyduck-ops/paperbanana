id: GD-API-014
priority: P1
layer: api
title: Transaction Rollback on Publish Failure
source: mutation
operator: version-linked-to-session
parent: GD-001
intent: If version publication fails, all changes including session update must be rolled back.

input:
  mode: diagram
  prompt: "Create a diagram for transaction rollback test."
  retrieval_mode: auto
  inject_failure_at_publish: true

expected:
  session_created: true
  pipeline_completed: true
  version_publish_failed: true
  session_status_reverted: true
  no_partial_version_record: true
  transaction_atomicity_preserved: true

anti_patterns:
  - session shows completed but version does not exist
  - version record created without artifacts
  - session updated but version creation failed
  - orphan artifacts exist without version

notes:
  - Tests TxManager.RunInTx rollback behavior.
  - HistoryService.PublishVersion must be atomic.
  - Partial state must not persist on failure.

tags:
  - mutation
  - persistence
  - api
  - transaction
  - rollback

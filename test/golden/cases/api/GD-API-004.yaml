id: GD-API-004
priority: P1
layer: api
title: Completed Session Queryable in History
source: mutation
operator: history-queryable
parent: GD-001
intent: A completed session must appear in history queries with correct status and metadata.

input:
  mode: diagram
  prompt: "Create a diagram for a scientific paper figure."
  retrieval_mode: auto

expected:
  session_record_created: true
  final_status: completed
  session_queryable_in_project_history: true
  history_response_fields:
    - id
    - project_id
    - created_at
    - status
    - current_stage
  history_status_matches_session: true

anti_patterns:
  - session exists but not returned by history query
  - history query returns session with stale status
  - history query returns session with empty project_id
  - completed session shows status as running in history

notes:
  - Tests the history API visibility of persisted sessions.
  - GET /api/v1/history must return the completed session.
  - Status in history must match the actual session status.

tags:
  - mutation
  - persistence
  - api
  - history
  - visibility

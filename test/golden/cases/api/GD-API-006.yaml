id: GD-API-006
priority: P1
layer: api
title: Version Artifacts Linked Correctly
source: mutation
operator: version-linked-to-session
parent: GD-003
intent: Artifacts attached to a version must reference the correct version and asset IDs.

input:
  mode: diagram
  prompt: "Create a diagram for a machine learning pipeline."
  retrieval_mode: auto

expected:
  version_created_on_completion: true
  version_artifacts_created: true
  version_artifact_fields:
    - id
    - version_id
    - asset_id
    - kind
    - mime_type
    - storage_key
    - byte_size
  version_artifact_links_valid: true
  asset_queryable_by_storage_key: true

anti_patterns:
  - version_artifact has null version_id
  - version_artifact has null asset_id
  - version_artifact references non-existent asset
  - asset storage_key does not resolve to actual bytes

notes:
  - Tests the version_artifacts junction table integrity.
  - Each VersionArtifact must link to a valid Asset and Version.
  - The kind field must accurately describe the artifact type.

tags:
  - mutation
  - persistence
  - api
  - version-artifact
  - linkage

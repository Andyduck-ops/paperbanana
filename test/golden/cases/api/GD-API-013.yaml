id: GD-API-013
priority: P1
layer: api
title: Session Snapshot JSON Serialization
source: mutation
operator: session-created-on-start
parent: GD-003
intent: Session snapshot must serialize and deserialize correctly preserving all nested state.

input:
  mode: diagram
  prompt: "Create a diagram for snapshot serialization test."
  retrieval_mode: auto
  stages_to_complete:
    - retriever
    - planner
    - stylist

expected:
  session_created_with_snapshot: true
  snapshot_serialized_to_json: true
  snapshot_fields_preserved:
    - schema_version
    - session_id
    - request_id
    - status
    - current_stage
    - pipeline
    - initial_input
    - stage_states
    - metadata
    - started_at
    - updated_at
  snapshot_deserializable: true

anti_patterns:
  - snapshot JSON is malformed or truncated
  - nested stage_states array is missing
  - datetime fields lose timezone information
  - metadata map is empty after restore

notes:
  - Tests the SessionSnapshotPayload JSON serialization.
  - Critical for session resume functionality.
  - All nested structures must round-trip correctly.

tags:
  - mutation
  - persistence
  - api
  - serialization
  - snapshot

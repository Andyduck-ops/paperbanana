id: GD-API-012
priority: P1
layer: api
title: Project Scoping in Session Queries
source: mutation
operator: history-queryable
parent: GD-005
intent: Session queries must be scoped to the correct project to prevent cross-project leakage.

input:
  mode: diagram
  prompt: "Create a diagram for project scoping test."
  retrieval_mode: auto
  multiple_projects: true
  cross_project_query: true

expected:
  sessions_created_per_project: true
  project_a_sessions: 1
  project_b_sessions: 1
  project_a_query_returns_only_project_a: true
  project_b_query_returns_only_project_b: true
  cross_project_session_not_visible: true

anti_patterns:
  - project A query returns sessions from project B
  - session without project_id appears in all project queries
  - project_id filter is ignored in history query
  - session can be retrieved without project scope

notes:
  - Tests the project_id constraint in session queries.
  - SessionRepository.GetByProject must filter by project_id.
  - Critical for multi-tenant data isolation.

tags:
  - mutation
  - persistence
  - api
  - project-scope
  - isolation

id: GD-API-001
priority: P1
layer: api
title: Session Created on Pipeline Start
source: mutation
operator: session-created-on-start
parent: GD-001
intent: A session record must exist in the database immediately after a generation request is accepted, before any pipeline stage executes.

input:
  mode: diagram
  prompt: "Create a diagram explaining a multi-agent workflow for scientific figure generation."
  retrieval_mode: auto

expected:
  session_record_created: true
  session_fields:
    - id
    - project_id
    - status
    - current_stage
    - created_at
    - updated_at
    - schema_version
  initial_status: running
  initial_stage: retriever
  queryable_via_get_session: true

anti_patterns:
  - session record only created after first stage completes
  - session ID generated but not persisted
  - session exists but queryable only after pipeline completes
  - session status is empty or null at start

notes:
  - This is foundational for audit trails and session recovery.
  - The session must be queryable via GET /api/v1/session/:session_id immediately.
  - Tests the atomic write guarantee at pipeline initiation.

tags:
  - mutation
  - persistence
  - api
  - session
  - lifecycle

id: GD-API-017
priority: P0
layer: api
title: Refine Iteration Flags Are Honored and Observable
source: mutation
operator: refine-iteration-contract
parent: PB-REFINE-002
intent: When iterative refinement is enabled, the service must execute multiple polish rounds and expose truthful iteration metadata.

input:
  route: POST /api/v1/refine
  enable_iteration: true
  max_iterations: 3

expected:
  polish_rounds_executed: 3
  response_metadata:
    iterations: "3"
    stop_reason: max_iterations
  final_image_from_last_round: true

anti_patterns:
  - enable_iteration ignored and only one round executes
  - metadata claims iterations without multiple polish passes
  - final image still reflects the first round output

notes:
  - This case is backed by handler tests that assert image-generation call count and image carry-forward across rounds.

tags:
  - api
  - refine
  - iteration
  - loop

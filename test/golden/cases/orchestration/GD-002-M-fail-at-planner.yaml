id: GD-002-M-fail-at-planner
priority: P1
layer: orchestration
title: Planner Stage Failure Attribution
source: mutation
operator: fail-at-planner
parent: GD-002
intent: When the planner stage fails, the system must record the exact failure boundary, show retriever as completed, and block stylist/visualizer/critic from running.

input:
  mode: diagram
  prompt: "Create a diagram of a neural network architecture with attention layers."
  retrieval_mode: auto
  inject_failure_at: planner

expected:
  final_status: failed
  failed_stage: planner
  must_expose_progress: true
  must_have_final_artifact: false
  stages_completed_before_failure:
    - retriever
  downstream_stages_must_not_run:
    - stylist
    - visualizer
    - critic

anti_patterns:
  - stylist runs despite planner failure
  - failed_stage reported as "unknown" or "mid-pipeline"
  - retriever shown as not run when it actually completed
  - error message does not mention planner specifically
  - session state shows running instead of failed

notes:
  - Planner failure tests mid-pipeline error handling.
  - The retriever stage must be recorded as completed.
  - This is the canonical failure case from GD-002 seed.

tags:
  - mutation
  - failure-location
  - planner
  - mid-pipeline-failure

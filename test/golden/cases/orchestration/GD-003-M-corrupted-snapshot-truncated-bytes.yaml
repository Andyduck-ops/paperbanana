id: GD-003-M-corrupted-snapshot-truncated-bytes
priority: P1
layer: orchestration
title: Corrupted Snapshot With Truncated Artifact Bytes
source: mutation
operator: resume-with-corrupted-snapshot
parent: GD-003
intent: A resumed session where artifact bytes are truncated must fail rather than pass corrupted data to next stage.

input:
  mode: diagram
  prompt: "Create a diagram showing a retrieval-augmented generation pipeline."
  retrieval_mode: auto
  snapshot_corruption:
    type: truncated_artifact_bytes
    description: "Reference bundle artifact bytes are truncated mid-byte"
    affected_artifact: reference_bundle
    truncation_point: 1024
  resume_from: planner
  resume_context:
    snapshot_file_exists: true
    retriever_completed: true
    artifact_bytes_truncated: true

expected:
  final_status: failed
  error_type: ErrInvalidSnapshot
  error_message_must_contain:
    - "artifact"
    - "truncated"
    - "reference_bundle"
  stages_must_not_run:
    - planner
    - stylist
    - visualizer
    - critic
  must_not_pass_corrupted_bytes_to_planner: true
  must_preserve_original_snapshot_intact: true

anti_patterns:
  - planner receives truncated reference data and produces incorrect plan
  - JSON deserialization silently fails and planner gets nil references
  - system proceeds with corrupted binary data
  - error appears as visualizer failure instead of snapshot corruption
  - checksum validation skipped for resume performance

notes:
  - Tests artifact byte integrity during snapshot restore.
  - Binary artifacts are especially vulnerable to truncation.
  - Should validate artifact checksums if available.
  - Critical for visual artifacts and binary data.

tags:
  - mutation
  - resume-boundary
  - corrupted-snapshot
  - truncated-bytes
  - artifact-integrity

id: GD-004-M-cognitive-resume-amnesia
priority: P1
layer: orchestration
title: Resume Amnesia Loses Original User Configuration
source: mutation
operator: cognitive-resume-amnesia
parent: GD-004
intent: When a task is resumed, all original user configuration (mode, retrieval settings, custom parameters) must be preserved. If resume "forgets" user settings, the output may differ from the original intent, wasting user effort and causing confusion.

input:
  mode: diagram
  prompt: "Create a diagram of a message queue system"
  retrieval_mode: manual
  manual_references:
    - "ref://docs/architecture/mq-patterns.md"
  custom_style: "dark-theme"
  inject_interrupt: mid_planner
  resume_action: true

expected:
  resumed_session_must_have:
    - key: mode
      value: "diagram"
    - key: retrieval_mode
      value: "manual"
    - key: manual_references
      value_contains: "mq-patterns.md"
    - key: custom_style
      value: "dark-theme"
  ui_must_display_restored_config: true

anti_patterns:
  - resumed task defaults to retrieval_mode: auto instead of manual
  - manual references from original request are lost on resume
  - custom style setting is reset to default on resume
  - resume shows completed with wrong configuration than original
  - user is not informed that settings were restored
  - resume creates a new session with different settings
  - original prompt is preserved but not the execution parameters

notes:
  - Users expect resume to continue exactly where they left off.
  - Forgetting configuration is like "amnesia" - the task runs differently.
  - This is especially problematic for long-running interrupted tasks.
  - All session configuration should be persisted atomically at start.
  - Resume should display "restored from checkpoint with: [config]".
  - Verification: resumed session has same mode, retrieval_mode, references, style.
  - Verification: UI displays restored configuration to user.

tags:
  - mutation
  - user-cognitive-trap
  - resume-amnesia
  - config-preservation
  - checkpoint-integrity
  - intent-preservation

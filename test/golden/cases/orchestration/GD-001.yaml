id: GD-001
priority: P0
layer: orchestration
title: Happy Path Completion
source: seed
intent: A valid generation request must complete through all five pipeline stages and produce a final artifact with a truthful completed status.

input:
  mode: diagram
  prompt: "Create a diagram explaining a multi-agent workflow for scientific figure generation."
  retrieval_mode: auto

expected:
  final_status: completed
  stage_order:
    - retriever
    - planner
    - stylist
    - visualizer
    - critic
  must_expose_progress: true
  must_have_final_artifact: true
  must_persist_session: true

anti_patterns:
  - stage skipped silently with final status still showing completed
  - final_status is completed but no artifact is present
  - intermediate failure absorbed and hidden from session state
  - stage order differs from canonical without intentional pipeline override

notes:
  - This is the constitutional baseline case for the entire system.
  - If this case regresses, all other cases become unreliable.
  - The artifact does not need to be visually perfect. It must exist and be typed.

tags:
  - orchestration
  - happy-path
  - pipeline
  - artifact
  - baseline

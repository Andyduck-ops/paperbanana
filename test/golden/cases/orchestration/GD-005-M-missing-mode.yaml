id: GD-005-M-missing-mode
priority: P1
layer: orchestration
title: Missing Mode Must Not Cause UI State Corruption
source: mutation
operator: missing-mode
parent: GD-005
intent: When mode is missing, the system must handle it gracefully without corrupting the UI state exposure layer. The error must be visible in the session state.

input:
  scenarios:
    - name: running_with_missing_mode
      description: task started with mode=null, system is handling gracefully
    - name: failed_from_missing_mode
      description: task failed due to missing mode, error must be visible

expected:
  running_with_missing_mode:
    session_status: running
    current_stage: visible or validation_in_progress
    must_emit_validation_event: true
  failed_from_missing_mode:
    session_status: failed
    failed_stage: validation_or_input
    error_must_indicate_missing_mode: true
    must_emit_failure_event: true

anti_patterns:
  - session_status shows running indefinitely with no stage update
  - session_status shows running but pipeline never started due to validation
  - error about missing mode is logged internally but not exposed to session state
  - UI cannot determine whether the task is running or failed
  - failed_stage is empty or points to wrong stage like retriever

notes:
  - This bridges input validation with UI state truthfulness.
  - The key is that UI layer must have visibility into the validation failure.
  - Internal validation errors must be surfaced to session state.
  - This protects against silent failures that appear as hangs in UI.

tags:
  - mutation
  - input-ambiguity
  - missing-mode
  - ui-state
  - validation-visibility

id: GD-003-M-corrupted-snapshot-session-id-mismatch
priority: P1
layer: orchestration
title: Corrupted Snapshot Session ID Mismatch
source: mutation
operator: resume-with-corrupted-snapshot
parent: GD-003
intent: A resumed session where the snapshot session ID does not match the requested session ID must fail with a clear security error.

input:
  mode: diagram
  prompt: "Create a diagram showing a retrieval-augmented generation pipeline."
  retrieval_mode: auto
  snapshot_corruption:
    type: session_id_mismatch
    requested_session_id: session-abc123
    snapshot_session_id: session-xyz789
    description: "Snapshot contains different session ID than requested"
  resume_from: stylist
  resume_context:
    snapshot_file_exists: true
    session_id_mismatch: true

expected:
  final_status: failed
  error_type: ErrInvalidSnapshot
  error_message_must_contain:
    - "session mismatch"
    - "session-abc123"
    - "session-xyz789"
  stages_must_not_run:
    - stylist
    - visualizer
    - critic
  must_not_load_wrong_session: true
  must_preserve_original_snapshot_intact: true
  security_audit_log_created: true

anti_patterns:
  - system loads wrong session's snapshot
  - session ID mismatch silently ignored
  - error message hides session IDs for "security" making debugging impossible
  - cross-session data leakage through snapshot confusion
  - snapshot from one session used for another session's resume

notes:
  - Tests session ID validation for security isolation.
  - Session ID mismatch could indicate corruption or tampering.
  - Must fail safe - never load wrong session's data.
  - Security audit trail should be created for investigation.

tags:
  - mutation
  - resume-boundary
  - corrupted-snapshot
  - session-isolation
  - security

id: GD-001-M-time-015
priority: P1
layer: orchestration
title: Daylight Saving Time Transition During Execution
source: mutation
operator: dst-transition
parent: GD-001
intent: When DST transition occurs during task execution, timeouts must remain accurate using monotonic time.

input:
  mode: plot
  prompt: "Create a bar chart of quarterly sales."
  retrieval_mode: auto
  dst_transition_scenario:
    task_starts_at: "2024-03-10T01:30:00-05:00"
    dst_transition_at: "2024-03-10T02:00:00-05:00"
    clock_jumps_to: "2024-03-10T03:00:00-04:00"
    stage_timeout_ms: 3600000
    task_should_complete_before: "2024-03-10T02:30:00-real"

expected:
  timeout_must_use_monotonic_time: true
  dst_jump_must_not_affect_timeout: true
  timeout_fires_at_correct_elapsed_time: true
  wall_clock_appears_to_jump: 1_hour_forward
  actual_elapsed_time: unaffected
  final_status: completed_or_failed_normally

anti_patterns:
  - timeout fires one hour early due to clock jump
  - timeout fires one hour late due to backward DST transition
  - scheduled timeouts are scheduled at wrong wall clock time
  - session timestamps are ambiguous during DST transition hour
  - progress calculation shows negative or >100% due to clock jump

notes:
  - Tests robustness to daylight saving time transitions.
  - Spring forward: clocks jump 1 hour ahead.
  - Fall back: clocks jump 1 hour backward.
  - System must use monotonic clock, not wall clock.
  - Timestamps should use UTC or include timezone info.

tags:
  - mutation
  - time-sensitive
  - dst-transition
  - monotonic-clock
  - timezone-handling

id: GD-005-M-cognitive-batch-hallucination
priority: P1
layer: orchestration
title: Batch Hallucination Shows All Success When Some Failed
source: mutation
operator: cognitive-batch-hallucination
parent: GD-BATCH-001
intent: When a batch task completes, the aggregate status must accurately reflect individual task statuses. If the UI shows "all completed" when some tasks actually failed, users will incorrectly assume success and miss failed outputs.

input:
  mode: diagram
  batch_size: 5
  prompts:
    - "Create a diagram of a REST API"
    - "Create a diagram of a GraphQL schema"
    - "Create a diagram of a WebSocket connection"
    - "Create a diagram of a gRPC service"
    - "Create a diagram of a SOAP protocol"
  retrieval_mode: shared
  inject_partial_failure:
    candidates: [2, 4]
    failure_type: critic_rejection

expected:
  batch_status_must_be: partial_failure
  batch_metadata_must_include:
    - key: total_count
      value: "5"
    - key: success_count
      value: "3"
    - key: failed_count
      value: "2"
  failed_candidate_indices_must_be: [2, 4]
  must_highlight_failed_candidates: true
  must_not_show_batch_as_completed: true

anti_patterns:
  - batch summary shows "5/5 completed" when 2 actually failed
  - UI displays all green checkmarks when some tasks failed
  - batch_status is "completed" instead of "partial_failure"
  - failed candidates are hidden in a collapsed section
  - user downloads batch results and finds missing artifacts
  - no visual distinction between successful and failed in batch view
  - batch progress goes to 100% despite failures

notes:
  - This is a critical trust issue for batch operations.
  - Users often process batches and move on, assuming success.
  - Hidden failures mean users ship incorrect or incomplete work.
  - Batch status must be: all_success, partial_failure, or all_failed.
  - UI must make failures obvious, not hidden in details.
  - Verification: batch_status is "partial_failure", not "completed".
  - Verification: batch metadata includes accurate success and failed counts.

tags:
  - mutation
  - user-cognitive-trap
  - batch-hallucination
  - partial-failure
  - aggregate-status
  - trust-violation

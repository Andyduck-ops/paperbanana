id: GD-001-M-intent-09
priority: P1
layer: orchestration
title: Implicit Constraint From Domain Terminology Must Be Recognized
source: mutation
operator: intent-domain-terminology
parent: GD-001
intent: When a prompt uses domain-specific terminology that implies certain constraints, the system must recognize and apply those implicit constraints without requiring explicit specification.

input:
  mode: diagram
  prompt: "Create an ER diagram for a banking system with customers, accounts, and transactions."
  retrieval_mode: auto

expected:
  final_status: completed
  must_recognize_er_diagram_conventions: true
  must_apply_implicit_constraints: true
  artifact_must_contain:
    - "Customer"
    - "Account"
    - "Transaction"
  artifact_must_contain_relationship_indicators:
    - "1:N"
    - "M:N"
    - "1:1"
    - "*"
    - "n"
  domain_constraints_must_be_logged: true

anti_patterns:
  - system produces generic box-and-arrow diagram without ER conventions
  - system doesn't include primary keys, foreign keys, or cardinality notation
  - relationships are shown without cardinality (1:N, M:N) indicators
  - domain terminology is treated as generic words
  - implicit ER diagram conventions are not recognized or applied

notes:
  - "ER diagram" has specific conventions: entities as rectangles, relationships as diamonds.
  - Banking domain implies certain constraints: customer has accounts, accounts have transactions.
  - The system should recognize these without explicit specification.
  - This tests domain knowledge integration with intent extraction.
  - Verification: artifact contains entity names from prompt.
  - Verification: artifact contains cardinality notation (1:N, M:N, etc.).

tags:
  - mutation
  - user-intent-edge
  - intent-domain-terminology
  - implicit-constraints
  - domain-knowledge

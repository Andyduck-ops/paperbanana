id: GD-005-M-no-rendered-output
priority: P1
layer: orchestration
title: UI State When Visualizer Produces Nothing
source: mutation
operator: no-rendered-output
parent: GD-005
intent: Session state must accurately reflect visualizer output absence as a failure, not as a completed state with missing artifact.

input:
  scenarios:
    - name: visualizer_empty_output
      description: visualizer completed but produced no image bytes
      visualizer_result:
        status: completed
        image_bytes: null

expected:
  visualizer_empty_output:
    session_status: failed
    failed_stage: visualizer
    failure_reason_must_include:
      - indication that no image was produced
    must_emit_failure_event: true
    stages_must_not_show_completed:
      - critic

anti_patterns:
  - session_status is completed but artifact is missing
  - failed_stage is empty or points to wrong stage
  - visualizer shown as completed despite producing nothing
  - critic stage runs despite no image to analyze
  - UI shows success state with empty artifact area

notes:
  - Tests that session state truthfully represents visualizer output absence.
  - No image bytes is a failure condition that must be visible in state.
  - This is critical for UI to render correct failure state.

tags:
  - mutation
  - artifact-presence
  - ui-bridge
  - visualizer
  - empty-output

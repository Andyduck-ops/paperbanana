id: GD-003-M-corrupted-snapshot-missing-stage-state
priority: P1
layer: orchestration
title: Corrupted Snapshot Missing Stage State
source: mutation
operator: resume-with-corrupted-snapshot
parent: GD-003
intent: A resumed session with a corrupted snapshot missing stage state must fail gracefully with a clear error indicating the corruption type.

input:
  mode: diagram
  prompt: "Create a diagram showing a retrieval-augmented generation pipeline."
  retrieval_mode: auto
  snapshot_corruption:
    type: missing_stage_states
    description: "Session snapshot has empty StageStates array despite planner completion"
  resume_from: stylist
  resume_context:
    snapshot_file_exists: true
    stage_states_array_empty: true
    session_status_running: false

expected:
  final_status: failed
  error_type: ErrInvalidSnapshot
  error_message_must_contain:
    - "invalid snapshot"
    - "stage state"
  stages_must_not_run:
    - stylist
    - visualizer
    - critic
  must_not_create_duplicate_session: true
  must_preserve_original_snapshot_intact: true

anti_patterns:
  - system attempts to run pipeline from scratch ignoring corruption
  - error message is generic with no indication of corruption type
  - original corrupted snapshot is overwritten or deleted
  - system creates a new session instead of failing the resume
  - stylist runs with empty input causing downstream errors

notes:
  - Tests graceful degradation when snapshot data is incomplete.
  - The system must detect corruption before attempting stage execution.
  - Original snapshot should be preserved for debugging.
  - This protects against partial writes or storage corruption.

tags:
  - mutation
  - resume-boundary
  - corrupted-snapshot
  - error-handling
  - graceful-degradation

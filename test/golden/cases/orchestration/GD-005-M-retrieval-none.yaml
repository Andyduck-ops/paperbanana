id: GD-005-M-retrieval-none
priority: P1
layer: orchestration
title: UI State Truthfulness With Retrieval Disabled
source: mutation
operator: retrieval-none
parent: GD-005
intent: UI state must remain truthful and accurate even when retrieval is disabled, proving that retrieval mode does not corrupt state reporting.

input:
  scenarios:
    - name: running
      description: task has been started with retrieval_mode none and is mid-execution
      retrieval_mode: none
    - name: completed
      description: task has finished all stages successfully with retrieval disabled
      retrieval_mode: none
    - name: failed
      description: task has failed at a known stage with retrieval disabled
      retrieval_mode: none

expected:
  running:
    session_status: running
    current_stage: visible and non-empty
    must_emit_stage_events: true
    retrieval_mode_in_state: none
  completed:
    session_status: completed
    must_have_final_artifact: true
    current_stage: the final stage name
    retrieval_mode_in_state: none
  failed:
    session_status: failed
    failed_stage: non-empty and accurate
    must_emit_failure_event: true
    retrieval_mode_in_state: none

anti_patterns:
  - retrieval_mode none causes session_status to report incorrectly
  - stage events are missing or malformed when retrieval is disabled
  - completed status shown but artifact missing due to retrieval disabled
  - failed_stage is empty or incorrect when retrieval_mode is none

notes:
  - Tests that retrieval_mode configuration does not corrupt state truthfulness.
  - All lifecycle transitions must work identically regardless of retrieval mode.
  - UI should display correct state regardless of retrieval_mode.

tags:
  - mutation
  - retrieval-variation
  - retrieval-none
  - state-truthfulness

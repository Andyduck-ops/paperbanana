id: GD-001-M-contradictory-input
priority: P1
layer: orchestration
title: Contradictory Constraints Must Be Detected and Reported
source: mutation
operator: contradictory-input
parent: GD-001
intent: When a prompt contains logically contradictory instructions, the system must detect the conflict and either resolve it explicitly or fail with a clear explanation, not arbitrarily pick one constraint.

input:
  mode: diagram
  prompt: "Create a diagram with no visual elements showing a detailed multi-agent workflow with five interconnected nodes and detailed annotations."
  retrieval_mode: auto

expected:
  one_of:
    - final_status: completed
      conflict_resolution_must_be_logged: true
      artifact_must_satisfy_primary_constraint: true
    - final_status: failed
      error_must_indicate_contradiction: true
      error_must_list_conflicting_constraints: true
  must_detect_contradiction: true
  must_not_produce_artifact_violating_explicit_constraints: true

anti_patterns:
  - system produces an empty diagram honoring "no visual elements" while ignoring the "five nodes" requirement
  - system produces five nodes while ignoring "no visual elements" without logging the conflict
  - pipeline completes successfully but artifact is inconsistent with stated constraints
  - contradiction is present but system proceeds as if input was well-formed
  - error message is generic with no mention of constraint conflict

notes:
  - "No visual elements" contradicts "five nodes" and "detailed annotations".
  - The key test is whether the system acknowledges the conflict.
  - Resolution strategy is flexible but must be explicit.
  - This protects against systems that silently drop user constraints.

tags:
  - mutation
  - input-ambiguity
  - contradictory-input
  - constraint-conflict
  - explicit-resolution

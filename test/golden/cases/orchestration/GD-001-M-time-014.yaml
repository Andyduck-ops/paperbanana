id: GD-001-M-time-014
priority: P2
layer: orchestration
title: Timeout With Retry Count Exhausted
source: mutation
operator: timeout-retry-exhausted
parent: GD-001
intent: When all retry attempts are exhausted due to repeated timeouts, the system must report the retry history clearly.

input:
  mode: diagram
  prompt: "Create a diagram explaining a multi-agent workflow for scientific figure generation."
  retrieval_mode: auto
  retry_exhaustion_scenario:
    max_retries: 3
    attempt_1:
      stage: planner
      timed_out_at_ms: 30000
    attempt_2:
      stage: planner
      timed_out_at_ms: 30000
    attempt_3:
      stage: planner
      timed_out_at_ms: 30000
    attempt_4:
      stage: planner
      timed_out_at_ms: 30000

expected:
  final_status: failed
  error_must_indicate: retry_exhausted
  retry_history_must_show:
    - attempt: 1
      error: timeout
      stage: planner
    - attempt: 2
      error: timeout
      stage: planner
    - attempt: 3
      error: timeout
      stage: planner
    - attempt: 4
      error: timeout
      stage: planner
  user_must_be_offered: simplify_prompt_or_contact_support

anti_patterns:
  - system reports single timeout without indicating retries attempted
  - retry history not persisted for debugging
  - no suggestion for how to resolve persistent timeouts
  - retry count is invisible to user
  - system keeps retrying infinitely without stopping

notes:
  - Tests retry exhaustion handling and user communication.
  - Persistent timeouts indicate systemic issue (prompt, resources, etc).
  - User needs actionable guidance after exhaustion.
  - Retry history is valuable for debugging.

tags:
  - mutation
  - time-sensitive
  - retry-exhaustion
  - timeout-history
  - user-guidance

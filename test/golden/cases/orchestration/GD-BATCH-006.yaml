id: GD-BATCH-006
priority: P1
layer: orchestration
title: Batch Shared Retriever Propagation
source: mutation
operator: batch-all-succeed
parent: GD-004
intent: Shared retriever references must be observable in all candidate planner inputs, proving the shared-retriever optimization works correctly.

input:
  mode: diagram
  batch_size: 3
  prompts:
    - "Create a diagram of a transformer encoder"
    - "Create a diagram of a transformer decoder"
    - "Create a diagram of a cross-attention block"
  retrieval_mode: shared
  injected_references:
    - id: ref_transformer_shared
      summary: "Shared reference for transformer architecture"
      content: "Detailed transformer paper reference"

expected:
  batch_final_status: completed
  shared_retriever_used: true
  retriever_call_count: 1
  all_planners_receive_same_references: true
  reference_propagation_verified:
    - candidate_id: 0
      references_received: 1
      reference_ids: ["ref_transformer_shared"]
    - candidate_id: 1
      references_received: 1
      reference_ids: ["ref_transformer_shared"]
    - candidate_id: 2
      references_received: 1
      reference_ids: ["ref_transformer_shared"]
  per_task_status:
    - candidate_id: 0
      status: completed
    - candidate_id: 1
      status: completed
    - candidate_id: 2
      status: completed

anti_patterns:
  - retriever called 3 times instead of once
  - each candidate receives different reference set
  - references lost between retriever and planner for some candidates
  - shallow copy of references causes mutation cross-contamination
  - planner input missing RetrievedReferences field

notes:
  - Tests causal chain of shared retriever to all planners
  - Verifies deep copy or immutability of shared references
  - Key optimization validation: retriever should run exactly once
  - All planners should have identical reference content

tags:
  - mutation
  - batch
  - batch-all-succeed
  - shared-retriever
  - propagation
  - orchestration

id: GD-001-M-boundary-04
priority: P1
layer: orchestration
title: Resource Exhaustion With Critic Timeout And Retry Exhaustion
source: mutation
operators:
  - fail-at-visualizer-resource-exhaustion
  - fail-at-critic-timeout
  - retry-exhaustion
parent: GD-001
intent: When GPU memory is exhausted during visualizer, then critic times out, and retry attempts are exhausted, the system must provide clear attribution and preserve any intermediate artifacts.

input:
  mode: plot
  prompt: "Create a 3D surface plot of terrain elevation data."
  retrieval_mode: auto
  inject_failure_sequence:
    - stage: visualizer
      failure_type: resource_exhaustion
      error_message: "GPU out of memory"
      retry_attempt: 1
    - stage: visualizer
      failure_type: resource_exhaustion
      error_message: "GPU out of memory"
      retry_attempt: 2
    - stage: critic
      failure_type: timeout
      timeout_ms: 60000
  max_retries: 2
  resource_monitoring_enabled: true

expected:
  final_status: failed
  failed_stage: critic
  retry_history_must_show:
    - visualizer attempt 1: resource_exhaustion
    - visualizer attempt 2: resource_exhaustion
    - visualizer attempt 3: success
    - critic attempt 1: timeout
  must_expose_progress: true
  visualizer_artifact_must_be_accessible: true
  failure_must_indicate:
    - resource_exhaustion_recovered_after_retries
    - critic_timeout_cause: resource_contention_from_visualizer
  must_have_final_artifact: false

anti_patterns:
  - visualizer artifact deleted after critic failure
  - retry history lost or not attributed correctly
  - failure attributed only to critic without visualizer context
  - resource exhaustion treated as unrecoverable without retry
  - timeout cause not linked to resource contention

notes:
  - Tests cascade of resource-related failures across stages.
  - Retry exhaustion and timeout must be traceable through the pipeline.
  - Intermediate artifacts from successful visualizer retry must be preserved.

tags:
  - mutation
  - boundary-combination
  - fail-at-visualizer-resource-exhaustion
  - fail-at-critic-timeout
  - retry-exhaustion
  - resource-management

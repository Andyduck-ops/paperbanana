id: GD-BATCH-014
priority: P1
layer: orchestration
title: Batch Cross-Candidate State Leak
source: mutation
operator: batch-state-leak
parent: GD-002
intent: When candidates share retriever context, one candidate's internal state must not leak into another candidate's output, ensuring proper isolation.

input:
  mode: diagram
  batch_size: 3
  prompts:
    - "Create a diagram of a CNN for image classification"
    - "Create a diagram of an RNN for text generation"
    - "Create a diagram of a GAN for image synthesis"
  retrieval_mode: shared
  inject_state_leak:
    source_candidate: 0
    leak_type: session_variable
    leaked_data: "CNN_INTERNAL_STATE_MARKER"
    detect_in_output: true

expected:
  batch_final_status: completed
  per_task_status:
    - candidate_id: 0
      status: completed
      must_have_artifact: true
    - candidate_id: 1
      status: completed
      must_have_artifact: true
    - candidate_id: 2
      status: completed
      must_have_artifact: true
  isolation_verified: true
  cross_contamination_checks:
    - candidate_id: 0
      contains_leaked_marker: true
      self_contamination_allowed: false
    - candidate_id: 1
      contains_leaked_marker: false
      leaked_from: null
    - candidate_id: 2
      contains_leaked_marker: false
      leaked_from: null
  session_isolation_verified: true

anti_patterns:
  - candidate 1 or 2 output contains CNN_INTERNAL_STATE_MARKER
  - shared mutable state between candidates
  - planner of candidate 1 sees candidate 0's internal variables
  - artifact files written to wrong session directory
  - visualizer uses cached state from previous candidate

notes:
  - Tests state isolation between batch candidates
  - Candidate 0 intentionally injects marker data
  - Markers must NOT appear in candidates 1 and 2
  - Each candidate must have independent session state
  - Shared retriever should not cause state leak

tags:
  - mutation
  - batch
  - batch-complexity
  - state-leak
  - isolation
  - session-boundary
  - orchestration

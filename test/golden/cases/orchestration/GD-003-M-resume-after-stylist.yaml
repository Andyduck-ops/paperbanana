id: GD-003-M-resume-after-stylist
priority: P1
layer: orchestration
title: Resume After Stylist Boundary
source: mutation
operator: resume-after-stylist
parent: GD-003
intent: A resumed session must correctly continue from visualizer after stylist snapshot, preserving style instructions and plan for visualizer input.

input:
  mode: diagram
  prompt: "Create a diagram showing a retrieval-augmented generation pipeline."
  retrieval_mode: auto
  snapshot_captured_after: stylist
  resume_from: visualizer
  resume_context:
    stylist_completed_normally: true
    style_instructions_present: true
    plan_artifact_accessible: true

expected:
  final_status: completed
  stages_must_not_rerun:
    - retriever
    - planner
    - stylist
  stages_continued:
    - visualizer
    - critic
  must_have_final_artifact: true
  must_persist_session: true
  resume_metadata_preserved: true
  intermediate_artifacts_preserved:
    - stylist_output_accessible_to_visualizer
    - plan_artifact_still_accessible
    - reference_bundle_preserved

anti_patterns:
  - visualizer receives empty style instructions because stylist output was lost
  - planner output is lost between stylist and visualizer stages
  - stylist reruns despite valid snapshot
  - style constraints from stylist not applied to visualizer output
  - visualizer generates without style context from snapshot

notes:
  - Tests the stylist-to-visualizer boundary which carries style constraints.
  - The visualizer must receive both the plan and style instructions.
  - Verify that visualizer receives stylist output from snapshot, not from a new run.
  - This boundary is critical for style-guided generation quality.

tags:
  - mutation
  - resume-boundary
  - resume-after-stylist
  - state-preservation
  - style-continuity

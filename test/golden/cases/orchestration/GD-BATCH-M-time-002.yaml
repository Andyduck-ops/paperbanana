id: GD-BATCH-M-time-002
priority: P1
layer: orchestration
title: Batch Task Staggered Start Timing
source: mutation
operator: batch-staggered-start
parent: GD-BATCH-001
intent: When batch tasks are started with staggered timing, each task's timeout must be measured from its own start time.

input:
  mode: plot
  batch_requests:
    - prompt: "Create scatter plot of education vs income."
      starts_at: T0
    - prompt: "Create bar chart of population by continent."
      starts_at: T0_plus_5000
    - prompt: "Create line chart of stock prices."
      starts_at: T0_plus_10000
  batch_timing:
    stagger_interval_ms: 5000
    individual_timeout_ms: 30000
    global_batch_timeout_ms: 60000
    inject_timeout_in_task: 3
    inject_timeout_at: T0_plus_45000

expected:
  task_1_status: completed
  task_2_status: completed
  task_3_status: failed
  task_3_error: timeout
  each_task_timeout_independent: true
  task_3_elapsed_at_timeout: 35000
  batch_final_status: partial_success

anti_patterns:
  - all tasks timeout at same wall-clock time regardless of start time
  - task 3 timeout measured from T0 instead of T0_plus_10000
  - earlier tasks incorrectly fail due to later task timeout
  - stagger interval counted against first task timeout
  - no per-task elapsed time tracking

notes:
  - Tests per-task timeout isolation in batch processing.
  - Staggered starts are common for rate limiting.
  - Each task must have independent timeout context.
  - Users need accurate per-task timing information.

tags:
  - mutation
  - time-sensitive
  - batch-processing
  - staggered-start
  - independent-timeout

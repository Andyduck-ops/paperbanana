id: GD-BATCH-020
priority: P1
layer: orchestration
title: Batch Progress Tracking Accuracy
source: mutation
operator: batch-progress-tracking
parent: GD-002
intent: When a batch executes with mixed success/failure/skipped results, progress tracking must accurately reflect each candidate's contribution to overall progress.

input:
  mode: diagram
  batch_size: 5
  prompts:
    - "Create a diagram of a CNN layer"
    - "Create a diagram of an RNN cell"
    - "Create a diagram of an LSTM gate"
    - "Create a diagram of a GRU unit"
    - "Create a diagram of an attention head"
  retrieval_mode: shared
  inject_failures:
    - candidate_id: 1
      stage: planner
    - candidate_id: 3
      stage: visualizer

expected:
  batch_final_status: completed
  per_task_status:
    - candidate_id: 0
      status: completed
      must_have_artifact: true
    - candidate_id: 1
      status: failed
      failed_stage: planner
    - candidate_id: 2
      status: completed
      must_have_artifact: true
    - candidate_id: 3
      status: failed
      failed_stage: visualizer
    - candidate_id: 4
      status: completed
      must_have_artifact: true
  progress_tracking:
    total_candidates: 5
    completed_count: 3
    failed_count: 2
    progress_percentage: 100
    expected_artifact_count: 3
    actual_artifact_count: 3
  progress_events_accurate: true
  final_progress_matches_actual: true

anti_patterns:
  - progress shows 60% when all candidates processed
  - failed candidates counted as "in progress"
  - artifact count mismatch with completed count
  - progress never reaches 100%
  - individual candidate progress not tracked

notes:
  - Tests accurate progress tracking in complex scenarios
  - 5 candidates: 3 completed, 2 failed
  - Progress must reach 100% when all processed
  - Artifact count must match completed count
  - Each candidate's status reflected in progress

tags:
  - mutation
  - batch
  - batch-complexity
  - progress-tracking
  - status-accuracy
  - orchestration

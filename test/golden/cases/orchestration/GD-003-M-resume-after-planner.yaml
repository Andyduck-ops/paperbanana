id: GD-003-M-resume-after-planner
priority: P1
layer: orchestration
title: Resume After Planner Boundary
source: mutation
operator: resume-after-planner
parent: GD-003
intent: A resumed session must correctly continue from stylist after planner snapshot, preserving planner output as stylist input without rerunning retriever or planner.

input:
  mode: diagram
  prompt: "Create a diagram showing a retrieval-augmented generation pipeline."
  retrieval_mode: auto
  snapshot_captured_after: planner
  resume_from: stylist
  resume_context:
    planner_completed_normally: true
    planner_output_present: true

expected:
  final_status: completed
  stages_must_not_rerun:
    - retriever
    - planner
  stages_continued:
    - stylist
    - visualizer
    - critic
  must_have_final_artifact: true
  must_persist_session: true
  resume_metadata_preserved: true
  intermediate_artifacts_preserved:
    - planner_output_accessible_to_stylist
    - retriever_bundle_accessible_via_planner_state

anti_patterns:
  - stylist receives empty input because planner output was not restored
  - retriever reruns despite valid snapshot
  - planner reruns despite completed state in snapshot
  - duplicate artifacts created for planner or retriever stages
  - session status shows running indefinitely after resume completes

notes:
  - This mutation tests the most common resume boundary: after planner, before stylist.
  - The planner-to-stylist handoff carries the plan artifact which stylist must receive.
  - Verify that stylist receives the plan from snapshot, not from a new planner run.
  - The RestoreMetadata.RestoredFrom must equal 'planner' in the resumed session.

tags:
  - mutation
  - resume-boundary
  - resume-after-planner
  - state-preservation
  - artifact-continuity

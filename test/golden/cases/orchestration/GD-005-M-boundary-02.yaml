id: GD-005-M-boundary-02
priority: P1
layer: orchestration
title: Resume After Cancellation With Network Error And Stale Session
source: mutation
operators:
  - resume-after-cancellation
  - fail-at-retriever-network
  - stale-session-detection
parent: GD-005
intent: When resuming a cancelled session that encounters a network error and the session has become stale, the system must handle the triple boundary condition correctly.

input:
  mode: plot
  prompt: "Create a violin plot of gene expression data."
  retrieval_mode: auto
  previous_session:
    status: cancelled
    cancellation_reason: user_request
    last_completed_stage: retriever
    session_age_hours: 48
  resume_attempt: true
  inject_failure_at: retriever
  failure_type: network_error
  network_error_code: ETIMEDOUT

expected:
  final_status: failed
  failed_stage: retriever
  failure_reason: network_error
  stale_session_detection:
    session_too_old_for_resume: true
    max_resume_age_hours: 24
  ui_must_show:
    - network error message
    - session expired notification
    - suggestion to start new session
  session_metadata_must_include:
    - resume_attempted_on_stale_session: true
    - stale_session_rejected: true

anti_patterns:
  - stale session proceeds with potentially outdated context
  - network error masks stale session condition
  - user not informed that session has expired
  - retry attempts continue indefinitely
  - old retrieval results used despite potential staleness

notes:
  - Tests the intersection of recovery, network reliability, and session validity.
  - Stale sessions may have outdated retrieval results.
  - Network errors and stale sessions both need clear communication.

tags:
  - mutation
  - boundary-combination
  - resume-after-cancellation
  - fail-at-retriever-network
  - stale-session-detection
  - session-validity

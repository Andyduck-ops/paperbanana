id: GD-BATCH-005
priority: P1
layer: orchestration
title: Batch Retriever Failure Cascades
source: mutation
operator: batch-partial-failure
parent: GD-002
intent: When shared retriever fails, the entire batch must fail with clear attribution, and no candidates should run.

input:
  mode: diagram
  batch_size: 3
  prompts:
    - "Create a diagram of a gradient descent"
    - "Create a diagram of a backpropagation"
    - "Create a diagram of a loss function"
  retrieval_mode: shared
  inject_failure:
    stage: retriever
    error_message: "Retriever service unavailable"

expected:
  batch_final_status: failed
  retriever_failure_cascades_to_all: true
  per_task_status:
    - candidate_id: 0
      status: failed
      failed_stage: retriever
    - candidate_id: 1
      status: failed
      failed_stage: retriever
    - candidate_id: 2
      status: failed
      failed_stage: retriever
  shared_retriever_attempted: true
  no_candidates_started: true
  successful_count: 0
  failed_count: 3
  batch_events_emitted:
    - batch_start
    - batch_complete (with failure)

anti_patterns:
  - candidates attempt to run with empty references after retriever failure
  - batch shows completed despite retriever failure
  - error attribution lost (no failed_stage information)
  - only first candidate marked failed, others stuck in pending
  - batch_complete event not emitted

notes:
  - Tests retriever as batch-wide failure point
  - Retriever is the only shared stage, so its failure is catastrophic
  - All candidates should fail with same attribution
  - Batch should still emit terminal event (batch_complete with failure)

tags:
  - mutation
  - batch
  - batch-partial-failure
  - retriever-failure
  - cascade-failure
  - orchestration

id: GD-005-M-boundary-01
priority: P1
layer: orchestration
title: Artifact Not Surfaced With No Rendered Output And Cache Invalidation
source: mutation
operators:
  - artifact-not-surfaced
  - no-rendered-output
  - cache-invalidation
parent: GD-005
intent: When an artifact exists but is not surfaced to UI, and rendered output is missing due to cache issues, the system must detect and recover from cache invalidation.

input:
  mode: plot
  prompt: "Create a box plot of salary distribution by department."
  retrieval_mode: auto
  visualizer_behavior:
    generates_artifact: true
    artifact_storage_successful: true
    cache_invalidation_occurred: true
    cache_invalidation_reason: "storage_backend_restart"
  renderer_behavior:
    cannot_find_cached_artifact: true
    fallback_attempted: true

expected:
  final_status: completed
  artifact_must_be_surfaceable: true
  cache_recovery_must_succeed: true
  recovery_behavior:
    - detected_cache_miss: true
    - retrieved_from_primary_storage: true
    - rebuilt_cache: true
  must_have_final_artifact: true
  rendered_output_must_exist: true
  ui_must_show:
    - completed status
    - artifact available for download
  session_metadata_must_include:
    - cache_invalidation_detected: true
    - cache_rebuild_performed: true

anti_patterns:
  - artifact exists but UI shows nothing
  - cache invalidation causes complete failure
  - no attempt to recover from primary storage
  - cache not rebuilt, causing future failures
  - user told artifact does not exist when it does

notes:
  - Tests the boundary between storage, caching, and UI surfacing.
  - Cache invalidation is a common operational event.
  - Artifacts in primary storage must always be recoverable.

tags:
  - mutation
  - boundary-combination
  - artifact-not-surfaced
  - no-rendered-output
  - cache-invalidation
  - storage-resilience

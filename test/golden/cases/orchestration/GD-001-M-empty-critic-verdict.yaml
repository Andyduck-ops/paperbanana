id: GD-001-M-empty-critic-verdict
priority: P1
layer: orchestration
title: Critic Returns Empty Verdict
source: mutation
operator: empty-critic-verdict
parent: GD-001
intent: System must handle an empty critic verdict gracefully and complete with a warning rather than crashing or showing false success.

input:
  mode: diagram
  prompt: "Create a diagram showing microservices communication patterns."
  retrieval_mode: auto
  inject_critic_result:
    status: completed
    verdict: null
    structured_content: null

expected:
  must_handle_gracefully: true
  final_status: completed
  must_have_final_artifact: true
  critic_result_handling:
    - warning_or_info_log_must_be_emitted: true
    - artifact_must_still_be_available: true
  session_state_must_include:
    - critic_completed: true
    - critic_verdict_empty: true

anti_patterns:
  - system crashes trying to parse null verdict
  - final_status is failed due to empty critic response
  - artifact is withheld because critic verdict is empty
  - error like "cannot read property of null" in critic handler
  - critic stage is marked as failed despite completing execution

notes:
  - Tests graceful handling when critic produces no structured content.
  - Critic verdict is advisory, not blocking for artifact availability.
  - Empty verdict is a degraded state, not a failure state.
  - User should still be able to access the generated artifact.

tags:
  - mutation
  - artifact-presence
  - critic
  - empty-verdict
  - degraded-state

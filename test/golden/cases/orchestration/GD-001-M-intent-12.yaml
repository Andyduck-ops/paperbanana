id: GD-001-M-intent-12
priority: P1
layer: orchestration
title: Conflicting User Examples Must Be Reconciled Or Flagged
source: mutation
operator: intent-conflicting-examples
parent: GD-001
intent: When a user provides multiple examples that have conflicting characteristics, the system must reconcile the conflict or flag it for clarification rather than arbitrarily choosing one example's characteristics.

input:
  mode: diagram
  prompt: "Create a workflow diagram combining the style of these two examples."
  retrieval_mode: auto
  reference_image_1: "minimalist black-and-white flowchart with simple boxes"
  reference_image_2: "colorful detailed flowchart with icons and gradients"

expected:
  one_of:
    - final_status: completed
      conflict_reconciliation_must_be_logged: true
      artifact_must_combine_elements_from_both: true
      reconciliation_strategy_must_be_documented: true
    - final_status: failed
      error_must_identify_conflict: true
      error_must_list_conflicting_characteristics: true
      error_must_ask_for_preference: true
  must_detect_example_conflict: true
  must_not_silently_prefer_one_example: true

anti_patterns:
  - system uses only first example's style ignoring the second
  - system uses only second example's style ignoring the first
  - artifact is inconsistent mixing styles randomly
  - no acknowledgment that the examples have conflicting characteristics
  - reconciliation strategy is not documented

notes:
  - "Minimalist B&W" and "colorful detailed with icons" are diametrically opposed.
  - The system should recognize this conflict.
  - Resolution could be: combine structure from one, color from other, or ask user.
  - This tests multi-reference intent reconciliation.

tags:
  - mutation
  - user-intent-edge
  - intent-conflicting-examples
  - multi-reference-reconciliation
  - style-conflict-resolution

id: GD-001-M-cognitive-silent-partial-failure
priority: P1
layer: orchestration
title: Silent Partial Failure Creates False Completion Appearance
source: mutation
operator: cognitive-silent-partial-failure
parent: GD-001
intent: When 4 of 5 stages complete but critic fails, the system must not present the task as "almost done" to the user. This creates a false sense of confidence that can mislead users into believing the output is validated when it is not.

input:
  mode: diagram
  prompt: "Create a diagram showing microservices architecture with API gateway"
  retrieval_mode: auto
  inject_failure:
    stage: critic
    type: timeout
    timing: after_visualizer_complete

expected:
  final_status: failed
  must_emit_failure_event: true
  failure_must_indicate_stage: critic
  must_not_show_partial_success_as_complete: true
  user_must_know_validation_skipped: true
  must_preserve_partial_artifacts: true
  must_offer_retry_from_checkpoint: true

anti_patterns:
  - UI shows "4/5 stages complete" as a success metric when critic failed
  - final_status shows "completed" despite critic never running
  - system presents the unvalidated artifact as final output
  - user is not informed that quality validation was skipped
  - partial artifacts are discarded without user knowledge
  - user cannot retry just the failed critic stage
  - progress percentage shows 80% complete suggesting success is imminent

notes:
  - This is a classic user cognitive trap: partial success looks like success.
  - Users trust "almost done" indicators and may not realize validation failed.
  - The artifact from visualizer exists but lacks the critic stamp of approval.
  - System must clearly communicate: "artifact generated but NOT validated".
  - This protects users from trusting unvalidated output.

tags:
  - mutation
  - user-cognitive-trap
  - partial-failure
  - false-confidence
  - validation-skipped
  - progress-misleading

id: GD-BATCH-023
priority: P1
layer: orchestration
title: Batch Resume After Partial Completion
source: mutation
operator: batch-resume-partial
parent: GD-003
intent: When a batch was partially completed before a crash, resuming the batch must skip already-completed candidates and only execute the remaining ones.

input:
  mode: diagram
  batch_size: 4
  prompts:
    - "Create a diagram of a vision transformer"
    - "Create a diagram of a Swin transformer"
    - "Create a diagram of a ViT patch embedding"
    - "Create a diagram of a multi-scale feature pyramid"
  retrieval_mode: shared
  pre_existing_state:
    - candidate_id: 0
      status: completed
      has_artifact: true
    - candidate_id: 1
      status: completed
      has_artifact: true
    - candidate_id: 2
      status: pending
      has_artifact: false
    - candidate_id: 3
      status: pending
      has_artifact: false
  resume_from_crash: true

expected:
  batch_final_status: completed
  per_task_status:
    - candidate_id: 0
      status: completed
      was_skipped_on_resume: true
      artifact_preserved: true
    - candidate_id: 1
      status: completed
      was_skipped_on_resume: true
      artifact_preserved: true
    - candidate_id: 2
      status: completed
      executed_on_resume: true
      must_have_artifact: true
    - candidate_id: 3
      status: completed
      executed_on_resume: true
      must_have_artifact: true
  retriever_call_count: 1
  only_pending_candidates_executed: true
  no_re_execution_of_completed: true
  original_artifacts_preserved: true

anti_patterns:
  - candidates 0 and 1 re-executed unnecessarily
  - retriever called again despite cached references
  - original artifacts overwritten on resume
  - all candidates marked as new execution
  - batch fails to detect pre-existing completed state

notes:
  - Tests batch resume with partial completion
  - Candidates 0 and 1 already completed before crash
  - Resume should only execute candidates 2 and 3
  - Original artifacts must be preserved
  - Retriever should use cached references

tags:
  - mutation
  - batch
  - batch-complexity
  - resume-partial
  - crash-recovery
  - idempotency
  - orchestration

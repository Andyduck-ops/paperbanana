id: GD-005
priority: P0
layer: orchestration
title: UI State Truthfulness
source: seed
intent: The system must expose truthful, structured execution state at every major lifecycle boundary so the UI can render an accurate representation without guessing.

input:
  scenarios:
    - name: running
      description: task has been started and is mid-execution
    - name: completed
      description: task has finished all stages successfully
    - name: failed
      description: task has failed at a known stage
    - name: resumed
      description: task was resumed from a snapshot

expected:
  running:
    session_status: running
    current_stage: visible and non-empty
    must_emit_stage_events: true
  completed:
    session_status: completed
    must_have_final_artifact: true
    current_stage: the final stage name
  failed:
    session_status: failed
    failed_stage: non-empty and accurate
    must_emit_failure_event: true
  resumed:
    session_status: running
    resume_metadata_preserved: true
    current_stage: the resumed stage name

anti_patterns:
  - session_status is running permanently with no stage update
  - session_status is completed but current_stage is empty
  - session_status is failed but failed_stage is empty or generic
  - resumed session appears identical to a fresh session with no resume markers
  - stage events are emitted inconsistently across lifecycle transitions

notes:
  - This case is the bridge between orchestration and UI layers.
  - It does not test what the UI renders. It tests what data the system exposes.
  - The UI Golden Data layer builds on top of what this case pins.
  - All four scenarios should be evaluated independently.

tags:
  - orchestration
  - ui-bridge
  - session-state
  - event-emission
  - lifecycle
  - truthfulness

id: GD-002-M-boundary-02
priority: P1
layer: orchestration
title: Partial Plan With Ambiguous Prompt And Stylist Failure
source: mutation
operators:
  - partial-plan-from-planner
  - ambiguous-prompt
  - fail-at-stylist
parent: GD-002
intent: When an ambiguous prompt leads to a partial plan and stylist fails, the system must correctly attribute the failure chain and provide actionable guidance.

input:
  mode: diagram
  prompt: "Create a diagram of the system"  # Ambiguous - no specific system mentioned
  retrieval_mode: auto
  planner_behavior:
    returns_partial_plan: true
    partial_plan_missing_fields:
      - component_types
      - layout_strategy
    ambiguity_warning_emitted: true
  inject_failure_at: stylist
  failure_type: processing_error

expected:
  final_status: failed
  failed_stage: stylist
  must_expose_progress: true
  failure_chain_must_show:
    - input: ambiguous_prompt
    - intermediate: partial_plan_generated_with_warnings
    - terminal: stylist_processing_error
  planner_completed_with_warnings: true
  stylist_received_insufficient_input: true
  ui_must_show:
    - stylist failure with context
    - suggestion to clarify prompt
    - indication that planner generated partial plan due to ambiguity

anti_patterns:
  - failure attributed solely to stylist without upstream context
  - ambiguity warning from planner lost
  - user not informed that prompt clarification could help
  - partial plan treated as complete and passed downstream silently
  - error message does not mention prompt ambiguity

notes:
  - Tests failure attribution when ambiguity propagates through stages.
  - Each stage's contribution to the failure must be traceable.
  - User should receive actionable guidance to resolve the root cause.

tags:
  - mutation
  - boundary-combination
  - partial-plan-from-planner
  - ambiguous-prompt
  - fail-at-stylist
  - failure-chain-attribution

id: GD-BATCH-009
priority: P1
layer: orchestration
title: Batch Resource Contention Cascade
source: mutation
operator: batch-resource-contention
parent: GD-002
intent: When one candidate consumes excessive resources, subsequent candidates must fail with clear resource-exhaustion errors without crashing the batch.

input:
  mode: diagram
  batch_size: 4
  prompts:
    - "Create a diagram of a very complex neural network with 500 layers"
    - "Create a diagram of a simple perceptron"
    - "Create a diagram of a basic RNN"
    - "Create a diagram of a small transformer"
  retrieval_mode: shared
  inject_resource_scenario:
    - candidate_id: 0
      memory_spike_mb: 4096
      duration_ms: 5000
    - candidate_id: 2
      memory_limit_mb: 512

expected:
  batch_final_status: completed
  per_task_status:
    - candidate_id: 0
      status: completed
      high_memory_usage: true
    - candidate_id: 1
      status: completed
      must_have_artifact: true
    - candidate_id: 2
      status: failed
      failure_reason: "resource_exhaustion"
      error_contains: ["OOM", "memory", "insufficient"]
    - candidate_id: 3
      status: completed
      must_have_artifact: true
  resource_contention_detected: true
  isolation_boundary_preserved: true
  batch_did_not_crash: true

anti_patterns:
  - candidate 2 failure causes batch-wide crash
  - resource exhaustion propagates to other candidates
  - no clear distinction between logical error and resource error
  - memory limits not enforced per-candidate
  - candidate 0 memory spike affects all subsequent candidates

notes:
  - Tests resource isolation between batch candidates
  - Candidate 0 intentionally spikes memory
  - Candidate 2 has memory limit applied
  - System must isolate resource failures
  - Other candidates should complete normally

tags:
  - mutation
  - batch
  - batch-complexity
  - resource-contention
  - memory-isolation
  - orchestration

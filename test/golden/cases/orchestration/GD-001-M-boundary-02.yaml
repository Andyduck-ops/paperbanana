id: GD-001-M-boundary-02
priority: P1
layer: orchestration
title: Empty Corpus With Batch Partial Failure And UI State Consistency
source: mutation
operators:
  - retrieval-empty-corpus
  - batch-partial-failure
  - ui-running-state
parent: GD-001
intent: When batch processing encounters empty corpus for some candidates and partial failures for others, UI must accurately reflect the mixed state without showing stale running indicators.

input:
  mode: plot
  batch_size: 3
  prompts:
    - "Create a histogram of population distribution"
    - "Create a scatter plot of correlation data"
    - "Create a bar chart of quarterly revenue"
  retrieval_mode: per_task
  retrieval_results:
    - candidate_0: empty_corpus
    - candidate_1: normal
    - candidate_2: normal_with_inject_failure_at_visualizer
  inject_failure_at: visualizer
  failure_candidate: 2

expected:
  batch_final_status: partial_failure
  per_task_status:
    - candidate_id: 0
      status: failed
      failure_stage: retriever
      failure_reason: empty_corpus
    - candidate_id: 1
      status: completed
    - candidate_id: 2
      status: failed
      failure_stage: visualizer
  successful_count: 1
  failed_count: 2
  ui_must_show:
    - candidate 0 failed with empty corpus message
    - candidate 1 completed successfully
    - candidate 2 failed at visualizer
  no_stale_running_indicators: true

anti_patterns:
  - UI shows all candidates as running after completion
  - Empty corpus failure cascades to other candidates
  - Partial batch failure causes entire batch to show as failed
  - Candidate 2's visualizer failure attributed to wrong candidate
  - Running indicator remains for failed candidates

notes:
  - Tests complex state management with multiple simultaneous boundary conditions.
  - Empty corpus is a legitimate input condition, not an error.
  - Batch state must be isolated per-candidate.

tags:
  - mutation
  - boundary-combination
  - retrieval-empty-corpus
  - batch-partial-failure
  - ui-running-state
  - state-isolation

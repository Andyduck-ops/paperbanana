id: GD-002-M-no-artifact-from-retriever
priority: P1
layer: orchestration
title: Stage Failure With Preceding Empty Retrieval
source: mutation
operator: no-artifact-from-retriever
parent: GD-002
intent: Failure attribution must remain accurate even when retriever returned empty bundle earlier in the pipeline.

input:
  mode: diagram
  prompt: "Create a diagram of a transformer attention mechanism."
  retrieval_mode: auto
  inject_retriever_result: empty_bundle
  inject_failure_at: planner

expected:
  final_status: failed
  failed_stage: planner
  retriever_must_return_empty: true
  stages_must_not_run_after_failure:
    - stylist
    - visualizer
    - critic
  must_expose_progress: true
  must_have_final_artifact: false

anti_patterns:
  - failed_stage incorrectly attributed to retriever due to empty bundle
  - error message blames "no references" instead of actual planner failure
  - pipeline continues to stylist after planner failure
  - empty retrieval result logged as error causing confusion in failure analysis

notes:
  - Tests that failure attribution is independent of empty artifact results.
  - Empty retriever bundle should not cause confusion about where the actual failure occurred.
  - The planner failure is the real failure point, not the empty retrieval.

tags:
  - mutation
  - artifact-presence
  - failure-attribution
  - retriever
  - empty-bundle

id: GD-BATCH-001
priority: P1
layer: orchestration
title: Batch All Succeed
source: mutation
operator: batch-all-succeed
parent: GD-001
intent: A batch of multiple candidates must complete all tasks successfully and share retriever results across all candidates.

input:
  mode: diagram
  batch_size: 3
  prompts:
    - "Create a diagram of a neural network architecture"
    - "Create a diagram of a transformer model"
    - "Create a diagram of an attention mechanism"
  retrieval_mode: shared

expected:
  batch_final_status: completed
  per_task_status:
    - candidate_id: 0
      status: completed
      must_have_artifact: true
    - candidate_id: 1
      status: completed
      must_have_artifact: true
    - candidate_id: 2
      status: completed
      must_have_artifact: true
  shared_retriever_used: true
  retriever_call_count: 1
  successful_count: 3
  failed_count: 0
  batch_events_emitted:
    - batch_start
    - candidate_start (x3)
    - candidate_complete (x3)
    - batch_complete

anti_patterns:
  - retriever called once per candidate instead of shared
  - one candidate failure causes entire batch to fail
  - shared references not properly propagated to all planners
  - batch completes but individual artifacts missing
  - batch_result shows successful=0 despite all completing

notes:
  - Tests the core batch contract: shared retriever + parallel execution
  - Verifies retriever is called exactly once, not per-candidate
  - All candidates should receive identical RetrievedReferences
  - Each candidate should have independent session IDs

tags:
  - mutation
  - batch
  - batch-all-succeed
  - shared-retriever
  - orchestration

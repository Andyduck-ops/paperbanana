id: GD-002-M-fail-at-critic
priority: P1
layer: orchestration
title: Critic Stage Failure Attribution
source: mutation
operator: fail-at-critic
parent: GD-002
intent: When the critic stage fails after successful artifact generation, the system must record the exact failure boundary and preserve the generated artifact.

input:
  mode: diagram
  prompt: "Create a diagram explaining photosynthesis in plants."
  retrieval_mode: auto
  inject_failure_at: critic

expected:
  final_status: failed
  failed_stage: critic
  must_expose_progress: true
  must_have_final_artifact: true
  stages_completed_before_failure:
    - retriever
    - planner
    - stylist
    - visualizer

anti_patterns:
  - failed_stage reported as "validation error" instead of critic
  - visualizer shown as failed when only critic failed
  - artifact deleted or not persisted due to critic failure
  - UI shows no artifact even though one was generated
  - system attempts to retry entire pipeline instead of just critic

notes:
  - Critic failure is unique because an artifact was already created.
  - The artifact must be preserved and accessible.
  - This tests whether the system distinguishes artifact generation from quality validation.

tags:
  - mutation
  - failure-location
  - critic
  - late-failure
  - artifact-preservation

id: GD-003-M-resume-with-corrupted-snapshot+ui-failed-with-location
priority: P1
layer: orchestration
title: Corrupted Snapshot Leads to Graceful Failure With Location
source: mutation
operators:
  - resume-with-corrupted-snapshot
  - ui-failed-with-location
parent: GD-003
intent: When a snapshot is corrupted or incomplete, resume must fail gracefully with a clear error location rather than crashing or producing incorrect output.

input:
  mode: diagram
  prompt: "Create a diagram showing data pipeline architecture."
  retrieval_mode: auto
  snapshot_captured_after: planner
  snapshot_corrupted: true
  corruption_type: missing_planner_output
  resume_from: stylist

expected:
  final_status: failed
  failed_stage: resume
  must_expose_progress: true
  failure_reason: snapshot_corrupted_or_incomplete
  ui_must_show:
    - failed status indicator
    - clear indication that resume failed
    - error message about snapshot corruption
  must_have_final_artifact: false

anti_patterns:
  - system crashes with unhandled exception
  - resume proceeds with empty planner output causing downstream chaos
  - failure is attributed to stylist instead of resume boundary
  - UI shows running indefinitely with no error state
  - error message is generic with no mention of snapshot issue

notes:
  - Tests defensive handling of corrupted persistence state.
  - The resume boundary is a critical failure point that must be handled gracefully.
  - Users should understand that the issue is with snapshot integrity, not the current prompt.

tags:
  - mutation
  - combined
  - resume-with-corrupted-snapshot
  - ui-failed-with-location
  - error-recovery

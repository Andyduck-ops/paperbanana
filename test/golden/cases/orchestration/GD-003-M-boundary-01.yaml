id: GD-003-M-boundary-01
priority: P1
layer: orchestration
title: Corrupted Snapshot Schema Mismatch With Empty Output Recovery
source: mutation
operators:
  - corrupted-snapshot-schema-mismatch
  - empty-output-recovery
parent: GD-003
intent: When a snapshot has schema version mismatch and outputs are empty, the system must attempt recovery by regenerating from the last valid stage rather than failing completely.

input:
  mode: diagram
  prompt: "Create a sequence diagram of API request flow."
  retrieval_mode: auto
  snapshot_captured_after: planner
  snapshot_schema_version: "1.0.0"
  current_schema_version: "2.0.0"
  schema_mismatch_handling: attempt_recovery
  planner_output_in_snapshot: empty_or_invalid

expected:
  final_status: completed
  recovery_behavior:
    - detected_schema_mismatch: true
    - detected_empty_output: true
    - reran_planner_from_scratch: true
    - preserved_retriever_results: true
  recovery_must_not_rerun:
    - retriever
  must_have_final_artifact: true
  ui_must_show:
    - recovery notification
    - indication that planner was regenerated
  session_metadata_must_include:
    - schema_migration_performed: true

anti_patterns:
  - entire session fails due to schema mismatch
  - retriever rerun unnecessarily during recovery
  - empty output not detected, causing downstream failures
  - no indication to user that recovery occurred
  - session metadata does not record migration event

notes:
  - Tests resilience to version drift and data corruption simultaneously.
  - Recovery should be intelligent - rerun only what's necessary.
  - Schema migrations are common during system upgrades.

tags:
  - mutation
  - boundary-combination
  - corrupted-snapshot-schema-mismatch
  - empty-output-recovery
  - schema-migration
  - intelligent-recovery

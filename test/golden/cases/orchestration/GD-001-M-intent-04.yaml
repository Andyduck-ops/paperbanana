id: GD-001-M-intent-04
priority: P1
layer: orchestration
title: Implicit Intent From Example Must Be Inferred Correctly
source: mutation
operator: implicit-intent-inference
parent: GD-001
intent: When the user provides an example image or reference without explicit instructions, the system must infer the user's intent (style, format, content) from the example rather than asking for explicit specification.

input:
  mode: diagram
  prompt: "Make something like this."
  retrieval_mode: auto
  reference_image: embedded_reference_style_image
  reference_image_description: "A minimalist black-and-white flowchart with rounded rectangles and simple arrows"

expected:
  final_status: completed
  must_infer_style_from_reference: true
  inferred_style_must_match_reference: true
  artifact_style_keywords_must_include_one_of:
    - "minimalist"
    - "black"
    - "white"
    - "simple"
    - "rounded"
  inference_confidence_must_be_logged: true
  must_not_ask_for_clarification_when_reference_is_clear: true

anti_patterns:
  - system ignores the reference image and produces default style diagram
  - system asks for explicit style specification despite having clear reference
  - inferred style is completely different from reference (e.g., colorful instead of B&W)
  - system fails because prompt alone is insufficient without reference consideration
  - reference image is acknowledged but not used in actual generation

notes:
  - The prompt "Make something like this" has almost no semantic content on its own.
  - Intent inference must come entirely from the reference image.
  - A good system would extract style, layout, and conventions from the example.
  - This tests implicit intent inference capability.
  - Verification: artifact style keywords match reference image description.
  - Reference image is "minimalist black-and-white flowchart with rounded rectangles".

tags:
  - mutation
  - user-intent-edge
  - implicit-intent-inference
  - reference-based-intent
  - style-transfer

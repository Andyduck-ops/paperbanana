id: GD-BATCH-016
priority: P1
layer: orchestration
title: Batch Shared Retriever Failure
source: mutation
operator: batch-retriever-failure
parent: GD-002
intent: When the shared retriever fails for a batch, all candidates must fail with clear attribution to the retriever stage, not later stages.

input:
  mode: diagram
  batch_size: 4
  prompts:
    - "Create a diagram of a BERT model"
    - "Create a diagram of a RoBERTa model"
    - "Create a diagram of a GPT architecture"
    - "Create a diagram of a T5 model"
  retrieval_mode: shared
  inject_failures:
    - stage: retriever
      error_message: "Shared retriever service unavailable"
      error_type: "network_error"
      affects_all: true

expected:
  batch_final_status: failed
  per_task_status:
    - candidate_id: 0
      status: failed
      failed_stage: retriever
      error_type: "network_error"
    - candidate_id: 1
      status: failed
      failed_stage: retriever
      error_type: "network_error"
    - candidate_id: 2
      status: failed
      failed_stage: retriever
      error_type: "network_error"
    - candidate_id: 3
      status: failed
      failed_stage: retriever
      error_type: "network_error"
  all_fail_at_same_stage: true
  retriever_failure_propagated: true
  no_candidates_reached_planner: true
  shared_failure_root_cause: true

anti_patterns:
  - some candidates fail at retriever, others at planner
  - retriever failure causes batch to hang
  - candidates attempt to proceed without retriever output
  - error message not propagated to all candidates
  - candidates fail at different stages due to missing references

notes:
  - Tests shared retriever failure handling
  - All candidates must fail at retriever stage
  - None should proceed to planner
  - Error attribution must be consistent across all
  - Demonstrates shared dependency vulnerability

tags:
  - mutation
  - batch
  - batch-complexity
  - shared-failure
  - retriever-failure
  - dependency-failure
  - orchestration

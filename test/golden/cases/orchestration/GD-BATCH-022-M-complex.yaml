id: GD-BATCH-022
priority: P1
layer: orchestration
title: Batch Large Scale Execution
source: mutation
operator: batch-large-scale
parent: GD-002
intent: When executing a large batch (10 candidates), the system must handle resource management, parallelism limits, and result aggregation correctly.

input:
  mode: diagram
  batch_size: 10
  prompts:
    - "Create a diagram of layer 1"
    - "Create a diagram of layer 2"
    - "Create a diagram of layer 3"
    - "Create a diagram of layer 4"
    - "Create a diagram of layer 5"
    - "Create a diagram of layer 6"
    - "Create a diagram of layer 7"
    - "Create a diagram of layer 8"
    - "Create a diagram of layer 9"
    - "Create a diagram of layer 10"
  retrieval_mode: shared
  parallelism_limit: 3
  inject_failures:
    - candidate_id: 4
      stage: planner
    - candidate_id: 7
      stage: visualizer

expected:
  batch_final_status: completed
  per_task_status:
    - candidate_id: 0
      status: completed
    - candidate_id: 1
      status: completed
    - candidate_id: 2
      status: completed
    - candidate_id: 3
      status: completed
    - candidate_id: 4
      status: failed
      failed_stage: planner
    - candidate_id: 5
      status: completed
    - candidate_id: 6
      status: completed
    - candidate_id: 7
      status: failed
      failed_stage: visualizer
    - candidate_id: 8
      status: completed
    - candidate_id: 9
      status: completed
  parallelism_respected: true
  max_concurrent_candidates: 3
  shared_retriever_used: true
  retriever_call_count: 1
  successful_count: 8
  failed_count: 2
  all_results_aggregated: true

anti_patterns:
  - all 10 candidates run simultaneously
  - parallelism limit ignored
  - retriever called 10 times instead of once
  - some candidates lost in aggregation
  - memory exhaustion due to unbounded parallelism

notes:
  - Tests large batch handling with parallelism limits
  - Max 3 candidates should run concurrently
  - Shared retriever called once for all 10
  - 8 completed, 2 failed
  - All results must be in final aggregation

tags:
  - mutation
  - batch
  - batch-complexity
  - large-scale
  - parallelism
  - resource-management
  - orchestration

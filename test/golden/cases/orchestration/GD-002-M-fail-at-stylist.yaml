id: GD-002-M-fail-at-stylist
priority: P1
layer: orchestration
title: Stylist Stage Failure Attribution
source: mutation
operator: fail-at-stylist
parent: GD-002
intent: When the stylist stage fails, the system must record the exact failure boundary, show retriever and planner as completed, and block visualizer/critic from running.

input:
  mode: diagram
  prompt: "Create a diagram illustrating quantum entanglement between two particles."
  retrieval_mode: auto
  inject_failure_at: stylist

expected:
  final_status: failed
  failed_stage: stylist
  must_expose_progress: true
  must_have_final_artifact: false
  stages_completed_before_failure:
    - retriever
    - planner
  downstream_stages_must_not_run:
    - visualizer
    - critic

anti_patterns:
  - visualizer runs despite stylist failure
  - failed_stage reported as "rendering error" instead of stylist
  - planner shown as failed when only stylist failed
  - UI shows all stages as failed instead of partial completion
  - no distinction between completed stages and the failed stage

notes:
  - Stylist failure tests the boundary between planning and rendering.
  - Both retriever and planner must be recorded as completed.
  - The error must be attributed to stylist, not visualizer.

tags:
  - mutation
  - failure-location
  - stylist
  - mid-pipeline-failure

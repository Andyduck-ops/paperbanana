id: GD-003
priority: P0
layer: orchestration
title: Snapshot Resume Correctness
source: seed
intent: A resumed session must continue from the correct stage boundary using intact prior state, and must not rerun completed stages or lose intermediate artifacts.

input:
  mode: diagram
  prompt: "Create a diagram showing a retrieval-augmented generation pipeline."
  retrieval_mode: auto
  snapshot_captured_after: planner
  resume_from: stylist

expected:
  final_status: completed
  stages_must_not_rerun:
    - retriever
    - planner
  stages_continued:
    - stylist
    - visualizer
    - critic
  must_have_final_artifact: true
  must_persist_session: true
  resume_metadata_preserved: true

anti_patterns:
  - full pipeline reruns from retriever despite valid snapshot
  - planner output is lost after restore causing stylist to receive empty input
  - duplicate artifact entries caused by partial rerun
  - resume produces different artifact chain than original run would have
  - session status shows running indefinitely after resume

notes:
  - The snapshot boundary in this seed case is after planner.
  - Mutation variants should test each possible snapshot boundary independently.
  - The corrupted-snapshot variant belongs in a mutation, not this seed.
  - Resume correctness is one of the highest-value contracts in this system.

tags:
  - orchestration
  - resume
  - snapshot
  - state-preservation
  - artifact-continuity

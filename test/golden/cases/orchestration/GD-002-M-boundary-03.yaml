id: GD-002-M-boundary-03
priority: P1
layer: orchestration
title: Batch With Shared Retrieval Failure And Candidate State Divergence
source: mutation
operators:
  - batch-shared-retrieval-failure
  - candidate-state-divergence
parent: GD-002
intent: When batch processing uses shared retrieval that fails, candidates must not all fail if they have alternative retrieval paths or cached data.

input:
  mode: diagram
  batch_size: 4
  prompts:
    - "Create a diagram of neural network layers"
    - "Create a diagram of transformer architecture"
    - "Create a diagram of CNN convolution process"
    - "Create a diagram of RNN cell structure"
  retrieval_mode: shared
  shared_retrieval_failure: true
  failure_type: service_unavailable
  candidate_configurations:
    - candidate_0: no_cache_fallback
    - candidate_1: has_cache_fallback
    - candidate_2: no_cache_fallback
    - candidate_3: has_cache_fallback

expected:
  batch_final_status: partial_failure
  per_task_status:
    - candidate_id: 0
      status: failed
      failure_stage: retriever
      failure_reason: shared_retrieval_unavailable
    - candidate_id: 1
      status: completed
      retrieval_source: cache_fallback
    - candidate_id: 2
      status: failed
      failure_stage: retriever
      failure_reason: shared_retrieval_unavailable
    - candidate_id: 3
      status: completed
      retrieval_source: cache_fallback
  successful_count: 2
  failed_count: 2
  shared_retrieval_failure_isolated: true

anti_patterns:
  - all candidates fail due to shared retrieval failure
  - cache fallback candidates still marked as failed
  - successful candidates show wrong retrieval source
  - shared failure causes batch to abort entirely
  - candidate state corruption from shared error handling

notes:
  - Tests isolation of shared resource failures in batch context.
  - Candidates with fallback mechanisms should succeed independently.
  - Shared retrieval failure should not cascade to all candidates.

tags:
  - mutation
  - boundary-combination
  - batch-shared-retrieval-failure
  - candidate-state-divergence
  - fallback-mechanisms
  - isolation

id: GD-BATCH-013
priority: P1
layer: orchestration
title: Batch Retry Storm Exhaustion
source: mutation
operator: batch-retry-storm
parent: GD-002
intent: When multiple candidates fail and retry indefinitely, the system must enforce retry limits to prevent resource exhaustion while still completing successful candidates.

input:
  mode: diagram
  batch_size: 5
  prompts:
    - "Create a diagram of a convolutional layer"
    - "Create a diagram of a pooling operation"
    - "Create a diagram of a batch normalization"
    - "Create a diagram of a dropout layer"
    - "Create a diagram of a residual connection"
  retrieval_mode: shared
  inject_failures:
    - candidate_id: 1
      stage: planner
      error_message: "Transient planner error"
      retry_behavior: always_fail
    - candidate_id: 3
      stage: visualizer
      error_message: "Transient visualizer error"
      retry_behavior: always_fail
  retry_config:
    max_retries: 3
    retry_delay_ms: 100

expected:
  batch_final_status: completed
  per_task_status:
    - candidate_id: 0
      status: completed
      must_have_artifact: true
    - candidate_id: 1
      status: failed
      failed_stage: planner
      retry_count: 3
      exhausted_retries: true
    - candidate_id: 2
      status: completed
      must_have_artifact: true
    - candidate_id: 3
      status: failed
      failed_stage: visualizer
      retry_count: 3
      exhausted_retries: true
    - candidate_id: 4
      status: completed
      must_have_artifact: true
  retry_limits_enforced: true
  no_infinite_retry: true
  successful_candidates_not_blocked: true
  total_retry_count_bounded: true

anti_patterns:
  - retries continue indefinitely without limit
  - retry storm blocks successful candidates
  - no distinction between transient and permanent failures
  - retry count not tracked per-candidate
  - resource exhaustion due to unbounded retries

notes:
  - Tests retry limit enforcement in batch context
  - Candidates 1 and 3 always fail on retry
  - System must stop after max_retries attempts
  - Other candidates must complete without blocking
  - Total retries bounded to prevent resource exhaustion

tags:
  - mutation
  - batch
  - batch-complexity
  - retry-storm
  - retry-limit
  - resource-protection
  - orchestration

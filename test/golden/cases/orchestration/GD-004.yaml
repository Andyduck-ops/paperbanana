id: GD-004
priority: P0
layer: orchestration
title: Retrieval Constrains Planning
source: seed
intent: Retrieved references must have observable causal influence on planner input. The retriever stage must not be decorative.

input:
  mode: diagram
  prompt: "Create a diagram showing how attention heads work in a transformer."
  retrieval_mode: manual
  injected_references:
    - id: ref_transformer_attention
      summary: "Transformer attention mechanism with multi-head structure"
      content: "Detailed description of query, key, value attention computation."
      path_to_gt_image: "ref_transformer_attention.png"

expected:
  final_status: completed
  retriever_must_produce_bundle: true
  planner_must_receive_bundle: true
  retriever_artifact_must_contain:
    - "ref_transformer_attention"
  plan_artifact_must_contain:
    - "attention"
    - "query"
    - "key"
    - "value"
  artifact_flow_must_preserve_bundle: true

anti_patterns:
  - retriever runs and produces bundle but planner receives empty reference list
  - planner output is identical regardless of retrieval content
  - reference bundle is generated but dropped from artifact chain before planner
  - retrieval_mode change produces no difference in planner behavior

notes:
  - This case uses manual retrieval mode to make the causal chain deterministic.
  - The assertion is not about plan quality but about information flow.
  - Verification: retriever_artifact contains the injected reference id.
  - Verification: plan_artifact contains keywords from reference content.
  - Mutation variants should cover auto, random, and none retrieval modes.

tags:
  - orchestration
  - retrieval
  - planning
  - causal-flow
  - artifact-chain
  - retrieval-constraint

id: GD-001-M-fail-at-planner-invalid
priority: P1
layer: orchestration
title: Planner Invalid Response Failure
source: mutation
operator: fail-at-planner
parent: GD-001
intent: When the planner stage receives an invalid or malformed response, the system must fail at the planner stage without attempting to interpret partial data.

input:
  mode: plot
  prompt: "Create a plot showing temperature variation over a year."
  retrieval_mode: auto
  inject_failure_at: planner
  failure_type: invalid_response

expected:
  final_status: failed
  failed_stage: planner
  must_expose_progress: true
  must_have_final_artifact: false
  stages_completed_before_failure:
    - retriever
  error_must_indicate: invalid_response
  downstream_stages_must_not_run:
    - stylist
    - visualizer
    - critic

anti_patterns:
  - system attempts to parse malformed planner output
  - planner failure cascades to show retriever as failed
  - empty or null plan passed to stylist
  - UI shows "invalid input" without stage context
  - error shows raw LLM response without sanitization

notes:
  - Invalid LLM responses are a common failure mode.
  - The system must not pass garbage data downstream.
  - Error must be specific to planner stage, not generic "parsing error".

tags:
  - mutation
  - failure-location
  - planner
  - invalid-response
  - llm-failure

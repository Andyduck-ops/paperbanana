id: GD-005-M-partial-plan-from-planner
priority: P1
layer: orchestration
title: UI State With Partial Plan
source: mutation
operator: partial-plan-from-planner
parent: GD-005
intent: Session state must expose partial plan information clearly, allowing UI to show meaningful state without hiding the incomplete data.

input:
  scenarios:
    - name: running_with_partial_plan
      description: planner returned partial plan and system is handling it
      planner_result:
        type: partial
        missing_fields:
          - layout_spec
    - name: failed_due_to_partial_plan
      description: system rejected partial plan and marked task as failed
      planner_result:
        type: partial
        missing_fields:
          - layout_spec

expected:
  running_with_partial_plan:
    session_status: running_or_recovering
    planner_stage_must_show:
      status: handling_partial
      partial_fields_present: true
  failed_due_to_partial_plan:
    session_status: failed
    failed_stage: planner
    failure_reason_must_include:
      - which_fields_were_missing
    current_stage: planner

anti_patterns:
  - partial plan fields are silently ignored
  - session_status shows completed despite incomplete plan
  - failed_stage is empty when partial plan caused failure
  - UI receives no information about which plan fields were present
  - missing fields cause undefined errors in state serialization

notes:
  - Tests UI state accuracy when planner output is incomplete.
  - The session state must carry partial plan information for debugging.
  - Clear distinction between handling (running) and rejected (failed) states.

tags:
  - mutation
  - artifact-presence
  - ui-bridge
  - planner
  - partial-plan

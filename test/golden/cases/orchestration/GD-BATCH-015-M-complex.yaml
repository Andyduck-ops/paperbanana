id: GD-BATCH-015
priority: P1
layer: orchestration
title: Batch Cancellation Mid-Flight
source: mutation
operator: batch-cancellation
parent: GD-002
intent: When a batch is cancelled while candidates are in various stages, each candidate must be stopped cleanly with correct state preservation.

input:
  mode: diagram
  batch_size: 4
  prompts:
    - "Create a diagram of a transformer encoder"
    - "Create a diagram of a transformer decoder"
    - "Create a diagram of a cross-attention mechanism"
    - "Create a diagram of a position encoding"
  retrieval_mode: shared
  inject_cancellation:
    trigger_after_candidate: 1
    cancellation_reason: "user_abort"
  execution_timing:
    - candidate_id: 0
      stage_at_cancel: completed
    - candidate_id: 1
      stage_at_cancel: completed
    - candidate_id: 2
      stage_at_cancel: visualizer
    - candidate_id: 3
      stage_at_cancel: planner

expected:
  batch_final_status: cancelled
  per_task_status:
    - candidate_id: 0
      status: completed
      must_have_artifact: true
      preserved_on_cancel: true
    - candidate_id: 1
      status: completed
      must_have_artifact: true
      preserved_on_cancel: true
    - candidate_id: 2
      status: cancelled
      cancellation_stage: visualizer
      cleanup_performed: true
    - candidate_id: 3
      status: cancelled
      cancellation_stage: planner
      cleanup_performed: true
  cancellation_propagated_to_all: true
  completed_artifacts_preserved: true
  in_progress_cleanup_verified: true

anti_patterns:
  - completed candidates' artifacts deleted on cancellation
  - in-progress candidates left in running state
  - no cleanup of partial outputs from cancelled candidates
  - cancellation not propagated to all candidates
  - batch state shows running after cancellation

notes:
  - Tests graceful cancellation handling
  - Candidates 0 and 1 completed before cancellation
  - Candidate 2 was in visualizer, 3 in planner
  - All cancelled candidates must have cleanup
  - Completed artifacts must survive cancellation

tags:
  - mutation
  - batch
  - batch-complexity
  - cancellation
  - graceful-shutdown
  - state-preservation
  - orchestration

id: GD-004-M-boundary-01
priority: P1
layer: orchestration
title: Empty Critic Verdict With Missing Mode Fallback
source: mutation
operators:
  - empty-critic-verdict
  - missing-mode-fallback
parent: GD-004
intent: When critic returns an empty verdict and mode information is missing from the session, the system must use a safe fallback mode and report the inconsistency.

input:
  mode: null  # Missing mode
  prompt: "Create a visualization of the data."
  retrieval_mode: auto
  critic_behavior:
    returns_empty_verdict: true
    verdict_is_valid_json: true
    verdict_content: {}
  mode_resolution:
    fallback_mode: plot
    reason: "mode_missing_from_session"

expected:
  final_status: completed
  mode_used: plot
  mode_resolution_must_be_logged: true
  critic_handling:
    empty_verdict_treated_as: pass_with_warning
    warning_must_be_logged: true
  must_have_final_artifact: true
  ui_must_show:
    - completed status
    - mode fallback notification
    - critic empty verdict warning
  session_metadata_must_include:
    - original_mode_missing: true
    - fallback_mode_used: plot
    - critic_empty_verdict_handled: true

anti_patterns:
  - session fails due to missing mode
  - critic empty verdict causes crash
  - mode fallback not logged or communicated
  - artifact generated with wrong mode
  - no indication that fallback occurred

notes:
  - Tests resilience when multiple configuration pieces are missing or empty.
  - Fallback modes should be conservative and safe.
  - Empty verdicts may indicate LLM parsing issues, not content issues.

tags:
  - mutation
  - boundary-combination
  - empty-critic-verdict
  - missing-mode-fallback
  - configuration-resilience
  - safe-defaults

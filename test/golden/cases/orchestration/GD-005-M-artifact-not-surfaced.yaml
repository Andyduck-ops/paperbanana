id: GD-005-M-artifact-not-surfaced
priority: P1
layer: orchestration
title: Artifact Exists But Not Surfaced To Session
source: mutation
operator: artifact-binding-failure
parent: GD-001
intent: System must ensure artifact is properly attached to session state when visualizer produces valid output. This tests OUTPUT BINDING failure - visualizer generated bytes but they are not linked to session. Distinct from GD-001-M-no-rendered-output which tests OUTPUT PRODUCTION failure.

input:
  mode: diagram
  prompt: "Create a diagram of a CI/CD pipeline."
  retrieval_mode: auto
  inject_session_artifact_state: detached

expected:
  final_status: completed
  must_handle_gracefully: true
  artifact_must_be_attached_to_session: true
  artifact_uri_must_be_resolvable: true
  session_metadata_must_include:
    - key: artifact_uri
      value_type: string
      value_pattern: "^[a-zA-Z]+://"
    - key: artifact_size_bytes
      value_type: number
      value: "> 0"
  must_emit_artifact_attached_event: true

anti_patterns:
  - visualizer completes but artifact is not reachable from session
  - UI shows completed but download or preview action fails
  - artifact exists in visualizer output but session.artifact is null
  - artifact URI is malformed or points to non-existent location
  - session state is updated before artifact is persisted

notes:
  - Tests OUTPUT BINDING validation between visualizer and session.
  - Distinct from GD-001-M-no-rendered-output:
    - This test: visualizer output exists but not bound to session (binding failure)
    - GD-001: visualizer output is empty (production failure)
  - Artifact must be persisted and URI-resolved before session marked complete.
  - This catches race conditions between stage completion and session update.
  - Verification: session metadata contains artifact_uri with valid URI scheme.
  - Verification: session metadata contains artifact_size_bytes > 0.

tags:
  - mutation
  - artifact-binding
  - session-binding
  - artifact-uri
  - handoff

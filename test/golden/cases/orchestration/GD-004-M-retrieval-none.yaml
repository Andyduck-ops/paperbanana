id: GD-004-M-retrieval-none
priority: P1
layer: orchestration
title: Retrieval Constrains Planning With None Mode
source: mutation
operator: retrieval-none
parent: GD-004
intent: Planner must still function and produce a valid plan when retrieval returns empty, demonstrating the planner does not require references to operate.

input:
  mode: diagram
  prompt: "Create a diagram showing how attention heads work in a transformer."
  retrieval_mode: none

expected:
  final_status: completed
  retriever_must_produce_empty_bundle: true
  planner_must_receive_empty_references: true
  plan_must_still_be_valid: true
  artifact_flow_must_preserve_bundle: true

anti_patterns:
  - planner fails when receiving empty reference bundle
  - plan is malformed or missing required fields due to empty retrieval
  - retriever stage crashes or hangs when retrieval_mode is none
  - downstream stages receive null instead of empty bundle

notes:
  - This is the inverse of GD-004: testing what happens when references are absent.
  - The plan may differ from one produced with references, but must be structurally valid.
  - Critical for ensuring the system works without PaperBananaBench populated.

tags:
  - mutation
  - retrieval-variation
  - retrieval-none
  - planner-resilience

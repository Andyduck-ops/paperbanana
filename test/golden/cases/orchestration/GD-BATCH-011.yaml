id: GD-BATCH-011
priority: P1
layer: orchestration
title: Batch Result Storage and Retrieval
source: mutation
operator: batch-all-succeed
parent: GD-005
intent: After batch completion, the batch result must be stored and retrievable via batch_id for download and inspection.

input:
  mode: diagram
  batch_size: 2
  prompts:
    - "Create a diagram of a pooling operation"
    - "Create a diagram of a stride operation"
  retrieval_mode: shared

expected:
  batch_final_status: completed
  batch_result_stored: true
  batch_result_retrievable: true
  retrieval_via_get_batch_result:
    batch_id: present
    successful: 2
    failed: 0
    results:
      - candidate_id: 0
        status: completed
        artifacts_present: true
      - candidate_id: 1
        status: completed
        artifacts_present: true
    timing:
      started_at: present
      completed_at: present
      duration: positive

anti_patterns:
  - batch completes but result not stored
  - GetBatchResult returns "not found" error
  - stored result missing artifacts
  - stored result has wrong candidate count
  - timing fields are zero or missing
  - result overwritten by subsequent batch

notes:
  - Tests batch result persistence contract
  - Used by download endpoint to retrieve artifacts
  - Results stored in memory (may have TTL in future)
  - Verify thread-safe access to results map

tags:
  - mutation
  - batch
  - batch-all-succeed
  - result-storage
  - retrieval
  - orchestration

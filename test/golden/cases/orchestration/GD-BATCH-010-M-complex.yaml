id: GD-BATCH-010
priority: P1
layer: orchestration
title: Batch Order Dependency Chain Failure
source: mutation
operator: batch-order-dependency
parent: GD-002
intent: When candidates have implicit ordering dependencies, failure of an earlier candidate must propagate clearly without silent corruption of dependent candidates.

input:
  mode: diagram
  batch_size: 3
  prompts:
    - "Create a base diagram of an encoder"
    - "Create a diagram extending the encoder with attention"
    - "Create a diagram extending the encoder-attention with decoder"
  retrieval_mode: shared
  inject_order_dependency:
    - depends_on: null
      candidate_id: 0
    - depends_on: 0
      candidate_id: 1
      requires_artifact_from: 0
    - depends_on: 1
      candidate_id: 2
      requires_artifact_from: 1
  inject_failures:
    - candidate_id: 0
      stage: visualizer
      error_message: "Encoder visualization failed"

expected:
  batch_final_status: completed
  per_task_status:
    - candidate_id: 0
      status: failed
      failed_stage: visualizer
    - candidate_id: 1
      status: skipped
      skip_reason: "dependency_failed"
      dependency_chain_broken: true
    - candidate_id: 2
      status: skipped
      skip_reason: "dependency_failed"
      dependency_chain_broken: true
  dependency_failure_propagated: true
  cascade_skip_correct: true
  no_silent_corruption: true

anti_patterns:
  - dependent candidates attempt execution without parent artifact
  - dependency failure causes hanging instead of skip
  - skip reason not clearly communicated
  - partial execution of dependent candidates
  - batch marked as failed instead of completed with skips

notes:
  - Tests ordered batch with explicit dependencies
  - Candidate 0 fails -> 1 and 2 must be skipped
  - Each skip must have clear dependency failure reason
  - No silent execution with missing artifacts
  - Batch should complete, not fail entirely

tags:
  - mutation
  - batch
  - batch-complexity
  - order-dependency
  - cascade-skip
  - orchestration

id: GD-001-M-time-007
priority: P2
layer: orchestration
title: Timeout During Artifact Upload
source: mutation
operator: timeout-during-upload
parent: GD-001
intent: When timeout fires during artifact upload to storage, the system must handle the partial upload correctly.

input:
  mode: plot
  prompt: "Create a scatter plot showing correlation between education and income."
  retrieval_mode: auto
  upload_timeout_scenario:
    visualizer_completes_at: T0_plus_25000
    upload_starts_at: T0_plus_25000
    upload_timeout_ms: 10000
    upload_blocked_duration_ms: 15000
    stage_timeout_ms: 30000

expected:
  final_status: failed
  error_must_indicate: upload_timeout
  must_differentiate_from: stage_timeout
  visualizer_completed: true
  artifact_upload_failed: true
  partial_upload_must_be_cleaned: true
  retry_may_be_suggested: true

anti_patterns:
  - system reports visualizer timeout when upload was the bottleneck
  - partial upload left in storage causing storage leak
  - no differentiation between generation timeout and upload timeout
  - user sees "completed" but artifact is inaccessible
  - retry button not offered when upload was the failure point

notes:
  - Tests timeout handling in post-generation steps.
  - Upload timeouts are distinct from computation timeouts.
  - Storage services may have their own timeout characteristics.
  - Cleanup of partial uploads is essential for storage hygiene.

tags:
  - mutation
  - time-sensitive
  - upload-timeout
  - artifact-storage
  - cleanup

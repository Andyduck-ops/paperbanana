id: GD-003-M-resume-after-visualizer
priority: P1
layer: orchestration
title: Resume After Visualizer Boundary
source: mutation
operator: resume-after-visualizer
parent: GD-003
intent: A resumed session must correctly continue from critic after visualizer snapshot, preserving the rendered figure for critic evaluation.

input:
  mode: diagram
  prompt: "Create a diagram showing a retrieval-augmented generation pipeline."
  retrieval_mode: auto
  snapshot_captured_after: visualizer
  resume_from: critic
  resume_context:
    visualizer_completed_normally: true
    rendered_figure_present: true
    style_instructions_applied: true

expected:
  final_status: completed
  stages_must_not_rerun:
    - retriever
    - planner
    - stylist
    - visualizer
  stages_continued:
    - critic
  must_have_final_artifact: true
  must_persist_session: true
  resume_metadata_preserved: true
  intermediate_artifacts_preserved:
    - rendered_figure_accessible_to_critic
    - plan_artifact_still_accessible
    - full_artifact_chain_intact

anti_patterns:
  - critic receives no rendered figure because visualizer output was lost
  - visualizer reruns despite valid snapshot with completed status
  - critic evaluates an empty or placeholder image instead of actual render
  - artifact chain broken between visualizer and critic on resume
  - critic receives corrupted or truncated image bytes

notes:
  - Tests the visualizer-to-critic boundary which carries the rendered figure.
  - The critic must receive the actual rendered image bytes from snapshot.
  - This boundary is critical for quality evaluation integrity.
  - Verify the rendered_figure artifact bytes are preserved byte-for-byte.

tags:
  - mutation
  - resume-boundary
  - resume-after-visualizer
  - state-preservation
  - artifact-bytes-integrity

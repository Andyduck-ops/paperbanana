id: GD-BATCH-004
priority: P1
layer: orchestration
title: Batch Concurrent States
source: mutation
operator: batch-concurrent-states
parent: GD-001
intent: Multiple candidates must be able to reach different pipeline stages simultaneously without blocking each other or corrupting shared state.

input:
  mode: diagram
  batch_size: 4
  prompts:
    - "Create a diagram of a feedforward network"
    - "Create a diagram of a residual connection"
    - "Create a diagram of a normalization layer"
    - "Create a diagram of an activation function"
  retrieval_mode: shared
  timing_control:
    candidate_0_planner_delay_ms: 100
    candidate_1_visualizer_delay_ms: 200
    candidate_2_normal: true
    candidate_3_critic_delay_ms: 150

expected:
  batch_final_status: completed
  concurrent_stage_snapshot_possible: true
  candidates_can_be_at_different_stages:
    - candidate 0 at planner while candidate 2 at visualizer
    - candidate 1 at visualizer while candidate 3 at critic
  no_shared_state_corruption: true
  per_task_status:
    - candidate_id: 0
      status: completed
    - candidate_id: 1
      status: completed
    - candidate_id: 2
      status: completed
    - candidate_id: 3
      status: completed
  successful_count: 4
  failed_count: 0

anti_patterns:
  - candidates block waiting for others to complete same stage
  - shared retriever references corrupted by parallel access
  - event sequence interleaved incorrectly (e.g., candidate events out of order)
  - one candidate's artifacts mixed with another's
  - batch state shows all candidates at same stage when timing differs

notes:
  - Tests parallel execution independence
  - Candidates should not block each other at any stage
  - Event ordering per-candidate must be preserved even if interleaved
  - Shared references must be immutable or copied per-candidate

tags:
  - mutation
  - batch
  - batch-concurrent-states
  - parallel-execution
  - orchestration

id: GD-001-M-missing-mode
priority: P1
layer: orchestration
title: Missing Generation Mode Must Be Handled Explicitly
source: mutation
operator: missing-mode
parent: GD-001
intent: When the generation mode is omitted, the system must either infer a reasonable default explicitly or reject the request with a clear error, not proceed with undefined behavior.

input:
  mode: null
  prompt: "Create a diagram explaining a multi-agent workflow for scientific figure generation."
  retrieval_mode: auto

expected:
  one_of:
    - final_status: completed
      inferred_mode_must_be_logged: true
      must_have_final_artifact: true
    - final_status: failed
      error_must_indicate_missing_mode: true
      error_message_must_be_actionable: true
  must_not_proceed_with_undefined_mode: true
  must_not_silently_default_without_logging: true

anti_patterns:
  - pipeline proceeds with mode=null causing downstream crashes
  - mode defaults silently to an unexpected value without logging the inference
  - error message says "invalid input" without mentioning the mode field
  - system uses mode from a previous request without explicit user consent
  - artifact is produced but has wrong format due to mode mismatch

notes:
  - This tests the boundary condition where a required field is missing.
  - The system contract should define whether mode is required or has a default.
  - Either explicit rejection or explicit inference is acceptable.
  - Silent fallback to an undocumented default is the anti-pattern to prevent.

tags:
  - mutation
  - input-ambiguity
  - missing-mode
  - required-field
  - explicit-handling

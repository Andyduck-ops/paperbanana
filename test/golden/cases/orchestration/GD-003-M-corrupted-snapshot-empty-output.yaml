id: GD-003-M-corrupted-snapshot-empty-output
priority: P1
layer: orchestration
title: Corrupted Snapshot With Empty Stage Output
source: mutation
operator: resume-with-corrupted-snapshot
parent: GD-003
intent: A resumed session where the snapshot stage has empty output must fail rather than proceed with garbage input to next stage.

input:
  mode: diagram
  prompt: "Create a diagram showing a retrieval-augmented generation pipeline."
  retrieval_mode: auto
  snapshot_corruption:
    type: empty_stage_output
    description: "Planner stage completed but output is empty - no plan artifact"
    stage_with_empty_output: planner
  resume_from: stylist
  resume_context:
    snapshot_file_exists: true
    planner_status_completed: true
    planner_output_empty: true

expected:
  final_status: failed
  error_type: ErrInvalidSnapshot
  error_message_must_contain:
    - "restore"
    - "planner"
    - "output"
  stages_must_not_run:
    - stylist
    - visualizer
    - critic
  must_not_pass_empty_input_to_stylist: true
  must_preserve_original_snapshot_intact: true

anti_patterns:
  - stylist receives empty plan and generates garbage output
  - system proceeds with empty intermediate artifacts
  - error is raised too late after partial execution
  - downstream stages fail with confusing errors instead of clear corruption message
  - snapshot validation skipped for performance

notes:
  - Tests that completed stage state is validated for non-empty output.
  - Empty output with completed status indicates corruption.
  - Must fail before stylist execution, not during.
  - Critical for data integrity across resume boundaries.

tags:
  - mutation
  - resume-boundary
  - corrupted-snapshot
  - empty-output
  - validation

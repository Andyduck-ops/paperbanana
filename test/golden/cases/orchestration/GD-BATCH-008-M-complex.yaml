id: GD-BATCH-008
priority: P1
layer: orchestration
title: Batch Partial Crash Mid-Execution
source: mutation
operator: batch-partial-crash
parent: GD-002
intent: When batch process crashes after some candidates complete, the system must correctly identify which states persisted and which were lost.

input:
  mode: diagram
  batch_size: 5
  prompts:
    - "Create a diagram of a ResNet architecture"
    - "Create a diagram of an Inception module"
    - "Create a diagram of a DenseNet block"
    - "Create a diagram of an EfficientNet"
    - "Create a diagram of a MobileNet"
  retrieval_mode: shared
  inject_crash:
    after_candidate: 2
    crash_type: process_exit
    exit_code: 137

expected:
  batch_final_status: incomplete
  crash_recovery_possible: true
  per_task_status:
    - candidate_id: 0
      status: completed
      must_have_artifact: true
      persisted_before_crash: true
    - candidate_id: 1
      status: completed
      must_have_artifact: true
      persisted_before_crash: true
    - candidate_id: 2
      status: crashed
      persisted_before_crash: false
      recoverable: true
    - candidate_id: 3
      status: pending
      never_started: true
    - candidate_id: 4
      status: pending
      never_started: true
  partial_persistence_verified: true
  crash_point_identifiable: true

anti_patterns:
  - all candidates marked as failed due to crash
  - completed candidates' artifacts lost
  - no way to identify crash point
  - pending candidates incorrectly marked as failed
  - crash causes database corruption for completed tasks

notes:
  - Tests crash resilience and partial state persistence
  - Candidates 0-1 should have persisted artifacts
  - Candidate 2 was in-progress when crash occurred
  - Candidates 3-4 never started
  - System must distinguish between failed and crashed states

tags:
  - mutation
  - batch
  - batch-complexity
  - batch-crash
  - partial-persistence
  - orchestration

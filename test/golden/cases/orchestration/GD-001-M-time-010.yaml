id: GD-001-M-time-010
priority: P2
layer: orchestration
title: Heartbeat Timeout During Healthy Execution
source: mutation
operator: heartbeat-timeout
parent: GD-001
intent: When heartbeat messages are delayed but the stage is still executing normally, the system must not incorrectly mark it as failed.

input:
  mode: diagram
  prompt: "Create a diagram explaining a multi-agent workflow for scientific figure generation."
  retrieval_mode: auto
  heartbeat_scenario:
    stage: planner
    heartbeat_interval_ms: 5000
    heartbeat_timeout_ms: 15000
    network_delay_spike_ms: 10000
    stage_actually_executing: true
    heartbeat_delayed_not_missed: true

expected:
  must_not_fail_on_delayed_heartbeat: true
  heartbeat_timeout_tolerance: network_delay_spike
  stage_continues_normally: true
  final_status: completed
  delayed_heartbeat_must_arrive: true
  missed_heartbeat_threshold: 3_consecutive

anti_patterns:
  - single delayed heartbeat triggers failure
  - system marks stage as failed when it is actually running
  - no tolerance for network jitter in heartbeat detection
  - heartbeat timeout is same as stage timeout causing confusion
  - no distinction between delayed heartbeat and missed heartbeat

notes:
  - Tests liveness detection robustness.
  - Heartbeat delays are common in distributed systems.
  - System should tolerate network jitter.
  - Only consecutive missed heartbeats should trigger failure.

tags:
  - mutation
  - time-sensitive
  - heartbeat
  - liveness-detection
  - network-delay

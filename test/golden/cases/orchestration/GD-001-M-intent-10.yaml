id: GD-001-M-intent-10
priority: P1
layer: orchestration
title: Intent Change Detected In Followup Must Trigger Reprocessing
source: mutation
operator: intent-followup-change
parent: GD-001
intent: When a user provides followup input that fundamentally changes their intent (not just refinement), the system must detect the intent change and reprocess from the appropriate stage rather than treating it as a minor adjustment.

input:
  mode: plot
  prompt: "Create a line chart showing temperature trends over the past year."
  retrieval_mode: auto
  followup_input: "Actually, I need a pie chart showing the distribution of temperature ranges instead."
  followup_timing: post_planner_pre_stylist

expected:
  one_of:
    - final_status: completed
      intent_change_must_be_detected: true
      must_reprocess_from_planner: true
      artifact_must_be_pie_chart: true
      must_not_produce_line_chart: true
    - final_status: failed
      error_must_indicate_intent_incompatibility: true
      error_must_offer_restart_option: true
  must_not_treat_as_simple_refinement: true

anti_patterns:
  - system treats "pie chart" as a style refinement of the line chart
  - system produces a line chart with minor modifications
  - planner output from line chart is reused for pie chart generation
  - intent change is not detected or logged
  - system fails without recognizing the intent shift

notes:
  - Line chart and pie chart are fundamentally different visualization types.
  - This is not a refinement; it's an intent pivot.
  - The system should recognize this and reprocess appropriately.
  - This tests dynamic intent adaptation during execution.

tags:
  - mutation
  - user-intent-edge
  - intent-followup-change
  - intent-pivot-detection
  - reprocessing-trigger

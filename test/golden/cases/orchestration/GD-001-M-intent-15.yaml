id: GD-001-M-intent-15
priority: P1
layer: orchestration
title: Implicit Intent From Negative Constraints Must Be Inferred
source: mutation
operator: intent-negative-constraints
parent: GD-001
intent: When a user specifies what they DON'T want rather than what they DO want, the system must infer the positive intent from the negative constraints and produce an appropriate artifact.

input:
  mode: diagram
  prompt: "Create a system overview diagram. Don't use boxes, don't use arrows, don't make it look like a flowchart."
  retrieval_mode: auto

expected:
  one_of:
    - final_status: completed
      must_infer_positive_intent_from_negatives: true
      artifact_must_not_use_boxes: true
      artifact_must_not_use_arrows: true
      artifact_must_not_look_like_flowchart: true
      inferred_intent_must_be_logged: true
    - final_status: failed
      error_must_explain_cannot_infer_positive_intent: true
      error_must_request_positive_specification: true
  must_honor_negative_constraints: true

anti_patterns:
  - system produces flowchart anyway ignoring all negative constraints
  - system fails immediately without attempting to infer positive intent
  - artifact uses prohibited elements (boxes, arrows) in disguised form
  - inferred intent is not documented
  - system asks for positive specification when inference is possible

notes:
  - Negative constraints require the system to think of alternatives.
  - Without boxes and arrows, options include: circles, ellipses, network graphs, mind maps.
  - This tests reasoning about what the user wants based on what they don't want.
  - A sophisticated system would infer "network-style" or "mind-map" from these constraints.

tags:
  - mutation
  - user-intent-edge
  - intent-negative-constraints
  - intent-inference
  - constraint-reasoning

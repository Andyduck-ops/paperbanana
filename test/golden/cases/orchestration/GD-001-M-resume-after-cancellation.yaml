id: GD-001-M-resume-after-cancellation
priority: P1
layer: orchestration
title: Resume After Cancellation Preserves Completed Stages
source: mutation
operator: resume-after-planner
parent: GD-001
intent: A session cancelled mid-execution can be resumed from the last completed stage boundary, preserving all work done before cancellation.

input:
  mode: diagram
  prompt: "Create a diagram explaining a multi-agent workflow for scientific figure generation."
  retrieval_mode: auto
  cancellation_scenario:
    cancel_after: planner
    cancel_reason: user_interrupt
  resume_from: stylist
  resume_context:
    original_session_cancelled: true
    planner_completed_before_cancel: true
    stylist_never_started: true

expected:
  final_status: completed
  stages_must_not_rerun:
    - retriever
    - planner
  stages_continued:
    - stylist
    - visualizer
    - critic
  must_have_final_artifact: true
  must_persist_session: true
  resume_metadata_must_indicate:
    - restored_from: planner
    - original_status: canceled
  cancellation_history_preserved: true

anti_patterns:
  - cancelled session treated as failed and cannot resume
  - planner reruns despite having completed before cancellation
  - cancellation status overwritten with no audit trail
  - session cannot be resumed because snapshot was not saved on cancel
  - resume creates a new session ID instead of continuing original

notes:
  - Tests that cancellation is a resumable state, not a terminal failure.
  - Snapshots must be persisted even on cancellation for resume support.
  - Original cancellation event should be preserved in session history.
  - Critical for long-running generations that users may pause.

tags:
  - mutation
  - resume-boundary
  - cancellation-resume
  - state-preservation
  - user-interrupt

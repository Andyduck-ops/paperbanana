id: GD-BATCH-018
priority: P1
layer: orchestration
title: Batch Priority Preemption
source: mutation
operator: batch-priority-preemption
parent: GD-002
intent: When a high-priority batch arrives during low-priority batch execution, running candidates may be preempted with correct state preservation.

input:
  mode: diagram
  batch_size: 3
  prompts:
    - "Create a diagram of a simple feedforward network"
    - "Create a diagram of a basic CNN"
    - "Create a diagram of a simple RNN"
  retrieval_mode: shared
  batch_priority: low
  inject_preemption:
    trigger_after_candidate: 1
    preempting_batch_priority: high
    preempt_reason: "priority_scheduling"

expected:
  batch_final_status: preempted
  per_task_status:
    - candidate_id: 0
      status: completed
      must_have_artifact: true
      preserved_on_preemption: true
    - candidate_id: 1
      status: completed
      must_have_artifact: true
      preserved_on_preemption: true
    - candidate_id: 2
      status: preempted
      preemption_stage: pending
      resumable: true
  preemption_handled_gracefully: true
  completed_artifacts_preserved: true
  resumable_state_saved: true
  preemption_reason_recorded: true

anti_patterns:
  - completed candidates' artifacts lost on preemption
  - candidate 2 left in inconsistent state
  - no resume point saved for preempted candidate
  - batch appears as failed instead of preempted
  - preemption reason not logged

notes:
  - Tests priority-based preemption in batch execution
  - Low-priority batch preempted after 2 completions
  - Candidate 2 should have resumable state
  - Completed artifacts must be preserved
  - System must support resumption later

tags:
  - mutation
  - batch
  - batch-complexity
  - priority-preemption
  - scheduling
  - resumable
  - orchestration

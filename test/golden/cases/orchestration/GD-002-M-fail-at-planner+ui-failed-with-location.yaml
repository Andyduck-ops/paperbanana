id: GD-002-M-fail-at-planner+ui-failed-with-location
priority: P1
layer: orchestration
title: Planner Failure Visible in UI With Accurate Location
source: mutation
operators:
  - fail-at-planner
  - ui-failed-with-location
parent: GD-002
intent: When planner fails, the UI must display the exact failed stage name and distinguish completed stages from those that never ran.

input:
  mode: diagram
  prompt: "Create a diagram showing distributed system architecture."
  retrieval_mode: auto
  inject_failure_at: planner

expected:
  final_status: failed
  failed_stage: planner
  must_expose_progress: true
  ui_must_show:
    - failed status indicator
    - exact stage name "planner" as failure point
    - retriever shown as completed
    - stylist, visualizer, critic shown as not-run
  ui_must_not_show:
    - generic error with no stage attribution
    - all stages shown as failed
    - stages after planner shown as completed

anti_patterns:
  - UI shows "generation failed" with no mention of planner
  - retriever shown as failed instead of completed
  - visualizer or critic shown as running despite planner failure
  - failed_stage in UI state is empty or generic like "unknown"

notes:
  - This is a high-value combination from MUTATION.md guidelines.
  - Tests the data flow from orchestrator failure to UI rendering.
  - The retriever completed before failure must remain visible as completed.

tags:
  - mutation
  - combined
  - fail-at-planner
  - ui-failed-with-location
  - failure-attribution

id: GD-001-M-cognitive-stage-skipped-silent
priority: P1
layer: orchestration
title: Stage Skipped Silently Without User Notification
source: mutation
operator: cognitive-stage-skipped-silent
parent: GD-001
intent: When a pipeline stage is skipped (e.g., retriever skipped due to no references), the user must be explicitly notified. Silent skipping creates a false impression that all stages ran, misleading users about output provenance.

input:
  mode: diagram
  prompt: "Create a diagram of a novel quantum computing architecture"
  retrieval_mode: auto
  corpus_state: empty_for_query

expected:
  final_status: completed
  session_metadata_must_include:
    - key: skipped_stages
      value_contains: "retriever"
    - key: skip_reason
      value_contains: "empty"
  ui_progress_must_show_stage_status:
    - stage: retriever
      status: "skipped"
  artifact_metadata_must_include:
    - key: references_used
      value: "0"
    - key: retrieval_skipped
      value: "true"

anti_patterns:
  - retriever stage shows "completed" when it was actually skipped
  - no indication in progress UI that retrieval was skipped
  - final artifact has no provenance info about skipped stages
  - user assumes references were found when none exist
  - progress indicator shows 100% with no skipped stage markers
  - system proceeds without any notification of stage bypass
  - log shows skip but UI does not surface to user

notes:
  - Users trust that all stages ran when they see "completed".
  - A skipped retriever means the output has no external references.
  - This may be fine, but users must know to make informed decisions.
  - Progress UI should show "skipped" with explanation, not "completed".
  - This is about transparency, not failure.
  - Verification: session metadata includes skipped_stages list.
  - Verification: UI progress shows retriever stage with status "skipped".

tags:
  - mutation
  - user-cognitive-trap
  - silent-skip
  - stage-transparency
  - provenance-gap
  - hidden-process

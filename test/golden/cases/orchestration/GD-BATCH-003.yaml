id: GD-BATCH-003
priority: P1
layer: orchestration
title: Batch Single Item Equivalence
source: mutation
operator: batch-single-item
parent: GD-001
intent: A batch of size 1 must produce identical results to a single non-batch execution, including all event types and artifact structures.

input:
  mode: diagram
  batch_size: 1
  prompts:
    - "Create a diagram of a recurrent neural network"
  retrieval_mode: shared

expected:
  batch_final_status: completed
  per_task_status:
    - candidate_id: 0
      status: completed
      must_have_artifact: true
  shared_retriever_used: true
  retriever_call_count: 1
  successful_count: 1
  failed_count: 0
  batch_events_emitted:
    - batch_start
    - candidate_start
    - candidate_complete
    - batch_complete
  single_task_has_session_id: true
  artifact_structure_matches_single: true

anti_patterns:
  - batch of 1 skips shared retriever optimization
  - batch events missing for single-item batch
  - single-item batch produces different artifact structure than non-batch
  - batch_result missing or malformed for single-item batch
  - candidate_id incorrectly indexed (not 0)

notes:
  - Verifies batch-single equivalence contract
  - Batch of 1 should still use shared retriever logic
  - All batch event types should still be emitted
  - Useful for testing batch logic with minimal resources

tags:
  - mutation
  - batch
  - batch-single-item
  - equivalence
  - orchestration

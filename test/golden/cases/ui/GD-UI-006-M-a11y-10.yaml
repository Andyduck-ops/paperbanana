id: GD-UI-006-M-a11y-10
priority: P0
layer: ui
title: Form Inputs Have Associated Labels
source: mutation
operator: a11y-form-labels
parent: GD-UI-001
intent: All form inputs must have properly associated labels. The prompt input field and any configuration options must have visible labels that are programmatically associated with their inputs for screen reader users.
wcag_criterion: WCAG 2.1 1.3.1 Info and Relationships (Level A)

input:
  ui_scenario: user submitting a new generation task
  system_state:
    session_status: idle
    form_fields:
      - prompt_input
      - mode_selector
      - configuration_options

expected:
  all_inputs_must_have_associated_labels: true
  labels_must_be_visible: true
  labels_must_use_for_attribute_or_wrapping: true
  placeholder_must_not_be_only_label: true
  required_fields_must_be_indicated: true

anti_patterns:
  - prompt input has no label, only placeholder text
  - label is present but not associated with input (no for/id)
  - label is visually hidden
  - placeholder text used as sole identification
  - required indicator is only color (red asterisk)
  - screen reader announces input without context
  - configuration dropdown has no accessible name

notes:
  - Use explicit labeling: <label for="prompt">Your Prompt</label>
  - Placeholder is supplementary, not a replacement for labels.
  - Indicate required fields with text or aria-required="true".
  - Test with screen reader to verify label announcement.

tags:
  - mutation
  - accessibility
  - form-labels
  - wcag-1.3.1
  - wcag-3.3.2
  - screen-reader
  - input-association

id: GD-UI-BATCH-006
priority: P1
layer: ui
title: Batch Event Sequence Integrity
source: mutation
operator: batch-all-succeed
parent: GD-UI-001
intent: UI must correctly process the complete sequence of batch SSE events and maintain consistent state throughout.

input:
  ui_scenario: batch of 2 candidates with full event sequence
  sse_events_sequence:
    - type: batch_start
      batch_id: batch-event-001
    - type: candidate_start
      candidate_id: 0
    - type: candidate_start
      candidate_id: 1
    - type: candidate_complete
      candidate_id: 0
      status: completed
    - type: candidate_complete
      candidate_id: 1
      status: completed
    - type: batch_complete
      successful: 2
      failed: 0
    - type: batch_result
      results:
        - candidate_id: 0
          artifacts: [...]
        - candidate_id: 1
          artifacts: [...]

expected:
  ui_state_after_batch_start:
    - batch_id stored
    - candidates initialized with pending status
  ui_state_after_candidate_start_0:
    - candidate 0 status: running
  ui_state_after_candidate_start_1:
    - candidate 0 status: running
    - candidate 1 status: running
  ui_state_after_candidate_complete_0:
    - candidate 0 status: completed
    - candidate 1 status: running
    - successful count: 1
  ui_state_after_batch_complete:
    - batch status: completed
    - successful count: 2
  ui_state_after_batch_result:
    - artifacts attached to each candidate

anti_patterns:
  - batch_start event ignored, candidates not initialized
  - candidate_start events not updating individual status
  - candidate_complete counted but candidate still shows running
  - batch_complete not setting batch status
  - batch_result not attaching artifacts
  - events processed out of order causing state corruption

notes:
  - Tests SSE event handler state machine
  - Each event type should trigger specific state transition
  - Wire against useBatchSSE event parsing logic
  - Verify event batching doesn't cause race conditions

tags:
  - mutation
  - batch
  - batch-all-succeed
  - ui
  - sse-events
  - state-machine

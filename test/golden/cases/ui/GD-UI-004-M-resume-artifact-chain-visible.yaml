id: GD-UI-004-M-resume-artifact-chain-visible
priority: P1
layer: ui
title: Resume Preserves Artifact Chain Visibility
source: mutation
operator: resume-after-stylist
parent: GD-UI-004
intent: When a task is resumed, the UI must show artifacts from stages completed before resume, not just artifacts from the current resume session.

input:
  ui_scenario: task was resumed after stylist, now running visualizer
  system_state:
    session_status: running
    resumed_from_stage: stylist
    current_stage: visualizer
    stages_completed_before_resume:
      - retriever
      - planner
      - stylist
    artifacts_from_previous_run:
      - kind: reference_bundle
        stage: retriever
      - kind: plan
        stage: planner
      - kind: style_guide
        stage: stylist
    stages_running_after_resume:
      - visualizer

expected:
  ui_must_show:
    - reference bundle from retriever accessible in artifact list
    - plan from planner accessible in artifact list
    - style guide from stylist accessible in artifact list
    - visualizer running with plan and style inputs visible
    - all artifacts have correct stage attribution
  ui_must_not_show:
    - empty artifact list before visualizer completes
    - artifacts only from current resume session
    - broken artifact chain missing intermediate stages
    - artifacts without stage attribution
  interaction_contract:
    - user can inspect plan artifact while visualizer runs
    - user can view all intermediate work from previous run
    - artifact chain is complete and navigable

anti_patterns:
  - UI shows only artifacts created after resume
  - intermediate artifacts lost from UI even though present in snapshot
  - plan artifact not accessible because it was created before resume
  - user cannot review retriever references while waiting for visualizer
  - artifact list resets to empty on resume

notes:
  - Tests that UI correctly surfaces inherited artifacts.
  - Artifacts from previous run must remain accessible.
  - Complete artifact chain enables debugging and verification.
  - Critical for user understanding of generation process.

tags:
  - mutation
  - resume-boundary
  - ui-artifacts
  - artifact-chain
  - inherited-artifacts

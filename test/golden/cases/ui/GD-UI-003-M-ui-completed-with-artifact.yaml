id: GD-UI-003-M-ui-completed-with-artifact
priority: P1
layer: ui
title: Completed State With Artifact Verification
source: mutation
operator: ui-completed-with-artifact
parent: GD-UI-003
intent: UI must verify artifact existence before showing completed state, preventing false success display when artifact is missing.

input:
  ui_scenario: task marked completed but artifact verification pending
  system_state:
    session_status: completed
    stages_completed:
      - retriever
      - planner
      - stylist
      - visualizer
      - critic
    final_artifact:
      kind: rendered_figure
      mime_type: image/png
      verification_required: true

expected:
  ui_must_show:
    - completed status only after artifact verified
    - artifact preview or download when available
    - all stages shown as completed
  ui_must_not_show:
    - completed badge while artifact is still loading
    - empty artifact area under completed status
    - loading spinner in artifact area after completed badge shown
  interaction_contract:
    - user cannot see completed state until artifact is accessible
    - artifact availability is guaranteed when completed is shown

anti_patterns:
  - completed badge shown before artifact bytes are available
  - UI shows completed but artifact area is blank or loading
  - user sees success state but cannot download or preview
  - race condition where completed shows before visualizer confirms bytes
  - artifact verification failure hidden behind completed status

notes:
  - Tests atomic transition to completed state.
  - Completed status should be coupled with artifact availability.
  - This is the inverse of the no-rendered-output orchestration case.

tags:
  - mutation
  - ui-state
  - completed-state
  - artifact-verification
  - atomic-transition

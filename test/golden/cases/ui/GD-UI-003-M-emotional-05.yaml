id: GD-UI-003-M-emotional-05
priority: P1
layer: ui
title: Task Completion Must Feel Rewarding
source: mutation
operator: emotional-completion-satisfaction
parent: GD-UI-003
intent: When a task completes successfully, the UI must provide a sense of accomplishment and satisfaction. Completion is a reward moment that should feel positive, not just "done."

input:
  ui_scenario: user completes generation of complex multi-panel figure
  system_state:
    session_status: completed
    task_complexity: high
    elapsed_time: 90_seconds
    final_artifact:
      kind: rendered_figure
      mime_type: image/png
      bytes_present: true

expected:
  ui_must_show:
    - positive completion indicator (color, animation, badge)
    - subtle celebration of successful completion
    - immediate access to the artifact
    - sense of "you made this" ownership
  ui_must_not_show:
    - sterile "Task completed" with no warmth
    - completion state that feels like just another status
    - hiding the artifact behind extra clicks
    - immediate focus on next action before acknowledging completion
  interaction_contract:
    - user feels satisfaction and accomplishment
    - user has positive emotional association with completion
    - artifact feels like a reward, not just output

anti_patterns:
  - checkmark icon appears with no animation or color change
    - "Done" text in neutral gray
    - artifact shown with no framing or celebration context
    - immediate prompt for next generation without pause
    - completion feels identical to a simple state change
    - no visual reward for complex task completion
    - user must hunt for download button

notes:
  - Completion is a dopamine moment - design for it.
  - Consider: soft glow on completion, "Your diagram is ready!" message.
  - High-complexity tasks deserve more celebration.
  - Ownership language ("Your diagram") builds connection.

tags:
  - mutation
  - emotional-design
  - completion
  - satisfaction
  - reward
  - accomplishment

id: GD-UI-BATCH-003
priority: P1
layer: ui
title: Batch Single Item UI Equivalence
source: mutation
operator: batch-single-item
parent: GD-UI-001
intent: A batch of one item must display identically to a single-task execution in the UI, maintaining visual consistency.

input:
  ui_scenario: batch of 1 candidate running
  system_state:
    batch_id: batch-single-001
    batch_status: running
    candidates:
      - candidate_id: 0
        status: running
        current_stage: visualizer
        stages_completed:
          - retriever
          - planner
          - stylist
        stages_remaining:
          - critic

expected:
  ui_must_show:
    - single candidate card with running state
    - current stage: visualizer
    - completed stages marked visually
    - batch-level progress showing 0/1 completed
  ui_must_not_show:
    - missing batch-level context entirely
    - candidate card duplicated
    - batch progress showing 1/1 when still running
  equivalence_with_single_task:
    - visual layout should match single-task generation
    - stage progress should be identically visible
    - event handling should be consistent

anti_patterns:
  - UI shows "Batch: 1 candidate" prominently when it should look like single task
  - candidate card missing because batch_size == 1
  - different progress bar style for batch vs single
  - SSE events handled differently for batch-single vs regular single
  - batch_result event missing for single-item batch

notes:
  - Tests UI equivalence for batch-single scenario
  - User experience should be seamless between modes
  - Single-item batch is valid batch, should emit all batch events
  - Useful for testing batch UI with minimal overhead

tags:
  - mutation
  - batch
  - batch-single-item
  - ui
  - equivalence
  - visual-consistency

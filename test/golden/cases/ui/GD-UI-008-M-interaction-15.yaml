id: GD-UI-008-M-interaction-15
priority: P1
layer: ui
title: Enter Key Submits Prompt When Input Is Focused
source: mutation
operator: interaction-enter-key-submit
parent: GD-UI-001
intent: When the prompt input field is focused, pressing Enter should submit the form. This is expected keyboard behavior and improves efficiency for keyboard users.

input:
  ui_scenario: user types prompt and presses Enter key
  system_state:
    session_status: idle
    focus_element: prompt_input
    prompt_content: "Write a paper about neural networks"
    user_action: press_enter_key

expected:
  ui_must_show:
    - Enter key submits the form and starts generation
    - Ctrl+Enter or Cmd+Enter allows newline insertion
    - focus moves to Generate button or loading state
  ui_must_not_show:
    - Enter key does nothing
    - user must click Generate button with mouse
    - Enter key adds newline but cannot submit
  interaction_contract:
    - enter_submits_when_input_focused: true
    - modifier_enter_allows_newline: true
    - keyboard_efficient_workflow: true

anti_patterns:
  - Pressing Enter does nothing in prompt input
  - user must reach for mouse to click Generate
  - no way to insert newline if Enter always submits
  - Enter submits but no visual feedback
  - Enter key is ignored entirely
  - inconsistent behavior (sometimes submits, sometimes doesn't)

notes:
  - Standard web form behavior: Enter submits, Shift+Enter for newline.
  - Or use Ctrl/Cmd+Enter for submit, Enter for newline.
  - Document the expected behavior with placeholder text.
  - Critical for keyboard-only users.

tags:
  - mutation
  - interaction-design
  - keyboard-shortcut
  - form-submit
  - enter-key
  - keyboard-efficiency

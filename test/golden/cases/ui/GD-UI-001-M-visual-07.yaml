id: GD-UI-001-M-visual-07
priority: P1
layer: ui
title: Button State Visual Feedback
source: mutation
operator: visual-button-state-break
parent: GD-UI-001
intent: Users click repeatedly on a disabled button that looks identical to an enabled one, then wonder "Why isn't this working? Is the app broken?" before realizing the button was disabled all along.

input:
  ui_scenario: generate button lacks proper visual feedback for different states
  system_state:
    button_states:
      - state: default
        expected: 'bg-primary text-background'
      - state: hover
        expected: 'opacity-90 or darker shade'
      - state: focus
        expected: 'ring-2 ring-primary ring-offset-2'
      - state: active
        expected: 'opacity-80 or pressed visual'
      - state: disabled
        expected: 'opacity-50 cursor-not-allowed'
    buttons_to_test:
      - generate_submit
      - export_button
      - theme_selector
      - new_generation

expected:
  ui_must_show:
    - hover state with visible opacity or color change
    - focus state with visible ring outline
    - disabled state with reduced opacity and cursor change
    - active state with pressed visual feedback
  ui_must_not_show:
    - button with no hover feedback
    - missing focus outline (keyboard accessibility issue)
    - disabled button that looks identical to enabled
    - hover state that conflicts with disabled state
  interaction_contract:
    - users can identify interactive elements visually
    - keyboard users see focus indicator
    - disabled state clearly communicates non-interactivity

anti_patterns:
  - Button has no hover effect (looks identical to default)
  - Focus ring missing or invisible on theme background
  - Disabled button has same opacity as enabled
  - Hover state applied to disabled button
  - No visual difference between active and default states
  - Focus outline color invisible against background

notes:
  - Tests button state feedback across components.
  - Check GeneratePanel submit, ResultPanel export, Header theme buttons.
  - Verify focus-visible for keyboard accessibility.

tags:
  - mutation
  - visual-design
  - interaction-feedback
  - button-states
  - accessibility

id: GD-UI-003-M-missing-mode
priority: P1
layer: ui
title: Missing Mode Must Show Mode Selection Or Error In UI
source: mutation
operator: missing-mode
parent: GD-UI-003
intent: When mode is missing from a request, the UI must either show an inferred mode explicitly or display a clear error prompting for mode selection.

input:
  ui_scenario: task completed with missing mode that was inferred
  system_state:
    session_status: completed
    inferred_mode: diagram
    mode_was_missing: true
    stages_completed:
      - retriever
      - planner
      - stylist
      - visualizer
      - critic
    final_artifact:
      kind: rendered_figure
      mime_type: image/png

expected:
  ui_must_show:
    - completed status indicator
    - indication that mode was inferred
    - final artifact
  ui_must_not_show:
    - artifact without showing what mode was used
    - mode selection error if task completed successfully
  interaction_contract:
    - user can confirm the inferred mode matches intent
    - user can see what mode the system assumed

anti_patterns:
  - UI shows completed artifact without indicating what mode was used
  - inferred mode is not logged anywhere user can see it
  - UI shows error about missing mode even though task completed
  - user has no way to know if the artifact format matches their expectation
  - mode mismatch between user intent and system inference is invisible

notes:
  - Missing mode can be recovered by inference or rejected.
  - If recovered, UI must show what was inferred.
  - If rejected, UI must show why and how to fix.
  - This tests UI transparency around system assumptions.

tags:
  - mutation
  - input-ambiguity
  - missing-mode
  - inference-transparency
  - mode-visibility

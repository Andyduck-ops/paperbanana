id: GD-UI-001-M-cognitive-false-completion-indicator
priority: P1
layer: ui
title: False Completion Indicator While Backend Still Processing
source: mutation
operator: cognitive-false-completion-indicator
parent: GD-UI-001
intent: The UI must not show a completed state while the backend is still processing. If the UI shows a checkmark or "done" state prematurely, users may close the page assuming completion, losing access to results.

input:
  ui_scenario: race condition between UI completion animation and backend status
  system_state:
    session_status: running
    current_stage: critic
    backend_progress: 80_percent
    ui_shows: completed

expected:
  ui_state_must_match_backend:
    - key: session_status
      backend_value: running
      ui_must_show: running
    - key: current_stage
      backend_value: critic
      ui_must_show: critic
  must_not_show_completed_while_running: true
  before_unload_warning_must_be_set: true
  status_synchronization_delay_ms_max: 500

anti_patterns:
  - UI shows green checkmark while backend critic stage is still running
  - completion animation plays before backend confirms completion
  - user closes tab thinking task is done, loses access to result
  - UI polls at low frequency and shows stale "completed" from previous task
  - no confirmation dialog when user tries to close during running state
  - visual completion state is not synced with actual session status
  - SSE event for completion is delayed but UI assumed completion

notes:
  - This is a critical trust issue: users act on what the UI shows.
  - Premature completion indicator causes users to lose work.
  - UI state must be driven by backend events, not assumptions.
  - Consider "processing..." state until final confirmation.
  - Browser close warning can prevent accidental loss.
  - Verification: ui_state.session_status matches backend session_status.
  - Verification: beforeunload event handler is registered when session is running.

tags:
  - mutation
  - user-cognitive-trap
  - false-completion
  - premature-indicator
  - status-desync
  - trust-violation

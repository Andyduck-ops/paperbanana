id: GD-UI-004-M-retrieval-manual
priority: P1
layer: ui
title: Resumed Task Exposes Resume Semantics With Manual References
source: mutation
operator: retrieval-manual
parent: GD-UI-004
intent: Resume semantics must work correctly when the original task used manual references, ensuring references are preserved across resume.

input:
  ui_scenario: task was resumed from a snapshot after planner with manual references
  system_state:
    session_status: running
    resumed_from_stage: planner
    current_stage: stylist
    retrieval_mode: manual
    stages_completed_before_resume:
      - retriever
      - planner
    stages_running_after_resume:
      - stylist
    resume_metadata_preserved: true
    injected_references_preserved: true

expected:
  ui_must_show:
    - stages completed before resume are shown as already done
    - current stage is stylist, not retriever
    - some indication that this is a resumed run, not a fresh one
  ui_must_not_show:
    - retriever or planner shown as currently running
    - pipeline presented as starting from scratch
    - resume metadata discarded from visible state
  interaction_contract:
    - user can see which stages were inherited from snapshot
    - user can see which stages are being run in this resume

anti_patterns:
  - injected references are lost after resume
  - resumed task appears identical to a brand new task
  - prior completed stages shown as pending again
  - pipeline progress resets to zero on resume
  - manual references must be re-injected on resume

notes:
  - Tests that manual reference injection persists across resume.
  - injected_references_preserved ensures the reference bundle is not lost.
  - Critical for ensuring deterministic behavior across pause/resume cycles.

tags:
  - mutation
  - retrieval-variation
  - retrieval-manual
  - resume-semantics

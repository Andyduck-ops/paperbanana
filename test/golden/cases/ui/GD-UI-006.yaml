id: GD-UI-006
priority: P1
layer: ui
title: Model Configuration Visibility
source: requirement
intent: 用户必须能够清晰查看和配置检索模型与生图模型，支持多商家启用和模型管理。

input:
  ui_scenario: user needs to configure models
  system_state:
    providers_available:
      - id: gemini
        name: Gemini
        enabled: true
        models:
          - id: gemini-2.0-flash
            name: Gemini 2.0 Flash
            capabilities: [query, gen]
            added: true
          - id: gemini-1.5-pro
            name: Gemini 1.5 Pro
            capabilities: [query, gen]
            added: false
      - id: openai
        name: OpenAI
        enabled: true
        models:
          - id: gpt-4o
            name: GPT-4o
            capabilities: [query, gen]
            added: true
      - id: anthropic
        name: Anthropic
        enabled: false
        models: []
    current_config:
      query_provider: gemini
      query_model: gemini-2.0-flash
      gen_provider: openai
      gen_model: gpt-4o

expected:
  ui_must_show:
    - 当前模型指示器 (如 "Gemini⚡ + OpenAI") 在右上角
    - 点击指示器弹出 ModelPopover
    - Popover 中显示检索模型和生图模型的选择器
    - 商家列表，每个商家有启用/禁用开关
    - 已添加的模型显示 [-] 按钮
    - 未添加的模型显示 [+] 按钮
    - API Key 配置入口
  ui_must_not_show:
    - 全页 Settings 页面 (应改为 Popover)
    - 常驻侧边栏占用屏幕空间
  interaction_contract:
    - 用户可以切换检索渠道和模型
    - 用户可以切换生图渠道和模型
    - 用户可以启用/禁用商家
    - 用户可以添加/移除模型
    - 用户可以配置 API Key

anti_patterns:
  - 模型配置隐藏在深层设置页面
  - 无法区分检索模型和生图模型
  - 所有商家模型混在一起无法筛选
  - 无法同时启用多个商家
  - API Key 配置流程复杂

notes:
  - 参考设计: Cherry Studio 的模型选择器
  - 参考设计: NewAPI 的商家管理界面
  - 应支持自定义商家添加

tags:
  - ui
  - model-config
  - provider-management
  - popover

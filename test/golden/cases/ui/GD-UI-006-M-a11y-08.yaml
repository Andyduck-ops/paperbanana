id: GD-UI-006-M-a11y-08
priority: P1
layer: ui
title: Interactive Elements Have Sufficient Touch Target Size
source: mutation
operator: a11y-touch-target-size
parent: GD-UI-001
intent: All interactive elements (cancel button, retry button, navigation) must have touch targets of at least 44x44 CSS pixels. Users with motor impairments must be able to activate buttons without precision pointing.
wcag_criterion: WCAG 2.1 2.5.5 Target Size (Level AAA)

input:
  ui_scenario: user with motor impairment attempting to cancel running task
  system_state:
    session_status: running
    current_stage: visualizer
    input_method: touch_or_imprecise_pointer

expected:
  cancel_button_must_have_minimum_44x44_target: true
  retry_button_must_have_minimum_44x44_target: true
  navigation_controls_must_meet_size_requirement: true
  targets_must_have_adequate_spacing: true
  inline_links_may_be_smaller_with_justification: true

anti_patterns:
  - cancel button is 20x20 pixels
  - icon-only buttons have tiny clickable area
  - buttons are too close together (less than 8px spacing)
  - touch target does not include padding
  - mobile view has small buttons due to "space constraints"
  - user must use precise finger placement to activate button
  - hover area is larger than click area

notes:
  - 44x44 CSS pixels is WCAG AAA, 24x24 is recommended for AA.
  - Padding counts toward touch target size.
  - Ensure adequate spacing between targets (at least 8px).
  - Test on mobile devices with various hand sizes.

tags:
  - mutation
  - accessibility
  - touch-target
  - wcag-2.5.5
  - motor-impairment
  - mobile-accessibility

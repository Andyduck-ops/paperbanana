id: GD-UI-M-motion-02
priority: P0
title: Success Animation Triggered On Completion
layer: ui
source: motion-design
operator: motion-success-animation
parent: GD-UI-003
intent: Task completion must trigger a celebratory success animation that provides positive feedback and draws attention to the artifact area, not just a static state change.

input:
  ui_scenario: task transitions from running to completed
  system_state:
    session_status: completed
    previous_status: running
    final_artifact:
      kind: rendered_figure
      mime_type: image/png
      uri: memory://visualizer/current
    success_animation:
      type: celebration
      trigger: completion_event
      expected_duration_ms: 300-800

expected:
  ui_must_show:
    - celebratory animation triggered on completion event
    - animation draws eye toward artifact display area
    - animation includes success iconography (checkmark, confetti, glow)
    - animation completes and settles into stable completed state
  ui_must_not_show:
    - instant state change without any animation
    - animation with loop_count = infinite
    - animation that obscures or hides the artifact
    - animation that is purely decorative with no feedback purpose
  interaction_contract:
    - user receives immediate positive feedback for task completion
    - animation serves as attention cue to new artifact
    - animation does not block interaction with completed task
  motion_contract:
    - animation_duration_ms: 300-800
    - trigger: completion_status_change
    - purpose: positive_feedback_and_attention_cue
    - settling_state: stable_completed_visual

anti_patterns:
  - completion badge appears instantly with no animation
  - animation loop_count > 3 or duration > 2s distracting from artifact
  - animation covers artifact area preventing immediate viewing
  - decorative animation with no connection to completion feedback
  - animation starts but is cut off by other state update

notes:
  - Tests that completion has meaningful animation feedback.
  - Animation serves dual purpose: positive reinforcement and attention cue.
  - Must not interfere with user's ability to view or interact with artifact.

tags:
  - motion-design
  - success-animation
  - completion-feedback
  - celebratory-motion
  - attention-cue

id: GD-UI-001-M-consistency-08
priority: P1
layer: ui
title: Artifact Status Mismatch With Session Status
source: mutation
operator: consistency-artifact-session-drift
parent: GD-UI-003
intent: When session shows completed but artifact store shows failed, the UI must surface the inconsistency rather than hiding it.

input:
  ui_scenario: session metadata shows completed but artifact generation actually failed
  system_state:
    session_metadata:
      id: session-artifact-drift-001
      status: completed
      current_stage: visualizer
      artifact_id: artifact-xyz
    artifact_store:
      artifact_id: artifact-xyz
      status: failed
      error: "storage write failed: disk full"
      exists: false
    inconsistency_source: "transaction boundary: session committed, artifact write failed"

expected:
  ui_must_show:
    - partial completion status with artifact error
    - clear indication that artifact is unavailable
    - retry option for artifact regeneration
  ui_must_not_show:
    - completed status with download button that fails
    - no indication of artifact problem until user clicks
    - silent discrepancy between status and artifact
  interaction_contract:
    - user understands generation completed but artifact failed
    - user can retry artifact generation without full regeneration
    - partial success is clearly communicated

anti_patterns:
  - UI shows completed with artifact download that 404s
  - No validation that artifact exists before showing download
  - User only discovers failure when trying to download
  - Session status is treated as truth without verification
  - No recovery path for artifact-only failures

notes:
  - Tests cross-system consistency.
  - Session status and artifact status are separate concerns.
  - UI should validate artifact availability.
  - Partial success should be a first-class state.

tags:
  - mutation
  - state-consistency
  - artifact-mismatch
  - partial-success
  - cross-system-drift

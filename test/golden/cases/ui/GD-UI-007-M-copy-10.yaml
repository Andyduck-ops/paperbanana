id: GD-UI-007-M-copy-10
priority: P1
layer: ui
title: Link Text Must Describe Destination Not Just Click Here
source: mutation
operator: copy-link-not-descriptive
parent: GD-UI-001
intent: Link text must describe the destination or action, not use generic phrases like "click here" or "learn more". Descriptive links improve accessibility, SEO, and user confidence about where they will navigate.

input:
  ui_scenario: user encounters links in various contexts
  system_state:
    link_contexts:
      - context: help_article
        destination: documentation about query syntax
      - context: download_page
        destination: PDF export documentation
      - context: external_reference
        destination: external API documentation
      - context: in_app_navigation
        destination: settings page

expected:
  ui_must_show:
    - descriptive text indicating destination or action
    - clear indication if link opens in new tab
    - unique link text for different destinations
  ui_must_not_show:
    - generic phrases like "click here" or "read more"
    - raw URLs as link text for internal navigation
    - same link text pointing to different destinations
    - link text that doesn't indicate external navigation
  interaction_contract:
    - user knows what to expect when clicking
    - screen readers can understand link purpose out of context
    - links are distinguishable from surrounding text

anti_patterns:
  - Link text "Click here to learn more" (non-descriptive)
  - Link text "Read more" without context of what
  - Multiple "Learn more" links on same page to different destinations
  - Link text "https://docs.example.com/api/v2/endpoints" (raw URL)
  - External link without icon or "(opens in new tab)" indication
  - Link "here" in sentence "Find documentation here"
  - Same link text "Documentation" for three different docs pages

notes:
  - Pattern: Link text should make sense out of context.
  - Example: "Query syntax guide" not "Click here for query syntax."
  - External links should show icon or "opens in new tab" for a11y.
  - Avoid "learn more" - be specific about what is learned.

tags:
  - mutation
  - ux-writing
  - link-text
  - accessibility
  - descriptive-links
  - navigation-clarity

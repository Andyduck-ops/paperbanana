id: GD-UI-007-M-copy-08
priority: P1
layer: ui
title: Form Validation Messages Must Show Expected Format
source: mutation
operator: copy-validation-no-format
parent: GD-UI-001
intent: Form validation messages must tell users what format is expected, not just that their input is "invalid". Users should be able to correct their input without trial and error.

input:
  ui_scenario: user submits a form with invalid input
  system_state:
    validation_contexts:
      - field: date_input
        invalid_value: "March 32"
        expected_format: "YYYY-MM-DD"
      - field: email_input
        invalid_value: "user@"
        expected_format: "name@domain.com"
      - field: api_key_input
        invalid_value: "short"
        expected_format: "32-character alphanumeric"
      - field: url_input
        invalid_value: "not-a-url"
        expected_format: "https://example.com"

expected:
  ui_must_show:
    - clear statement of what is wrong
    - example of correct format
    - inline validation (no need to submit to see error)
  ui_must_not_show:
    - generic "Invalid input" without explanation
    - "Please enter a valid [field]" without format hint
    - validation messages that appear only after submit
    - technical regex errors like "Invalid format: ^[A-Za-z]+$"
  interaction_contract:
    - user can correct input without external help
    - example format is shown in the error message
    - validation appears as user types or on blur

anti_patterns:
  - Error message "Invalid date" without showing expected format
  - Error message "Invalid email" without example like "name@domain.com"
  - Error "This field is required" on field labeled "Optional"
  - Error "Password is invalid" without stating requirements
  - Validation only appears after clicking submit button
  - Error "Must match pattern" with no pattern example
  - Technical message "ValidationError: string does not match regex"

notes:
  - Pattern: "[Field] must be in [format]. Example: [example]."
  - Example: "Date must be in YYYY-MM-DD format. Example: 2024-01-15."
  - Show validation inline, in real-time when possible.
  - Password fields should show requirements upfront.

tags:
  - mutation
  - ux-writing
  - form-validation
  - error-messages
  - input-format
  - user-correction

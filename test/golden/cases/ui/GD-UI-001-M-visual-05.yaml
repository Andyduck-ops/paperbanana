id: GD-UI-001-M-visual-05
priority: P1
layer: ui
title: Responsive Layout Integrity on Mobile Breakpoint
source: mutation
operator: visual-responsive-break
parent: GD-UI-001
intent: Mobile users frustratedly scroll horizontally to see cut-off stage names and tap on buttons that are too small to hit accurately, wondering "Why doesn't this fit my phone screen?"

input:
  ui_scenario: progress panel breaks on mobile viewport (375px width)
  system_state:
    viewport_widths:
      - 375px  # Mobile
      - 768px  # Tablet
      - 1024px # Desktop
      - 1440px # Large desktop
    components:
      - StageCard
      - ProgressPanel
      - EvolutionTimeline
    layout_requirements:
      min_touch_target: '44px'
      content_padding: '16px'
      no_horizontal_scroll: true

expected:
  ui_must_show:
    - all components fit within viewport without horizontal scroll
    - touch targets maintain minimum 44px height
    - text remains readable at all breakpoints
    - layout adapts gracefully from desktop to mobile
  ui_must_not_show:
    - horizontal scrollbar appearing on mobile
    - stage card content truncated or overflowing
    - text becoming unreadably small
    - buttons too small to tap (< 44px)
    - content overlapping or breaking grid layout
  interaction_contract:
    - user can interact with all controls on mobile device
    - no content is hidden or inaccessible
    - layout responds predictably to viewport changes

anti_patterns:
  - Stage card overflows viewport on 375px width
  - Grid layout breaks causing content overlap
  - Text shrinks below 12px on mobile
  - Touch targets below 44px minimum
  - Horizontal scroll required to see full content
  - Sidebar pushes main content off-screen on mobile

notes:
  - Tests responsive design integrity across breakpoints.
  - Use Chrome DevTools device simulation for verification.
  - Check Layout component mobile behavior.

tags:
  - mutation
  - visual-design
  - responsive
  - mobile
  - layout-integrity

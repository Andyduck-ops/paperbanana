id: GD-UI-006-M-a11y-06
priority: P0
layer: ui
title: Focus Visible During and After Task Completion
source: mutation
operator: a11y-focus-visible
parent: GD-UI-001
intent: Focus must be visible at all times during task execution and after completion. When the task completes, focus must be moved to the completed artifact or status message so keyboard users know the task is done and where to find results.
wcag_criterion: WCAG 2.1 2.4.7 Focus Visible (Level AA)

input:
  ui_scenario: keyboard user submits task and waits for completion
  system_state:
    session_status: completed
    artifact_visible: true
    input_method: keyboard_only

expected:
  focus_indicator_must_be_visible_at_all_times: true
  focus_must_move_to_artifact_on_completion: true
  focus_indicator_must_have_sufficient_contrast: true
  focus_not_lost_during_async_updates: true
  user_must_know_when_task_finishes: true

anti_patterns:
  - focus disappears when progress bar updates
  - focus moves to body element on completion
  - no visible focus indicator (outline: none in CSS)
  - focus is trapped in input field after submission
  - user cannot find completed artifact without tabbing through entire page
  - focus indicator has low contrast (less than 3:1)
  - screen reader does not announce completion

notes:
  - Move focus to the artifact container or completion message.
  - Use focus() method with aria-live announcement together.
  - Ensure focus indicator has at least 3:1 contrast ratio.
  - Test focus flow: input -> submit -> waiting -> completion.

tags:
  - mutation
  - accessibility
  - focus-management
  - wcag-2.4.7
  - keyboard-navigation
  - completion-state

id: GD-UI-005-M-responsive-02
priority: P1
layer: ui
title: Tablet Batch Grid Layout
source: mutation
operator: responsive-batch-grid
parent: GD-UI-005
intent: At tablet viewports, batch tasks must be displayed in a multi-column grid to optimize screen usage while maintaining touch accessibility.

input:
  ui_scenario: user views batch of tasks on tablet device
  system_state:
    batch_status: partial
    total_tasks: 10
    completed_tasks: 6
    running_tasks: 1
    failed_tasks: 1
    pending_tasks: 2
    viewport:
      width: 768px
      height: 1024px
    breakpoint: tablet

expected:
  ui_must_show:
    - two-column grid layout for task items
    - each task item minimum 200px width
    - each task item minimum 80px height
    - status and name visible on each item
  ui_must_not_show:
    - single column wasting horizontal space
    - three or more columns cramming content
    - task items smaller than 200px width
    - task items smaller than 44px height
  interaction_contract:
    - user can see multiple tasks at once
    - user can tap any task easily
    - grid layout makes efficient use of tablet screen

anti_patterns:
  - Single column list on 768px viewport
  - Four columns with task items only 160px each
  - Task height only 40px
  - Task names truncated in grid view
  - No status visible without tapping

notes:
  - Tests batch grid layout at tablet viewport.
  - Two columns is optimal for 768px width.
  - Balance between density and readability.

tags:
  - mutation
  - responsive-design
  - batch-display
  - tablet-layout
  - grid-layout

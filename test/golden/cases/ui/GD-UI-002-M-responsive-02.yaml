id: GD-UI-002-M-responsive-02
priority: P1
layer: ui
title: Failure Stage Card Touch Accessibility
source: mutation
operator: responsive-failure-touch
parent: GD-UI-002
intent: When a task fails, the failed stage card must be prominently visible and accessible for touch interaction on mobile devices.

input:
  ui_scenario: user views failed task on mobile and wants to retry or view details
  system_state:
    session_status: failed
    failed_stage: critic
    error_type: validation_error
    stages_completed:
      - retriever
      - planner
      - stylist
      - visualizer
    viewport:
      width: 375px
      height: 667px
    touch_context:
      user_intent: view_failure_details

expected:
  ui_must_show:
    - failed stage card prominently displayed (expanded state)
    - failure indicator visible without scrolling if possible
    - retry button with 44x44px minimum touch target
    - view details button with 44x44px minimum touch target
  ui_must_not_show:
    - failed stage collapsed among other stages
    - failure requires scrolling to discover
    - retry button smaller than 44x44px
    - failure stage card hidden below fold
  interaction_contract:
    - user immediately sees which stage failed
    - retry action is accessible with single tap
    - detailed error view accessible with single tap

anti_patterns:
  - Failed stage collapsed, user must tap to expand
  - All stages show equal visual weight, failure not prominent
  - Failure indicator only visible after scrolling
  - Retry button 32x32px touch target
  - View details button overlaps with retry button

notes:
  - Tests failure visibility and touch accessibility on mobile.
  - Failed stage should have elevated visual prominence.
  - Touch targets for error actions must meet minimum size.

tags:
  - mutation
  - responsive-design
  - failure-display
  - touch-accessibility
  - mobile-layout

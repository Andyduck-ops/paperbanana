id: GD-UI-003-M-ui-failed-with-location
priority: P1
layer: ui
title: Failed State Shows Exact Failure Location
source: mutation
operator: ui-failed-with-location
parent: GD-UI-002
intent: When task fails, UI must show the exact stage that failed with clear visual distinction from stages that completed before failure.

input:
  ui_scenario: task failed at visualizer stage
  system_state:
    session_status: failed
    failed_stage: visualizer
    stages_completed:
      - retriever
      - planner
      - stylist
    stages_not_run:
      - critic
    failure_reason: "Render engine timeout after 30s"
    failure_timestamp: "2024-01-15T10:30:45Z"

expected:
  ui_must_show:
    - failed status indicator
    - visualizer highlighted as the failed stage
    - retriever, planner, stylist shown as completed before failure
    - critic shown as not-run, distinct from failed
    - failure reason text visible to user
  ui_must_not_show:
    - generic "generation failed" with no stage attribution
    - all stages shown as failed
    - critic shown as failed when it never ran
    - failure reason hidden behind expand action only
  interaction_contract:
    - user can pinpoint exactly which stage caused the failure
    - user can see which stages completed successfully before failure
    - user has actionable information for debugging or retry

anti_patterns:
  - UI shows "generation failed" with no indication of visualizer
  - all five stages shown with error styling
  - failure location requires user to expand or hover to discover
  - stages that completed before failure shown same as pending stages
  - failure reason shown but failed stage name is missing

notes:
  - Tests failure location visibility as a structural contract.
  - Failed stage must be immediately visually distinct.
  - Stages not run must be clearly separated from failed stage.

tags:
  - mutation
  - ui-state
  - failed-state
  - failure-location
  - stage-attribution

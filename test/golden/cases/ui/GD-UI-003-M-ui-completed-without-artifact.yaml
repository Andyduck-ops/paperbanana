id: GD-UI-003-M-ui-completed-without-artifact
priority: P1
layer: ui
title: Completed State Without Artifact Shows Warning
source: mutation
operator: ui-completed-with-artifact
parent: GD-UI-003
intent: UI must handle the rare case where status is completed but artifact is missing, showing a warning rather than hiding the issue.

input:
  ui_scenario: task marked completed but artifact unavailable
  system_state:
    session_status: completed
    stages_completed:
      - retriever
      - planner
      - stylist
      - visualizer
      - critic
    final_artifact:
      kind: rendered_figure
      available: false
      missing_reason: storage_error

expected:
  ui_must_show:
    - completed status for stages
    - warning indicator for missing artifact
    - clear message that artifact is unavailable
    - suggestion to retry or contact support
  ui_must_not_show:
    - empty artifact area with no explanation
    - success state hiding the missing artifact
    - generic error that obscures the specific issue
  interaction_contract:
    - user understands artifact was generated but is now missing
    - user has actionable next steps

anti_patterns:
  - UI shows completed with empty artifact area, no explanation
  - success animation plays despite missing artifact
  - artifact area shows loading spinner for >60s after completion
  - error message provides no actionable guidance
  - user cannot distinguish from normal loading state

notes:
  - Tests defensive UI handling when artifact is missing post-completion.
  - This is an edge case but critical for user trust.
  - Storage errors, cleanup bugs, or race conditions can cause this.

tags:
  - mutation
  - ui-state
  - completed-state
  - missing-artifact
  - defensive-ui

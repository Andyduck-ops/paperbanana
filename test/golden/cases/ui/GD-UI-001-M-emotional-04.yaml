id: GD-UI-001-M-emotional-04
priority: P1
layer: ui
title: Long Running Task Must Show Progress to Reduce Anxiety
source: mutation
operator: emotional-progress-anticipation
parent: GD-UI-001
intent: During long-running tasks, the UI must provide meaningful progress indicators and anticipation-building information. Users experience anxiety when waiting without feedback; progress visibility reduces this stress.

input:
  ui_scenario: generation task has been running for 30+ seconds
  system_state:
    session_status: running
    current_stage: stylist
    elapsed_time: 45_seconds
    estimated_remaining: unknown
    stages_completed:
      - retriever
      - planner
    stages_remaining:
      - visualizer
      - critic

expected:
  ui_must_show:
    - current stage with descriptive text about what's happening
    - time elapsed indicator
    - reassurance that progress is being made
    - optional: estimated time remaining or percentage
  ui_must_not_show:
    - static spinner with no context
    - no indication of elapsed time
    - message that could imply frozen state
    - silence without any reassuring feedback
  interaction_contract:
    - user feels confident the task is progressing
    - user can estimate how long to wait
    - anxiety is reduced through transparency

anti_patterns:
  - spinner animation with no stage context for 60+ seconds
    - no elapsed time shown, making duration unclear
    - message "Processing..." that never changes
    - no visual differentiation between 5 seconds and 2 minutes
    - progress bar stuck at same percentage for extended period
    - no textual description of what stage is doing
    - user wonders if system is frozen

notes:
  - Uncertainty creates anxiety; transparency builds trust.
  - Consider showing: "Stylist is refining your diagram (45s elapsed)"
  - Even without accurate ETA, acknowledgment of time passing helps.
  - Micro-animations within progress reduce perception of frozen state.

tags:
  - mutation
  - emotional-design
  - progress-feedback
  - anxiety-reduction
  - waiting-experience
  - transparency

id: GD-UI-007-M-copy-15
priority: P1
layer: ui
title: Bulk Action Confirmation Must Show Item Count And Scope
source: mutation
operator: copy-bulk-action-no-scope
parent: GD-UI-001
intent: Bulk action confirmations must clearly show how many items are affected and what will happen to them. Users need to verify the scope matches their intent before confirming irreversible bulk operations.

input:
  ui_scenario: user triggers a bulk action on multiple items
  system_state:
    bulk_contexts:
      - action: delete_selected
        item_count: 5
        item_type: artifacts
      - action: export_all
        item_count: 23
        item_type: reports
      - action: archive_marked
        item_count: 12
        item_type: tasks
      - action: clear_completed
        item_count: 47
        item_type: history items

expected:
  ui_must_show:
    - exact count of items affected
    - type of items affected
    - action that will be performed
    - warning if action is irreversible
  ui_must_not_show:
    - generic "Delete selected?" without count
    - action that doesn't specify which items are selected
    - confirmation that hides irreversible warning
    - confirmation that can be accidentally triggered
  interaction_contract:
    - user can verify correct items are selected
    - count matches user's selection
    - cancel is the default focus for destructive actions

anti_patterns:
  - Dialog "Delete selected items?" without showing count
  - "Export all" confirmation without showing 23 items will export
  - Bulk delete without warning that action is irreversible
  - Confirmation that doesn't show which specific items are selected
  - "Are you sure you want to proceed?" without any details
  - Bulk action that doesn't allow user to review selection first
  - Delete confirmation where "Delete" is default focused button

notes:
  - Pattern: "[Action] [count] [item type]? [Consequence warning]."
  - Example: "Delete 5 artifacts? This cannot be undone."
  - Show item names or preview of selection when possible.
  - Destructive bulk actions should have cancel as default.

tags:
  - mutation
  - ux-writing
  - bulk-actions
  - confirmation-dialog
  - item-count
  - scope-clarity

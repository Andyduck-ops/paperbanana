id: GD-UI-013-M-cognitive-timer-no-elapsed
priority: P1
layer: ui
title: No Elapsed Time Or Duration Estimate For Running Tasks
source: mutation
operator: cognitive-timer-no-elapsed
parent: GD-UI-001
intent: Running tasks must show elapsed time and estimated remaining time. Without timing information, users cannot plan or decide whether to wait, increasing anxiety and uncertainty.

input:
  ui_scenario: task running with no time information
  system_state:
    session_status: running
    current_stage: planner
    started_at: "2024-01-15T10:30:00Z"
    current_time: "2024-01-15T10:35:00Z"
    ui_shows: spinner_only_no_time

expected:
  ui_state_must_include:
    - key: elapsed_time
      value_type: string
      value_pattern: "^[0-9]+[smh]"
    - key: current_stage
      value: planner
    - key: started_at
      value_type: timestamp
  elapsed_time_counter_must_update: true
  stage_duration_display_must_show:
    - stage: retriever
      show_status: completed
  must_indicate_if_estimate_unavailable: true

anti_patterns:
  - spinner with no indication of how long task has been running
  - no elapsed time counter
  - no estimate of when task will complete
  - user cannot tell if task is stuck or just slow
  - no historical data on typical duration for task type
  - 5 minutes feels like 5 seconds or 5 hours (no reference)
  - no comparison to average completion time

notes:
  - Show "Running for 2m 34s" with elapsed counter.
  - Show "Usually takes 3-5 minutes" for estimate.
  - Historical averages help calibrate expectations.
  - If estimate unavailable, show elapsed + "calculating...".
  - Color change or warning if exceeding typical duration.
  - Verification: ui_state.elapsed_time is present and formatted as duration string.
  - Verification: elapsed_time updates at least every 5 seconds.

tags:
  - mutation
  - user-cognitive-trap
  - time-uncertainty
  - duration-anxiety
  - progress-estimation
  - planning-impairment

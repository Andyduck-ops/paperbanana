id: GD-UI-007-M-copy-01
priority: P0
layer: ui
title: Button Labels Must Be Verb-First and Concise
source: mutation
operator: copy-button-verbosity
parent: GD-UI-001
intent: Button labels must use verb-first construction and stay under 3 words to ensure quick comprehension and confident action. Users scan buttons rather than reading them fully, so the action must be immediately clear.

input:
  ui_scenario: user is viewing action buttons across the application
  system_state:
    buttons_to_verify:
      - id: submit-btn
        context: form submission
      - id: cancel-btn
        context: modal dismissal
      - id: retry-btn
        context: error recovery
      - id: download-btn
        context: artifact export
    i18n_consideration: text must accommodate 40% length expansion for translation

expected:
  ui_must_show:
    - verb-first label construction (e.g., "Download Report" not "Report Download")
    - maximum 3 words per button label
    - action-oriented language that matches user intent
  ui_must_not_show:
    - noun-first labels like "Report Download" or "Form Submission"
    - labels exceeding 3 words
    - passive voice constructions
    - vague labels like "Click Here" or "Submit"
  interaction_contract:
    - user can predict button action without reading context
    - button labels remain clear after 40% translation expansion
    - action is reversible or cancellable for destructive operations

anti_patterns:
  - Button label "Click Here to Submit Your Query" (too long, no verb-first)
  - Button label "Report PDF Download" (noun-first, passive)
  - Button label "Proceed to Next Step" (3 words but could be "Continue")
  - Button label "OK" (too vague, no action indicated)
  - Button label "Submission" (noun, no action)
  - Button label "Cancel and Return to Previous Screen" (excessive verbosity)
  - Non-English translation requires 50% more characters breaking layout

notes:
  - Verb-first improves scannability and reduces cognitive load.
  - 3-word limit ensures mobile layouts remain usable.
  - Test with German/French translations which expand 20-40%.
  - Common patterns: "Download", "Cancel", "Retry", "Save", "Delete".

tags:
  - mutation
  - ux-writing
  - button-labels
  - verb-first
  - i18n-ready
  - conciseness

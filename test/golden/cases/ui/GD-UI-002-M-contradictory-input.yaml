id: GD-UI-002-M-contradictory-input
priority: P1
layer: ui
title: Contradictory Input Must Show Conflict Resolution In UI
source: mutation
operator: contradictory-input
parent: GD-UI-002
intent: When a prompt contains contradictory constraints, the UI must show either the resolved interpretation or a clear error explaining the conflict.

input:
  ui_scenario: task with contradictory prompt
  system_state:
    one_of:
      - scenario: resolved
        session_status: completed
        conflict_resolution: logged
        constraint_satisfied: primary
      - scenario: rejected
        session_status: failed
        failed_stage: validation_or_planner
        contradiction_detected: true

expected:
  resolved_scenario:
    ui_must_show:
      - completed status
      - indication of which constraint was prioritized
      - final artifact
    ui_must_not_show:
      - error message when task actually completed
  rejected_scenario:
    ui_must_show:
      - failed status
      - clear explanation of conflicting constraints
      - guidance on how to resolve the conflict
    ui_must_not_show:
      - generic error message
      - artifact when task was rejected

anti_patterns:
  - UI shows completed but artifact violates stated constraints with no constraint_violation_warning
  - UI shows generic "generation failed" without mentioning contradiction
  - conflict is detected but error message does not explain which constraints conflict
  - user cannot tell whether task completed or failed
  - artifact is shown but does not match any of the user's stated requirements

notes:
  - Contradictory input is an edge case with two valid outcomes.
  - Either the system resolves the conflict (and shows how) or rejects (and explains why).
  - The anti-pattern is silent resolution or generic rejection.
  - This tests UI's ability to communicate complex error conditions.

tags:
  - mutation
  - input-ambiguity
  - contradictory-input
  - conflict-resolution
  - error-clarity

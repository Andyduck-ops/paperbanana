id: GD-UI-M-motion-07
priority: P1
title: Cancel Button Animation Feedback
layer: ui
source: motion-design
operator: motion-cancel-feedback
parent: GD-UI-001
intent: Cancel button must provide animation feedback when clicked, confirming the user's action and showing the transition from running to cancelled state.

input:
  ui_scenario: user clicks cancel button during running task
  system_state:
    initial_status: running
    action: cancel_clicked
    resulting_status: cancelled
    cancel_animation:
      type: confirmation
      trigger: cancel_click
      timing_ms: 100-300
      state_transition_animation_ms: 200-400

expected:
  ui_must_show:
    - immediate button press feedback (scale or color change)
    - animation confirming cancel was received
    - smooth transition from running to cancelled state
    - cancelled state has distinct visual from failed state
  ui_must_not_show:
    - no visual feedback on button click (appears unresponsive)
    - running state continues after cancel clicked
    - cancelled state animation same as failure animation
    - animation that suggests the cancel might fail
  interaction_contract:
    - user receives immediate confirmation that cancel was registered
    - animation provides confidence that action was received
    - cancelled state clearly distinguished from failure
  motion_contract:
    - button_feedback_ms: 100-300
    - state_transition_ms: 200-400
    - purpose: action_confirmation
    - distinction: cancelled_vs_failed

anti_patterns:
  - button shows no press feedback
  - running state continues for seconds after cancel
  - cancelled looks identical to failed state
  - animation suggests uncertainty or pending state
  - cancel animation is identical to generic button press

notes:
  - Tests that destructive actions have confirming animation feedback.
  - User must feel confident their cancel request was received.
  - Cancelled is intentional; failed is unexpected - reflect this.

tags:
  - motion-design
  - cancel-animation
  - action-feedback
  - button-press-feedback
  - state-transition

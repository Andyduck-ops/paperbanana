id: GD-UI-002-M-fail-at-retriever-early
priority: P1
layer: ui
title: UI Visibility On Early Retriever Failure
source: mutation
operator: fail-at-retriever
parent: GD-UI-002
intent: When retriever fails at the very start, the UI must show retriever as failed and all other stages as not-run, without suggesting user wait for progress.

input:
  ui_scenario: task has failed at the retriever stage immediately
  system_state:
    session_status: failed
    failed_stage: retriever
    stages_completed: []
    stages_not_run:
      - planner
      - stylist
      - visualizer
      - critic
    error_detail: "connection refused to retrieval service"

expected:
  ui_must_show:
    - failed status indicator
    - retriever as the failed stage name
    - all four downstream stages shown as not run
    - no stages shown as completed
    - clear indication that no progress was made
  ui_must_not_show:
    - running spinner or "processing" indicator
    - retry countdown or automatic retry
    - stages shown as "queued" or "pending"
    - generic "something went wrong" without stage context
  interaction_contract:
    - user understands failure happened immediately
    - user has clear action: check connection or contact support
    - retry button available and functional

anti_patterns:
  - UI shows "loading" state instead of failure
  - stages shown as "waiting" or "queued" instead of not-run
  - failed_stage shown as "initialization" or "startup"
  - error detail exposed without sanitization
  - no actionable guidance for user

notes:
  - Early failure tests the UI's ability to show zero progress.
  - The UI must not give false hope of eventual progress.
  - User must understand this is a terminal failure, not a delay.

tags:
  - mutation
  - failure-location
  - retriever
  - ui-visibility
  - early-failure
  - zero-progress

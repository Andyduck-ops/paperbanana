id: GD-UI-001-M-visual-11
priority: P1
layer: ui
title: Progress Bar Visual Integrity
source: mutation
operator: visual-progress-bar-break
parent: GD-UI-001
intent: Users watching the progress bar jump abruptly from 30% to 70% in an instant think "Did something go wrong? Did it skip some work?" instead of feeling reassured by smooth visual feedback.

input:
  ui_scenario: BatchProgressPanel progress bar has visual inconsistencies
  system_state:
    progress_bar_specs:
      container_height: 'h-2 (8px)'
      background: 'bg-muted'
      fill_color: 'bg-primary'
      border_radius: 'rounded-full'
      transition: 'transition-all duration-300'
    progress_values:
      - value: 0
        width: '0%'
      - value: 50
        width: '50%'
      - value: 100
        width: '100%'

expected:
  ui_must_show:
    - progress bar with consistent height (8px / h-2)
    - smooth transition when progress changes
    - fill color using primary theme token
    - rounded ends (rounded-full) for visual polish
  ui_must_not_show:
    - progress bar taller or shorter than expected
    - jarring or missing transition effects
    - fill color not matching primary theme
    - square ends instead of rounded
    - progress bar exceeding container bounds
  interaction_contract:
    - user sees smooth, continuous progress indication
    - progress bar accurately reflects completion percentage
    - visual feedback matches actual system state

anti_patterns:
  - Progress bar height varies (h-1 in one place, h-3 in another)
  - No transition, progress jumps instantly
  - Fill uses hard-coded color instead of bg-primary
  - Progress bar overflows container at 100%
  - Square corners instead of rounded-full
  - Progress bar invisible against background

notes:
  - Tests BatchProgressPanel progress bar visual integrity.
  - Progress bar should use theme tokens for colors.
  - Transition should be smooth but not slow.

tags:
  - mutation
  - visual-design
  - progress-bar
  - animation
  - feedback

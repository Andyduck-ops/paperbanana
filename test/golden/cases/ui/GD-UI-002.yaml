id: GD-UI-002
priority: P0
layer: ui
title: Failure Location Visible On Stage Error
source: seed
intent: When a task fails, the UI must display where in the pipeline the failure occurred and must not show only a generic error message.

input:
  ui_scenario: task has failed at a known stage
  system_state:
    session_status: failed
    failed_stage: visualizer
    stages_completed:
      - retriever
      - planner
      - stylist
    stages_not_run:
      - critic

expected:
  ui_must_show:
    - failed status indicator
    - the name of the failed stage
    - stages that completed before failure
    - clear distinction between completed stages and stages that did not run
  ui_must_not_show:
    - completed badge
    - final artifact
    - running spinner
  interaction_contract:
    - user can identify at which stage the run stopped
    - user has enough information to decide whether to retry

anti_patterns:
  - generic message such as "generation failed" with no stage attribution
  - all stages shown as failed even though some completed
  - failed stage shown the same as a pending stage
  - error state collapses pipeline view entirely with no recoverable context
  - UI shows empty state instead of failure state

notes:
  - The specific error reason text is not tested here.
  - The contract is about structural failure attribution, not error message copy.
  - This case pairs with GD-002 on the orchestration layer.

tags:
  - ui
  - failure
  - failure-visibility
  - stage-attribution
  - error-state

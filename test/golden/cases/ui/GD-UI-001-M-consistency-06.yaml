id: GD-UI-001-M-consistency-06
priority: P1
layer: ui
title: Session Restored From Stale Browser Cache
source: mutation
operator: consistency-stale-cache
parent: GD-UI-001
intent: When browser restores session from stale cache (e.g., after crash), UI must detect and refresh against current backend state.

input:
  ui_scenario: browser restores tab with cached session showing completed, but backend shows session was deleted
  system_state:
    cached_frontend_state:
      session_id: session-stale-cache-001
      status: completed
      current_stage: visualizer
      artifact_id: artifact-old
      cached_at: t0
    backend_actual_state:
      session_exists: false
      deleted_at: t1
      deletion_reason: "user requested deletion"
    time_elapsed_since_cache: 2_hours
    storage_source: sessionStorage

expected:
  ui_must_show:
    - session not found error message
    - indication that cached state is stale
    - option to start new generation
  ui_must_not_show:
    - completed state with artifact that no longer exists
    - 404 error when user tries to download artifact
    - confusing state where UI shows content but backend has none
  interaction_contract:
    - user understands session no longer exists
    - user can start fresh without error artifacts
    - stale cache is detected and invalidated

anti_patterns:
  - UI shows completed with artifact download that fails
  - No validation of cached state against backend
  - User sees ghost session that does not exist
  - No cleanup of stale cached data
  - Error only appears when user interacts with non-existent data

notes:
  - Tests cache invalidation and state validation.
  - Frontend should validate cached session on mount.
  - Background validation prevents stale data display.
  - SessionStorage can persist across page reload.

tags:
  - mutation
  - state-consistency
  - stale-cache
  - session-restoration
  - cache-invalidation

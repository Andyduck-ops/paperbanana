id: GD-UI-007-M-copy-03
priority: P0
layer: ui
title: Empty States Must Explain What To Do Next
source: mutation
operator: copy-empty-state-no-guidance
parent: GD-UI-001
intent: Empty states are opportunities to guide users toward their first action. Empty states must never just say "empty" or "no data" - they must explain why it's empty and what action will populate it.

input:
  ui_scenario: user views a panel with no content
  system_state:
    empty_state_contexts:
      - panel: history_list
        reason: no previous tasks
      - panel: artifact_list
        reason: no completed tasks
      - panel: search_results
        reason: query returned no matches
      - panel: template_list
        reason: no saved templates

expected:
  ui_must_show:
    - clear explanation of why the state is empty
    - primary action button to resolve the empty state
    - optional secondary guidance or illustration
  ui_must_not_show:
    - single word labels like "Empty" or "No data"
    - technical terms like "Null" or "undefined"
    - empty panels with no text at all
    - messages that make users feel they did something wrong
  interaction_contract:
    - user understands what content will appear here
    - user knows exactly what action creates content
    - empty state feels inviting, not like a dead end

anti_patterns:
  - Empty state showing only "No items found" (no action, no context)
  - Empty panel with no text at all
  - "No results" without search tips or alternative queries
  - "Empty list" without explaining what list is for
  - "You have no history" (blames user, no guidance)
  - Blank white space with no indication this is expected
  - "No artifacts available" without "Run a task to create one"

notes:
  - Structure: [What's missing] + [Why] + [How to add].
  - Example: "No task history yet. Run your first query to see results here."
  - Include illustration or icon for visual interest.
  - Empty states are conversion opportunities.

tags:
  - mutation
  - ux-writing
  - empty-state
  - guidance
  - onboarding
  - first-time-user

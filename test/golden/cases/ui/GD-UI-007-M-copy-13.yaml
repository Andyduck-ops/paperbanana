id: GD-UI-007-M-copy-13
priority: P2
layer: ui
title: Checkbox and Radio Labels Must Be Self-Explanatory
source: mutation
operator: copy-option-not-self-explanatory
parent: GD-UI-001
intent: Checkbox and radio button labels must fully explain the option without requiring additional context. Users should understand the consequence of selecting each option from the label alone.

input:
  ui_scenario: user is configuring options via checkboxes and radio buttons
  system_state:
    option_contexts:
      - type: checkbox
        context: export settings
        options_visible: true
      - type: radio
        context: output format
        options_visible: true
      - type: checkbox
        context: notification preferences
        options_visible: true
      - type: radio
        context: task priority
        options_visible: true

expected:
  ui_must_show:
    - label that explains option without external context
    - clear distinction between similar options
    - consequence or effect of the option if significant
  ui_must_not_show:
    - labels like "Enable" or "Yes" without context
    - jargon that requires documentation to understand
    - options that are ambiguous between each other
    - labels that require reading surrounding text
  interaction_contract:
    - user can make selection without reading help
    - each option is clearly different from others
    - default selection is indicated

anti_patterns:
  - Checkbox label "Enable" without saying what is enabled
  - Radio option "Option A" and "Option B" (no explanation)
  - Checkbox "Advanced mode" without explaining what it changes
  - Radio "Fast" and "Accurate" without explaining trade-off
  - Label "Notify me" without specifying when or about what
  - Checkbox with label that only makes sense with paragraph above
  - "Yes" and "No" radio options without question restated

notes:
  - Labels should work standalone without surrounding context.
  - Example: "Include source citations in output" not "Include citations".
  - For complex options, use helper text below, not label itself.
  - Test by reading only the label - does it make sense?

tags:
  - mutation
  - ux-writing
  - checkbox-labels
  - radio-options
  - form-design
  - self-explanatory

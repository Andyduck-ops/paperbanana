id: GD-UI-006-M-a11y-07
priority: P1
layer: ui
title: Error Messages Announced to Screen Readers
source: mutation
operator: a11y-error-announcement
parent: GD-UI-002
intent: When a task fails, the error message must be announced to screen reader users. The failure notification must use appropriate ARIA roles (alert or status) to ensure users are immediately notified of the failure and can understand what went wrong.
wcag_criterion: WCAG 2.1 4.1.3 Status Messages (Level AA)

input:
  ui_scenario: task fails at critic stage, screen reader user monitoring
  system_state:
    session_status: failed
    failed_stage: critic
    error_message: "Style validation failed: inconsistent color palette"
    assistive_tech: screen_reader_enabled

expected:
  error_must_be_announced: true
  error_message_must_use_aria_role_alert: true
  error_message_content_must_include:
    - stage_name: "critic"
    - error_reason: "validation failed"
  error_must_be_focusable_or_announced: true

anti_patterns:
  - error message is only visible, not announced
  - error appears without ARIA live region
  - screen reader user unaware task has failed
  - error message is vague: "An error occurred"
  - error does not mention which stage failed
  - user must visually scan page to discover failure
  - aria-live="polite" used for critical failure (should be assertive)

notes:
  - Use role="alert" or aria-live="assertive" for failures.
  - Include stage name in message: "Failed at Critic stage: [reason]."
  - Consider moving focus to error message for keyboard users.
  - Provide actionable next step in message.
  - Verification: error element has role="alert" or aria-live="assertive".
  - Verification: error message contains stage name.

tags:
  - mutation
  - accessibility
  - screen-reader
  - aria-alert
  - wcag-4.1.3
  - error-visibility
  - failure-communication

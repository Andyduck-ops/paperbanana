id: GD-UI-004-M-responsive-01
priority: P1
layer: ui
title: Mobile Resume History Compact Display
source: mutation
operator: responsive-resume-history-compact
parent: GD-UI-004
intent: Resume history and prior output chain must be viewable on mobile in compact but complete form without horizontal scroll.

input:
  ui_scenario: user views resumed task with prior execution history on mobile
  system_state:
    session_status: running
    is_resumed: true
    resume_from_stage: stylist
    prior_runs:
      - session_id: prev-001
        status: failed
        failed_at: retriever
        timestamp: "2024-01-15T10:30:00Z"
      - session_id: prev-002
        status: failed
        failed_at: planner
        timestamp: "2024-01-15T11:00:00Z"
    current_run:
      session_id: current-001
      status: running
      current_stage: stylist
    viewport:
      width: 375px
      height: 667px
    breakpoint: mobile

expected:
  ui_must_show:
    - resume indicator visible at top of progress
    - prior failed attempts indicated compactly
    - current run clearly distinguished from history
    - each history item minimum 44px touch target
  ui_must_not_show:
    - history requiring horizontal scroll
    - history items too small for touch interaction
    - no visual distinction between current and prior runs
    - history taking up excessive vertical space
  interaction_contract:
    - user understands this is a resumed task
    - user can see how many prior attempts existed
    - user can tap history item for details

anti_patterns:
  - History items displayed horizontally requiring scroll
  - Each history item only 24px tall
  - All runs shown identically with no distinction
  - History section takes 50% of screen height
  - No indication that this is a resumed task

notes:
  - Tests resume history visualization on mobile.
  - Compact vertical timeline is optimal for mobile.
  - Clear distinction between current and prior runs.

tags:
  - mutation
  - responsive-design
  - resume-semantics
  - mobile-layout
  - history-display

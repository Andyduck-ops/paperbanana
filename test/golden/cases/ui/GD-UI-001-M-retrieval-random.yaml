id: GD-UI-001-M-retrieval-random
priority: P1
layer: ui
title: Stage Progress Visible With Random Retrieval
source: mutation
operator: retrieval-random
parent: GD-UI-001
intent: UI must display accurate stage progress when using random retrieval mode, proving retrieval mode does not affect progress reporting.

input:
  ui_scenario: task is mid-execution with random retrieval
  system_state:
    session_status: running
    current_stage: planner
    retrieval_mode: random
    stages_completed:
      - retriever
    stages_remaining:
      - stylist
      - visualizer
      - critic

expected:
  ui_must_show:
    - current active stage name
    - stages already completed
    - overall pipeline structure (not just a spinner)
  ui_must_not_show:
    - completed badge
    - final artifact
    - failure message
    - retrieval mode indicator to user
  interaction_contract:
    - user can see the task is alive
    - user can identify which agent is currently working

anti_patterns:
  - UI shows spinner with no stage information due to random retrieval
  - stage events are delayed or missing when retrieval_mode is random
  - current_stage shows incorrect value
  - stages_completed list is empty or incorrect

notes:
  - Tests that random retrieval mode does not affect UI progress visibility.
  - The retrieval mode is an implementation detail not exposed to user.
  - Wire against the hook that consumes stage events regardless of retrieval mode.

tags:
  - mutation
  - retrieval-variation
  - retrieval-random
  - progress-visibility

id: GD-UI-004-M-responsive-02
priority: P1
layer: ui
title: Desktop Resume Context Sidebar
source: mutation
operator: responsive-resume-sidebar
parent: GD-UI-004
intent: On desktop viewports, resume history and inherited artifacts must be displayed in dedicated sidebar section for full context visibility.

input:
  ui_scenario: user views resumed task with prior artifacts on desktop
  system_state:
    session_status: running
    is_resumed: true
    resume_from_stage: stylist
    inherited_artifacts:
      - stage: retriever
        artifact_type: documents
        count: 15
      - stage: planner
        artifact_type: plan
        status: available
    prior_runs:
      - session_id: prev-001
        status: failed
        failed_at: retriever
    current_stage: stylist
    viewport:
      width: 1440px
      height: 900px
    breakpoint: desktop

expected:
  ui_must_show:
    - resume history in sidebar with details
    - inherited artifacts listed with links
    - clear visual separation from current run
    - both history and artifacts visible simultaneously
  ui_must_not_show:
    - history hidden in collapsible section
    - artifacts not visible without interaction
    - no distinction between inherited and current artifacts
    - history cramped into single line
  interaction_contract:
    - user sees full resume context at a glance
    - inherited artifacts are accessible
    - user understands what was inherited vs new

anti_patterns:
  - Resume history hidden behind expand button
  - Inherited artifacts not shown in sidebar
  - All artifacts mixed together without source indication
  - History shown only as "2 prior attempts" with no detail
  - Sidebar too narrow to show artifact names

notes:
  - Tests resume context display on desktop.
  - Sidebar should show full context information.
  - Inherited vs new artifacts must be distinguishable.

tags:
  - mutation
  - responsive-design
  - resume-semantics
  - desktop-layout
  - inherited-artifacts

id: GD-UI-003
priority: P0
layer: ui
title: Artifact Surfaced On Completion
source: seed
intent: When a task completes, the UI must surface the final artifact in a usable form and must transition cleanly out of the running state.

input:
  ui_scenario: task has completed successfully
  system_state:
    session_status: completed
    current_stage: critic
    stages_completed:
      - retriever
      - planner
      - stylist
      - visualizer
      - critic
    final_artifact:
      kind: rendered_figure
      mime_type: image/png
      uri: memory://visualizer/current
      bytes_present: true

expected:
  ui_must_show:
    - completed status indicator
    - final artifact rendered or downloadable
    - all stages shown as completed
  ui_must_not_show:
    - running spinner
    - failure message
    - empty artifact area
  interaction_contract:
    - user can view or download the final artifact
    - user can confirm the run is complete and stable
    - completed state is non-transient and does not revert to running

anti_patterns:
  - completed badge shown but artifact area is empty or still loading
  - artifact is present in backend state but not surfaced to UI
  - UI oscillates between completed and running after task finishes
  - download or preview action is unavailable despite artifact being present
  - only the last stage is shown as completed, earlier stages are lost

notes:
  - This case tests the completion transition and artifact availability together.
  - Artifact visual quality is not evaluated here.
  - Wire against the component that receives session_status=completed and renders artifact.

tags:
  - ui
  - completion
  - artifact
  - artifact-visibility
  - completed-state

id: GD-UI-008-M-interaction-10
priority: P2
layer: ui
title: Touch Targets Have Minimum 44px Hit Area
source: mutation
operator: interaction-touch-target-size
parent: GD-UI-001
intent: All interactive elements must have a touch target of at least 44x44 pixels for comfortable mobile interaction. Smaller targets cause frustration and errors on touch devices.

input:
  ui_scenario: user accesses interface on touch device
  system_state:
    device_type: touch
    interactive_elements:
      - element: generate_button
        rendered_size_px: 180x48
      - element: mode_toggle
        rendered_size_px: 32x32
      - element: help_icon
        rendered_size_px: 24x24

expected:
  ui_must_show:
    - all interactive elements with minimum 44x44px touch target
    - smaller icons wrapped in larger touch area
    - adequate spacing between touch targets
  ui_must_not_show:
    - touch targets smaller than 44x44px
    - touch targets too close together (less than 8px gap)
  interaction_contract:
    - min_touch_target_px: 44x44
    - min_spacing_between_targets_px: 8
  accessibility_criterion: WCAG 2.1 2.5.5 Target Size (Level AAA)

anti_patterns:
  - Help icon is 24x24px with no padding, impossible to tap accurately
  - mode toggle is 32x32px, user taps wrong option repeatedly
  - interactive elements so close together user taps wrong one
  - no touch target expansion on small icons
  - desktop-sized buttons used on mobile without adaptation
  - touch area ends at visual boundary, no extended tap region

notes:
  - Visual element can be smaller than 44px if touch target is expanded.
  - Use padding or hit area expansion for small icons.
  - Test on actual touch devices, not just responsive view.
  - Consider thumb reach and one-handed use.

tags:
  - mutation
  - interaction-design
  - touch-target
  - mobile
  - accessibility
  - wcag-2.5.5

id: GD-UI-M-motion-03
priority: P0
title: Failure Animation Distinct From Success
layer: ui
source: motion-design
operator: motion-failure-distinction
parent: GD-UI-002
intent: Failure state must have animation that is visually distinct from success animation, conveying negative outcome through color, motion pattern, and timing that users cannot confuse.

input:
  ui_scenario: task transitions from running to failed
  system_state:
    session_status: failed
    previous_status: running
    failed_stage: visualizer
    failure_animation:
      type: error_indication
      trigger: failure_event
      expected_duration_ms: 200-400
      distinction_requirements:
        color_different_from_success: true
        motion_pattern_different_from_success: true
        no_celebration_elements: true

expected:
  ui_must_show:
    - failure animation that is visually distinct from success animation
    - muted or negative color palette (red, orange, gray tones)
    - motion pattern suggesting error (shake, fade-out, not bounce or glow)
    - clear error iconography (X, warning triangle)
  ui_must_not_show:
    - same animation as success with different color only
    - celebratory motion elements (confetti, bounce, glow)
    - animation that could be mistaken for success at a glance
    - instant state change without animation feedback
  interaction_contract:
    - user immediately understands outcome is negative
    - animation directs attention to failure location
    - user can distinguish failure from success without reading text
  motion_contract:
    - animation_duration_ms: 200-400
    - trigger: failure_status_change
    - purpose: negative_feedback_and_location_cue
    - distinct_from_success: true

anti_patterns:
  - failure uses same animation as success with only icon change
  - failure animation includes any celebratory elements
  - failure animation uses green or positive color tones
  - failure animation bounces or pulses like success
  - user must read text to know if task succeeded or failed

notes:
  - Tests that failure animation is meaningfully distinct from success.
  - Distinction must work at the animation level, not just color/icon.
  - Motion vocabulary: success = upward, expansive; failure = shake, dim, contain.

tags:
  - motion-design
  - failure-animation
  - success-failure-distinction
  - negative-feedback
  - visual-distinction

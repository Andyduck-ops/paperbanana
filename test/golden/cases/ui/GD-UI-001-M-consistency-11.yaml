id: GD-UI-001-M-consistency-11
priority: P1
layer: ui
title: Batch Item Status Sum Mismatch
source: mutation
operator: consistency-batch-sum-drift
parent: GD-UI-005
intent: Batch summary counts must match sum of individual item statuses, preventing confusion from inconsistent aggregates.

input:
  ui_scenario: batch shows 2 failures but individual items show 3 failures
  system_state:
    batch_id: batch-sum-drift-001
    batch_summary:
      total: 5
      running: 1
      completed: 2
      failed: 2
      pending: 0
    batch_items:
      - id: item-1
        status: completed
      - id: item-2
        status: failed
      - id: item-3
        status: failed
      - id: item-4
        status: failed
      - id: item-5
        status: running
    actual_failed_count: 3
    summary_failed_count: 2

expected:
  ui_must_show:
    - summary counts recalculated from actual items
    - consistency check triggers recalculation
    - accurate counts (3 failed, 1 completed, 1 running)
  ui_must_not_show:
    - summary showing 2 failed when items show 3 failed
    - totals that do not sum correctly
    - user must manually count to verify
  interaction_contract:
    - summary is always accurate reflection of items
    - inconsistency triggers automatic correction
    - user can trust summary numbers

anti_patterns:
  - Summary and item counts do not match
  - No validation that totals sum correctly
  - Cached summary not updated when items change
  - User must manually verify summary accuracy
  - Inconsistent counts shown side by side

notes:
  - Tests aggregate state consistency.
  - Summary is derived from items, should never diverge.
  - Must recalculate when items update.
  - Sum validation: total = running + completed + failed + pending.

tags:
  - mutation
  - state-consistency
  - batch-summary
  - aggregate-drift
  - sum-validation

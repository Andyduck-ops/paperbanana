id: GD-UI-005-M-responsive-01
priority: P1
layer: ui
title: Mobile Batch Task List Scrolling
source: mutation
operator: responsive-batch-scroll
parent: GD-UI-005
intent: Batch task list must provide smooth vertical scrolling with each task item fully visible and accessible on mobile viewports.

input:
  ui_scenario: user views batch of 10 tasks on mobile device
  system_state:
    batch_status: partial
    total_tasks: 10
    completed_tasks: 4
    running_tasks: 2
    failed_tasks: 1
    pending_tasks: 3
    viewport:
      width: 375px
      height: 667px
    breakpoint: mobile

expected:
  ui_must_show:
    - vertical scrollable list of task items
    - each task item minimum 60px height for touch accessibility
    - task status visible within item (icon + text)
    - scroll position indicator
  ui_must_not_show:
    - horizontal scroll for task list
    - task items smaller than 44px height
    - status truncated or hidden
    - no indication of scroll progress
  interaction_contract:
    - user can scroll to any task smoothly
    - user can tap any task for details
    - user knows where they are in the list

anti_patterns:
  - Task items displayed in grid requiring horizontal scroll
  - Task items only 32px height
  - Status only shown as icon without text
  - Infinite scroll with no position indication
  - Task names truncated with ellipsis

notes:
  - Tests batch task list scrolling on mobile.
  - Vertical scrolling is expected pattern on mobile.
  - Each task item must be tappable and informative.

tags:
  - mutation
  - responsive-design
  - batch-display
  - mobile-layout
  - scrolling

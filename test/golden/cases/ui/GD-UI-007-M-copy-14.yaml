id: GD-UI-007-M-copy-14
priority: P2
layer: ui
title: Timestamps Must Show Relative Time For Recent Events
source: mutation
operator: copy-timestamp-not-relative
parent: GD-UI-001
intent: Timestamps should use relative time (e.g., "5 minutes ago") for recent events and absolute time for older ones. Users should quickly understand when something happened without mental calculation.

input:
  ui_scenario: user is viewing events or items with timestamps
  system_state:
    timestamp_contexts:
      - event: task_completed
        actual_time: 30 seconds ago
      - event: task_completed
        actual_time: 5 hours ago
      - event: task_completed
        actual_time: 3 days ago
      - event: task_created
        actual_time: 2 months ago

expected:
  ui_must_show:
    - relative time for events within last 24 hours
    - absolute date for events older than 24-48 hours
    - timezone indication or use of local time
  ui_must_not_show:
    - raw timestamps like "2024-03-15T14:30:00Z"
    - relative time for very old events ("3 months ago" is okay)
    - missing timezone context causing confusion
    - relative time that doesn't update as time passes
  interaction_contract:
    - user can quickly understand recency
    - absolute timestamp available on hover for relative times
    - timezone is clear or uses user's local time

anti_patterns:
  - Timestamp shown as "2024-03-15T14:30:00.000Z" (ISO format to user)
  - "5 hours ago" for an event that was 2 days ago (stale relative time)
  - No timezone indication, causing 8-hour confusion
  - Relative time "2 minutes ago" that still shows after 30 minutes
  - Absolute date for something that happened 10 minutes ago
  - Timestamp in UTC when user is in different timezone without indication
  - Unix timestamp shown to user: "1710505800"

notes:
  - Use relative time (< 24h), absolute date (> 24h).
  - Example: "Just now" -> "5 minutes ago" -> "Today at 2:30 PM" -> "Mar 15".
  - Always show full timestamp on hover.
  - Use user's local timezone, indicate if showing UTC.

tags:
  - mutation
  - ux-writing
  - timestamps
  - relative-time
  - date-formatting
  - user-comprehension

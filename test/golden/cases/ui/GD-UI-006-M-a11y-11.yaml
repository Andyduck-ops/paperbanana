id: GD-UI-006-M-a11y-11
priority: P1
layer: ui
title: Progress Information Available Without Time Pressure
source: mutation
operator: a11y-no-time-limit
parent: GD-UI-001
intent: Progress information must remain available without time limits. Users with cognitive or motor impairments who need more time to process information must not have progress indicators disappear or auto-refresh too quickly.
wcag_criterion: WCAG 2.1 2.2.3 No Timing (Level AAA)

input:
  ui_scenario: user with cognitive impairment monitoring a long-running task
  system_state:
    session_status: running
    current_stage: critic
    task_duration: 45_seconds
    user_processing_time_needed: extended

expected:
  progress_must_remain_visible_without_time_limit: true
  no_auto_dismiss_of_status_messages: true
  user_can_control_refresh_rate: true
  historical_progress_must_remain_accessible: true
  no_blinking_or_moving_content: true

anti_patterns:
  - progress indicator auto-hides after 10 seconds
  - status message disappears before user can read it
  - completion notification auto-dismisses
  - progress details require quick reading before update
  - stage history is not preserved
  - auto-refresh overwrites content user was reading
  - no pause option for progress updates

notes:
  - Keep progress information visible until user dismisses or new state.
  - Consider "view history" option for past stages.
  - Allow users to pause auto-refresh if implemented.
  - Error messages should persist until acknowledged.

tags:
  - mutation
  - accessibility
  - time-limits
  - wcag-2.2.3
  - cognitive-impairment
  - progress-persistence

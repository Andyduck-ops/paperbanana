id: GD-UI-006-M-a11y-14
priority: P2
layer: ui
title: Resumed Task Resume Semantics Announced
source: mutation
operator: a11y-resume-announcement
parent: GD-UI-004
intent: When a task is resumed from a previous snapshot, screen reader users must be informed that this is a resumed run, not a fresh start. The UI must announce which stage the resume started from and what prior outputs are available.
wcag_criterion: WCAG 2.1 4.1.3 Status Messages (Level AA)

input:
  ui_scenario: screen reader user viewing a resumed task
  system_state:
    session_status: running
    resume_from_snapshot: true
    resume_stage: stylist
    prior_artifacts:
      - retriever_output
      - planner_output

expected:
  resume_status_must_be_announced: true
  resume_stage_must_be_communicated: true
  prior_artifacts_must_be_announced: true
  aria_live_region_for_resume_info: true
  resume_badge_must_have_accessible_name: true

anti_patterns:
  - resumed task looks identical to fresh task
  - screen reader user unaware task was resumed
  - no announcement of resume stage or prior context
  - "Resumed" badge has no accessible name
  - prior artifacts are not mentioned to screen reader
  - aria-live region does not announce resume context
  - resume information is only visual indicator

notes:
  - Announce: "Resumed task from Stylist stage. Prior outputs available."
  - Use aria-live region for resume context announcement.
  - Ensure resume badge has aria-label or accessible text.
  - Link to prior artifacts in announcement.

tags:
  - mutation
  - accessibility
  - screen-reader
  - wcag-4.1.3
  - resume-semantics
  - context-announcement

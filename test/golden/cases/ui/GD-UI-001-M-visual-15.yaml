id: GD-UI-001-M-visual-15
priority: P1
layer: ui
title: Dark Mode Color Inversion Integrity
source: mutation
operator: visual-dark-mode-break
parent: GD-UI-001
intent: Users switching to dark mode see white text on a white background or black text on a black background, unable to read anything and thinking "This is completely broken. I can't use this at all."

input:
  ui_scenario: Dark mode theme (minimalist-bw or similar) causes color issues
  system_state:
    dark_compatible_themes:
      - minimalist-bw
    color_mappings:
      - light_background: 'oklch(0.98 0 0)'
        dark_foreground: 'oklch(0.12 0 0)'
      - light_foreground: 'oklch(0.12 0 0)'
        dark_background: 'oklch(0.98 0 0)'
    components_to_verify:
      - StageCard text visibility
      - ProgressPanel background contrast
      - Toast readability
      - Input placeholder visibility
      - Button text contrast

expected:
  ui_must_show:
    - text readable against inverted backgrounds
    - borders visible with proper contrast
    - status colors still distinguishable
    - placeholder text visible but subdued
    - focus rings visible on all interactive elements
  ui_must_not_show:
    - white text on white background
    - black text on black background
    - invisible borders due to same-color contrast
    - status indicators indistinguishable
    - focus rings invisible against dark background
  interaction_contract:
    - all functionality preserved in dark mode
    - no information loss or confusion
    - theme switch is instant and complete

anti_patterns:
  - Text color doesn't invert (white on white)
  - Background stays light while text inverts to dark
  - Border invisible (dark border on dark background)
  - Status green becomes indistinguishable from background
  - Focus ring color invisible against dark theme
  - Placeholder text same color as input text

notes:
  - Tests dark mode color handling across all components.
  - CSS custom properties should handle inversion automatically.
  - All contrast ratios must remain valid in dark mode.

tags:
  - mutation
  - visual-design
  - dark-mode
  - color-inversion
  - accessibility

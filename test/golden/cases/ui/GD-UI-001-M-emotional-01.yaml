id: GD-UI-001-M-emotional-01
priority: P1
layer: ui
title: Empty State Must Have Encouraging Message
source: mutation
operator: emotional-empty-state-personality
parent: GD-UI-001
intent: When no corpus or history exists, empty states must show encouraging, personality-rich messaging rather than cold technical messages. Empty states are trust-building opportunities, not just absence indicators.

input:
  ui_scenario: user opens application with no previous generations
  system_state:
    session_history: empty
    corpus_state: empty
    user_state: new_user
    ui_shows: empty_state

expected:
  ui_must_show:
    - warm, welcoming message that acknowledges the empty state positively
    - clear call-to-action to help user get started
    - personality that matches brand voice (helpful, not clinical)
    - visual element that reduces anxiety (illustration, icon, etc.)
  ui_must_not_show:
    - cold technical message like "No sessions found" or "Empty corpus"
    - error-like styling (red, warning icons) on empty state
    - blank white space with no guidance
  interaction_contract:
    - user feels welcomed, not confronted
    - user knows exactly how to proceed
    - empty state builds confidence rather than creating doubt

anti_patterns:
  - displaying "No data available" in small gray text
  - showing empty list with zero explanation
  - using error iconography for neutral empty state
  - message that implies user did something wrong
  - no visible call-to-action to start first generation
  - clinical language like "No sessions exist in database"
  - blank page that looks like loading failed

notes:
  - Empty states are emotional design touchpoints.
  - First-time users form lasting impressions from empty states.
  - Message should inspire action, not resignation.
  - Consider: "Ready to create your first diagram? Let's get started."
  - Illustrations or icons add warmth and reduce anxiety.

tags:
  - mutation
  - emotional-design
  - empty-state
  - first-impression
  - personality
  - trust-building

id: GD-UI-007-M-copy-07
priority: P1
layer: ui
title: Confirmation Dialogs Must Clearly State Consequence
source: mutation
operator: copy-confirmation-ambiguous
parent: GD-UI-001
intent: Confirmation dialogs must clearly state what will happen if confirmed. Users should be able to make an informed decision without guessing consequences. The confirm button label should match the action.

input:
  ui_scenario: user triggers a destructive or significant action
  system_state:
    confirmation_contexts:
      - action: delete_artifact
        consequence: permanent removal, cannot undo
      - action: cancel_task
        consequence: loses progress, credits consumed
      - action: overwrite_template
        consequence: previous template replaced
      - action: clear_history
        consequence: all past tasks removed

expected:
  ui_must_show:
    - explicit statement of what will happen
    - warning for irreversible or destructive actions
    - button labels that match the action (not generic "OK/Cancel")
  ui_must_not_show:
    - vague question like "Are you sure?"
    - generic "Confirm" or "OK" button labels
    - confirmation that doesn't state the consequence
    - confirmation that can be triggered accidentally
  interaction_contract:
    - user can predict exact outcome of confirmation
    - destructive action has cancel as default focus
    - confirmation requires explicit action (no enter-to-confirm)

anti_patterns:
  - Dialog: "Are you sure?" with buttons "OK" and "Cancel" (no consequence stated)
  - Dialog: "Confirm action?" without saying what action
  - Delete dialog with "Yes" button instead of "Delete"
  - "This action cannot be undone" without restating what action
  - Cancel task dialog that doesn't mention credits already consumed
  - Confirmation that activates on Enter key (accidental confirmation)
  - Vague "Proceed with operation?" for data-deleting action

notes:
  - Pattern: "[Action] will [consequence]. Are you sure?"
  - Example: "Delete report? This cannot be undone."
  - Use action-specific buttons: "Delete" not "OK".
  - Destructive actions: red button, cancel as default focus.

tags:
  - mutation
  - ux-writing
  - confirmation-dialog
  - destructive-actions
  - user-consent
  - error-prevention

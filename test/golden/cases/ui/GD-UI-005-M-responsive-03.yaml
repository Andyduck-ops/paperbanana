id: GD-UI-005-M-responsive-03
priority: P1
layer: ui
title: Desktop Batch Table with Details Panel
source: mutation
operator: responsive-batch-table
parent: GD-UI-005
intent: At desktop viewports, batch tasks must be displayed in table format with sortable columns and a details panel for selected task.

input:
  ui_scenario: user views and manages batch of tasks on desktop
  system_state:
    batch_status: partial
    total_tasks: 10
    completed_tasks: 5
    running_tasks: 2
    failed_tasks: 2
    pending_tasks: 1
    selected_task:
      id: task-007
      status: failed
      prompt: "Generate a sunset landscape"
    viewport:
      width: 1440px
      height: 900px
    breakpoint: desktop

expected:
  ui_must_show:
    - table layout with columns (name, status, stage, duration)
    - sortable column headers
    - details panel on right side for selected task
    - batch summary header with counts
  ui_must_not_show:
    - card-based layout wasting vertical space
    - no way to sort by column
    - details in modal instead of side panel
    - batch summary hidden
  interaction_contract:
    - user can sort tasks by any column
    - user can select task to see details
    - details remain visible while browsing other tasks
    - user sees overall batch progress

anti_patterns:
  - Card grid layout on 1440px viewport
  - Columns not sortable
  - Task details in modal popup
  - No batch summary visible
  - Table without row highlighting for selected task

notes:
  - Tests batch table layout at desktop viewport.
  - Table enables efficient scanning and sorting.
  - Side panel enables detail viewing without navigation.

tags:
  - mutation
  - responsive-design
  - batch-display
  - desktop-layout
  - table-view

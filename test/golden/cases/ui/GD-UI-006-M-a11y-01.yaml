id: GD-UI-006-M-a11y-01
priority: P0
layer: ui
title: Stage Progress Announced to Screen Readers
source: mutation
operator: a11y-screen-reader-progress
parent: GD-UI-001
intent: Screen reader users must receive real-time announcements when stage progress changes. The UI must use ARIA live regions to announce stage transitions so users with visual impairments can track task progress without seeing the visual progress indicator.
wcag_criterion: WCAG 2.1 4.1.3 Status Messages (Level AA)

input:
  ui_scenario: user with screen reader is monitoring a running task
  system_state:
    session_status: running
    current_stage: planner
    stages_completed:
      - retriever
    assistive_tech: screen_reader_enabled

expected:
  aria_live_region_must_exist: true
  stage_transitions_must_be_announced: true
  announcement_content_must_include:
    - stage_name: true
    - progress_context: true
    - example: "Now processing: Planner stage"
  ui_must_use_aria_live_polite: true

anti_patterns:
  - stage progress changes are only visual with no ARIA announcements
  - screen reader user has no way to know which stage is running
  - progress updates require visual monitoring
  - ARIA live region missing or aria-live attribute absent
  - announcements are too verbose, flooding the user with details
  - stage transition happens but screen reader is silent
  - progress indicator has role="status" but no inner text updates

notes:
  - Use aria-live="polite" for non-critical progress updates.
  - Use aria-live="assertive" only for errors or critical alerts.
  - Announcements should be concise: "Now processing: Planner stage."
  - Test with NVDA, JAWS, and VoiceOver.
  - Verification: element with aria-live="polite" exists in DOM.
  - Verification: announcement text contains stage name.

tags:
  - mutation
  - accessibility
  - screen-reader
  - aria-live
  - wcag-4.1.3
  - progress-visibility

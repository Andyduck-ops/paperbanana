id: GD-UI-008-M-interaction-05
priority: P1
layer: ui
title: Tab Key Navigation Follows Visual Reading Order
source: mutation
operator: interaction-keyboard-tab-order
parent: GD-UI-001
intent: When user navigates using Tab key, focus must move through interactive elements in the same order as they appear visually (left-to-right, top-to-bottom). Mismatched tab order creates confusion and accessibility issues.

input:
  ui_scenario: user navigates interface using keyboard Tab key
  system_state:
    interactive_elements_visual_order:
      - position: 1
        element: mode_selector
      - position: 2
        element: prompt_input
      - position: 3
        element: generate_button
      - position: 4
        element: history_tab
      - position: 5
        element: help_link

expected:
  ui_must_show:
    - visible focus indicator on each element during tab navigation
    - tab order matching visual order (top-to-bottom, left-to-right)
    - focus outline clearly visible (not browser default only)
  ui_must_not_show:
    - tab order that jumps randomly across the page
    - invisible focus indicator
    - skipping interactive elements in tab order
  interaction_contract:
    - tab_order_equals_visual_order: true
    - focus_visible_on_all_elements: true
    - tabindex_logical: true
  accessibility_criterion: WCAG 2.1 2.4.3 Focus Order (Level A)

anti_patterns:
  - Tab jumps from Generate button to Help link, skipping History
  - focus order goes right-to-left instead of left-to-right
  - focus indicator is invisible or too subtle to see
  - some buttons have tabindex=-1 making them unreachable
  - tab order follows DOM order which differs from visual layout
  - focus jumps to hidden modal or off-screen element
  - focus indicator only shows browser default thin outline

notes:
  - Tab order must follow visual reading order for cognitive consistency.
  - Focus indicator must be clearly visible for keyboard users.
  - DOM order should match visual order; use CSS for layout, not DOM reordering.
  - Test by tabbing through entire interface.

tags:
  - mutation
  - interaction-design
  - keyboard-navigation
  - tab-order
  - focus-indicator
  - accessibility
  - wcag-2.4.3

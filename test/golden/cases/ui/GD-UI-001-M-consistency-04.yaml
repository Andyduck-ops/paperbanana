id: GD-UI-001-M-consistency-04
priority: P1
layer: ui
title: WebSocket Reconnect Gap Loses Events
source: mutation
operator: consistency-ws-reconnect-gap
parent: GD-UI-001
intent: When WebSocket reconnects, events that occurred during the disconnect gap must be recovered, preventing state holes.

input:
  ui_scenario: WebSocket disconnects during stage transition and reconnects 3 seconds later
  system_state:
    session_id: session-ws-gap-001
    websocket_state:
      - state: connected
        timestamp: t0
      - state: disconnected
        timestamp: t1
      - state: connected
        timestamp: t4
    events_during_gap:
      - type: stage_complete
        stage: retriever
        timestamp: t2
      - type: stage_start
        stage: planner
        timestamp: t2_plus_100ms
      - type: stage_complete
        stage: planner
        timestamp: t3
      - type: stage_start
        stage: stylist
        timestamp: t3_plus_100ms
    frontend_state_at_reconnect:
      status: running
      current_stage: retriever
    backend_state_at_reconnect:
      status: running
      current_stage: stylist

expected:
  ui_must_show:
    - current stage as stylist after reconnection
    - skipped stages marked as completed
    - indication that reconnection occurred if significant gap
  ui_must_not_show:
    - retriever as current stage when backend is at stylist
    - missing stages in progress history
    - progress percentage that is inconsistent with actual progress
  interaction_contract:
    - state is synchronized immediately after reconnect
    - user sees accurate state without manual refresh
    - gap events are replayed or current state is fetched

anti_patterns:
  - UI remains stuck on retriever after reconnect
  - No event replay or state fetch on reconnect
  - Progress indicator shows 16% when actual progress is 66%
  - Reconnect succeeds but state sync is not triggered
  - Event buffer not requested after reconnect

notes:
  - Tests WebSocket reconnection recovery.
  - Server should buffer events for reconnecting clients.
  - Client should request missed events or full state.
  - Reconnect without sync causes permanent drift.

tags:
  - mutation
  - state-consistency
  - websocket
  - reconnect
  - event-replay

id: GD-UI-001-M-responsive-01
priority: P1
layer: ui
title: Mobile Progress Stages Must Stack Vertically
source: mutation
operator: responsive-mobile-layout
parent: GD-UI-001
intent: On viewports narrower than 640px, stage progress indicators must stack vertically to maintain readability and touch accessibility.

input:
  ui_scenario: user views task progress on mobile device with narrow viewport
  system_state:
    session_status: running
    current_stage: planner
    stages_completed:
      - retriever
    stages_remaining:
      - stylist
      - visualizer
      - critic
    viewport:
      width: 375px
      height: 667px
      device_pixel_ratio: 2
    breakpoint: mobile

expected:
  ui_must_show:
    - stages arranged in vertical column layout
    - each stage card full-width within container
    - stage name and status on separate lines if needed
    - touch targets minimum 44px height per stage
  ui_must_not_show:
    - horizontal scrolling to see all stages
    - truncated or overlapping stage labels
    - stage cards smaller than 44px in height
    - horizontal layout that requires pinch-zoom
  interaction_contract:
    - user can scroll vertically to see all stages
    - each stage is fully readable without horizontal scroll
    - touch targets are accessible for users with motor impairments

anti_patterns:
  - Stages displayed horizontally requiring horizontal scroll at 375px
  - Stage labels truncated with ellipsis on mobile
  - Touch targets smaller than 44x44px
  - Four stages crammed into single row on mobile
  - Stage progress bar overlays text making it unreadable

notes:
  - Tests responsive breakpoint behavior at 375px (iPhone SE width).
  - Vertical stacking is mandatory below 640px breakpoint.
  - Each stage card must maintain minimum touch target size.

tags:
  - mutation
  - responsive-design
  - mobile-layout
  - touch-target
  - viewport-375px

id: GD-UI-010
priority: P0
layer: ui
title: Floating Input Area
source: requirement
intent: 输入区必须悬浮在屏幕底部中央，带精致阴影和毛玻璃效果，不占用固定侧边栏空间。

input:
  ui_scenario: user ready to input
  system_state:
    session_status: idle
    has_content: false

expected:
  ui_must_show:
    - 悬浮输入框在屏幕底部中央
    - 毛玻璃背景效果 (backdrop-blur)
    - 精致阴影 (shadow-lg)
    - Method 和 Caption 双输入区
    - Generate 提交按钮
    - 快捷配置入口 (齿轮图标)
  ui_must_not_show:
    - 输入框在侧边栏
    - 输入框在顶部
    - 硬边框无圆角
    - 无阴影扁平效果
  interaction_contract:
    - 用户可以输入 Method 和 Caption
    - 用户可以快速调整配置
    - 生成中按钮变为 Stop
    - 生成中输入框禁用

anti_patterns:
  - 输入框不是悬浮而是固定布局
  - 无毛玻璃效果看起来扁平
  - 配置入口隐藏太深
  - 无法区分 Method 和 Caption

notes:
  - 悬浮位置: position fixed, bottom 24px, centered
  - 宽度: min(720px, calc(100vw - 48px))
  - 动画: focus 时边框发光

tags:
  - ui
  - input
  - floating
  - glass-effect

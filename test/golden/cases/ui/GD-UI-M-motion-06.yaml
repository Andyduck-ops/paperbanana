id: GD-UI-M-motion-06
priority: P2
title: Loading Skeleton Animation
layer: ui
source: motion-design
operator: motion-loading-skeleton
parent: GD-UI-001
intent: Loading states must show skeleton placeholders with subtle shimmer animation, indicating that content is being loaded rather than showing blank or frozen space.

input:
  ui_scenario: user views interface while initial data is loading
  system_state:
    session_status: initializing
    data_loading:
      - component: stage_list
        loaded: false
      - component: artifact_preview
        loaded: false
    skeleton_animation:
      type: shimmer
      trigger: loading_state
      cycle_duration_ms: 1500-2000

expected:
  ui_must_show:
    - skeleton placeholder matching the shape of expected content
    - subtle shimmer animation indicating loading progress
    - skeleton for each component that is not yet loaded
    - smooth transition from skeleton to real content when loaded
  ui_must_not_show:
    - blank white space during loading
    - completely static skeleton that looks like frozen content
    - skeleton animation that is too fast (strobing effect)
    - jarring transition from skeleton to content
  interaction_contract:
    - user understands content is coming, not missing
    - shimmer provides reassurance that loading is progressing
    - layout does not shift when content arrives (skeleton matches size)
  motion_contract:
    - shimmer_cycle_ms: 1500-2000
    - purpose: loading_indication
    - layout_preservation: skeleton_matches_content_size
    - transition: smooth_fade_to_content

anti_patterns:
  - empty space during loading with no indication
  - static gray boxes that look like broken content
  - shimmer that cycles every 500ms creating strobing
  - skeleton size differs from content causing layout shift
  - content appears instantly with no transition from skeleton

notes:
  - Tests loading state animation for perceived performance.
  - Skeleton prevents layout shift and indicates expected content shape.
  - Shimmer reassures user that loading is active.

tags:
  - motion-design
  - loading-animation
  - skeleton-animation
  - shimmer
  - perceived-performance

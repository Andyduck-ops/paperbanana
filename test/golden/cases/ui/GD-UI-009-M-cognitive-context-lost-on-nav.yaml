id: GD-UI-009-M-cognitive-context-lost-on-nav
priority: P1
layer: ui
title: User Input Lost When Navigating Between Pages
source: mutation
operator: cognitive-context-lost-on-nav
parent: GD-UI-001
intent: User input must persist when navigating between pages or tabs. Losing partially completed form data when user navigates away causes frustration and forces re-entry, increasing cognitive burden.

input:
  ui_scenario: user navigates away from form then returns
  system_state:
    form_data:
      prompt: "Analyze quarterly sales data"
      mode: "analysis"
      files_selected: 3
    user_action: navigate_to_history_then_back
    returned_form_state: empty

expected:
  must_preserve_input_on_navigation: true
  form_state_must_include_after_return:
    - key: prompt
      value: "Analyze quarterly sales data"
    - key: mode
      value: "analysis"
  must_warn_before_discarding_input: true
  must_persist_to_local_storage: true
  draft_indicator_must_be_visible: true

anti_patterns:
  - user fills form, navigates to history, returns to empty form
  - no warning when leaving page with unsaved input
  - selected files cleared on navigation
  - no draft/auto-save functionality
  - user must re-select all options from scratch
  - no indication that form data is unsaved
  - back button loses all form state

notes:
  - Form data should be preserved until explicit clear or submit.
  - Use localStorage for drafts with timestamp.
  - Show "Unsaved changes" indicator.
  - Warn before navigating away with unsaved data.
  - "Restore draft?" prompt on return.
  - Verification: form fields contain same values after navigation return.
  - Verification: draft indicator is visible when form has unsaved content.

tags:
  - mutation
  - user-cognitive-trap
  - context-preservation
  - data-loss
  - navigation-state
  - form-memory

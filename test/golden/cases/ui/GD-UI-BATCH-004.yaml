id: GD-UI-BATCH-004
priority: P1
layer: ui
title: Batch Concurrent Stage Updates
source: mutation
operator: batch-concurrent-states
parent: GD-UI-005
intent: When multiple candidates are at different stages simultaneously, the UI must reflect each candidate's actual stage accurately without synchronization artifacts.

input:
  ui_scenario: batch of 4 candidates at different stages
  system_state:
    batch_id: batch-concurrent-001
    batch_status: running
    candidates:
      - candidate_id: 0
        status: completed
        current_stage: critic
      - candidate_id: 1
        status: running
        current_stage: visualizer
      - candidate_id: 2
        status: running
        current_stage: planner
      - candidate_id: 3
        status: pending
        current_stage: null

expected:
  ui_must_show:
    - candidate 0: completed badge
    - candidate 1: visualizer stage indicator
    - candidate 2: planner stage indicator
    - candidate 3: pending/waiting indicator
    - each candidate card reflects its actual state
  ui_must_not_show:
    - all candidates showing same stage
    - stale stage information after SSE updates
    - candidate 0 showing as running after completion
    - candidate 3 showing as running when pending
  interaction_contract:
    - user can see concurrent execution progress
    - stage updates are reflected in real-time
    - no race conditions in UI state updates

anti_patterns:
  - UI batch-updates all candidates at once, losing individuality
  - React state not updated per-candidate correctly
  - SSE event for candidate 1 updates candidate 2's state
  - stale closure in event handlers causing wrong updates
  - animation/transitions showing wrong candidate state

notes:
  - Tests real-time SSE handling for concurrent updates
  - Key challenge: interleaved events from parallel execution
  - Each candidate_event must update correct candidate
  - Verify candidate_id routing in event handlers

tags:
  - mutation
  - batch
  - batch-concurrent-states
  - ui
  - real-time-updates
  - sse-handling

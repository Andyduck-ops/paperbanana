id: GD-UI-009
priority: P0
layer: ui
title: Minimal Status Display
source: requirement
intent: 状态展示必须极简，使用类似 Vercel 部署进度的单行样式，不使用大卡片堆砌。

input:
  ui_scenario: generation in progress
  system_state:
    session_status: running
    current_stage: planner
    stages_completed:
      - retriever
    stages_remaining:
      - stylist
      - visualizer
      - critic

expected:
  ui_must_show:
    - 单行状态文本 (如 "🔍 Retrieving references...")
    - 细进度条 (h-1, 非粗进度条)
    - 已完成/总数 (如 "2/5")
    - 当前阶段图标
  ui_must_not_show:
    - 大卡片堆砌进度
    - 每个阶段独立的卡片
    - 占用大量屏幕空间的进度面板
    - 只有一个通用 spinner 无阶段信息
  interaction_contract:
    - 用户可以识别当前运行阶段
    - 用户可以判断整体进度
    - 失败时进度条变红

anti_patterns:
  - 每个阶段一个大卡片
  - 进度面板占用主工作区
  - 无阶段语义的进度条
  - 失败时整个面板消失

notes:
  - 样式参考: Vercel 部署进度
  - 样式参考: Linear 任务状态
  - 进度条颜色使用主题色

tags:
  - ui
  - progress
  - minimal
  - status-line

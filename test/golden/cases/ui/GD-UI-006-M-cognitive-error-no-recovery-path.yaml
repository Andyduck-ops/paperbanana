id: GD-UI-006-M-cognitive-error-no-recovery-path
priority: P1
layer: ui
title: Error Message Lacks Recovery Action Or Context
source: mutation
operator: cognitive-error-no-recovery-path
parent: GD-UI-002
intent: Error messages must explain what happened AND provide a clear recovery action. Vague errors like "Something went wrong" leave users stranded, increasing cognitive load as they must guess how to proceed.

input:
  ui_scenario: task fails during execution with generic error
  system_state:
    session_status: failed
    error_message: "An error occurred"
    error_stage: planner
    user_sees: modal_with_generic_error_and_close_button

expected:
  error_message_must_contain:
    - "planner"
    - "failed"
  error_message_must_include_recovery_action:
    - "retry"
    - "modify"
    - "support"
  must_allow_retry_or_alternative: true
  user_input_must_be_preserved: true

anti_patterns:
  - error shows "Something went wrong" with no explanation
  - modal only has "Close" button, no retry or help options
  - error message does not indicate which stage failed
  - user input is cleared when error occurs
  - no link to documentation or support
  - error code is shown with no human-readable explanation
  - user must restart entire task from scratch

notes:
  - Users should never have to guess what to do next.
  - Good error: "Planner could not understand your request. Try rephrasing with more specific terms."
  - Recovery actions: Retry, Modify Input, Contact Support, View Logs.
  - Preserve user input so they can modify instead of retype.
  - Consider contextual help links based on error type.
  - Verification: error message contains stage name and recovery action.
  - Verification: user input is preserved in form after error.

tags:
  - mutation
  - user-cognitive-trap
  - error-recovery
  - vague-error
  - stranded-user
  - cognitive-overhead

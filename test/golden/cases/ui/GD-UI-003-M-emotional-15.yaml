id: GD-UI-003-M-emotional-15
priority: P1
layer: ui
title: Artifact Preview Must Evoke Pride of Creation
source: mutation
operator: emotional-artifact-pride
parent: GD-UI-003
intent: When displaying the completed artifact, the UI must frame it in a way that evokes pride and ownership. Users should feel they created something valuable, not just received system output.

input:
  ui_scenario: user views their completed generated diagram
  system_state:
    session_status: completed
    final_artifact:
      kind: rendered_figure
      mime_type: image/png
      bytes_present: true
      preview_ready: true

expected:
  ui_must_show:
    - artifact prominently displayed as the center of attention
    - language that emphasizes user ownership ("Your diagram")
    - visual presentation that elevates the artifact
    - easy actions to use, share, or save the creation
  ui_must_not_show:
    - artifact as just another UI element
    - clinical "Output" or "Result" labels
    - hiding artifact behind clicks or small previews
    - framing that suggests system ownership
  interaction_contract:
    - user feels proud of their creation
    - user has clear sense of ownership
    - artifact is presented as valuable output

anti_patterns:
  - small preview thumbnail that minimizes the artifact
    - "Output" label that sounds clinical
    - no framing or presentation elevation
    - artifact treated like any other data
    - no ownership language ("the diagram" vs "your diagram")
    - download button as only option, no preview
    - presentation that makes artifact feel like temporary output

notes:
  - The artifact is the emotional payoff; treat it as such.
  - Consider: prominent display, "Your diagram is ready!" header.
  - Ownership language builds connection and pride.
  - Easy sharing/save actions extend the positive moment.

tags:
  - mutation
  - emotional-design
  - artifact-presentation
  - pride
  - ownership
  - creation-celebration

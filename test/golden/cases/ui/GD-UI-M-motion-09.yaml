id: GD-UI-M-motion-09
priority: P1
title: Artifact Preview Fade In Animation
layer: ui
source: motion-design
operator: motion-artifact-fade-in
parent: GD-UI-003
intent: Artifact preview must fade in smoothly when image data becomes available, not appear instantly, providing perceptual continuity and avoiding jarring visual pop.

input:
  ui_scenario: artifact image becomes available after generation
  system_state:
    session_status: completed
    artifact_ready:
      kind: rendered_figure
      mime_type: image/png
      loading_state: ready
    preview_animation:
      type: fade_in
      trigger: artifact_bytes_loaded
      duration_ms: 200-400
      easing: ease-in-out

expected:
  ui_must_show:
    - smooth fade-in animation when artifact preview appears
    - animation duration between 200-400ms
    - artifact fully visible after animation completes
    - no visible placeholder flash before fade-in
  ui_must_not_show:
    - instant appearance of artifact with no transition
    - fade-in duration exceeding 500ms (feels slow)
    - flicker or flash during fade-in
    - artifact partially visible during fade-in
  interaction_contract:
    - user perceives smooth content arrival
    - animation provides continuity from loading to ready state
    - no visual discontinuity or jarring pop
  motion_contract:
    - fade_in_duration_ms: 200-400
    - easing: ease-in-out
    - purpose: content_arrival_continuity
    - state_sequence: skeleton -> fade_in -> visible

anti_patterns:
  - artifact pops in instantly with no animation
  - fade-in takes 1 second creating perceived delay
  - artifact flickers during load
  - skeleton disappears, then artifact appears (gap)
  - partial image visible during fade

notes:
  - Tests artifact preview arrival animation.
  - Fade-in provides perceptual continuity for content arrival.
  - Timing must balance smoothness with responsiveness.

tags:
  - motion-design
  - artifact-animation
  - fade-in
  - content-arrival
  - preview-animation

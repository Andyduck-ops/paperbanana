id: GD-UI-001-M-emotional-13
priority: P1
layer: ui
title: Connection Issues Must Be Communicated Without Panic
source: mutation
operator: emotional-connection-calm
parent: GD-UI-001
intent: When connection issues occur, the UI must communicate the problem calmly without inducing panic. Users should feel the issue is temporary and manageable, not catastrophic.

input:
  ui_scenario: SSE connection drops during generation
  system_state:
    connection_status: disconnected
    last_known_session_status: running
    current_stage: planner
    reconnecting: true
    reconnect_attempt: 1

expected:
  ui_must_show:
    - calm message about connection issue
    - indication that reconnection is in progress
    - reassurance that session state is preserved
    - expected timeline or next update
  ui_must_not_show:
    - panic-inducing error message
    - implying data loss or session destruction
    - warning styling that suggests catastrophe
    - silence that leaves user uncertain
  interaction_contract:
    - user understands the situation calmly
    - user knows the system is handling it
    - anxiety is minimized through clear communication

anti_patterns:
  - "CONNECTION LOST" in red with warning icon
    - "Your session may be lost" scary message
    - no indication that reconnection is automatic
    - error styling that suggests unrecoverable failure
    - user fears their work is gone
    - no visual indication that reconnect is happening
    - abrupt transition to error state

notes:
  - Connection issues are stressful; reduce, don't amplify.
  - Consider: "Connection interrupted. Reconnecting..."
  - Use neutral colors, not red/warning for temporary issues.
  - Automatic recovery should be communicated clearly.

tags:
  - mutation
  - emotional-design
  - connection-issues
  - calm-communication
  - reconnection
  - anxiety-reduction

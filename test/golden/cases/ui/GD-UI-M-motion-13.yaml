id: GD-UI-M-motion-13
priority: P2
title: Hover And Focus Motion Design
layer: ui
source: motion-design
operator: motion-hover-focus
parent: GD-UI-001
intent: Interactive elements must have subtle hover and focus animations that provide feedback without being distracting, following consistent timing across the interface.

input:
  ui_scenario: user hovers over or focuses interactive elements
  system_state:
    interactive_elements:
      - type: button
        hover_animation:
          scale: 1.02-1.05
          duration_ms: 100-200
      - type: stage_indicator
        hover_animation:
          brightness: 1.1
          duration_ms: 100-200
      - type: artifact_preview
        hover_animation:
          scale: 1.02
          duration_ms: 100-200
    focus_ring:
      type: outline
      duration_ms: 0-100
      color: accent_primary

expected:
  ui_must_show:
    - consistent hover animation timing across all interactive elements
    - subtle scale or brightness change on hover
    - focus ring animation for keyboard navigation
    - animation provides feedback without distraction
  ui_must_not_show:
    - instant hover state change with no animation
    - wildly different hover timing between elements
    - hover animation that is too slow (over 300ms)
    - hover animation that obscures or moves content unexpectedly
  interaction_contract:
    - user receives immediate feedback on interactive elements
    - hover timing is consistent and predictable
    - focus state is clearly visible for keyboard users
  motion_contract:
    - hover_duration_ms: 100-200
    - hover_scale: 1.02-1.05
    - focus_ring_duration_ms: 0-100
    - purpose: interaction_feedback
    - consistency: same_timing_across_elements

anti_patterns:
  - button changes hover state instantly with no animation
  - one button has 100ms hover, another has 500ms
  - hover animation takes 1 second
  - hover causes element to move and misalign
  - focus ring has no animation or is invisible

notes:
  - Tests hover and focus animation consistency.
  - Consistent timing creates predictable, polished feel.
  - Focus animation must be visible for accessibility.

tags:
  - motion-design
  - hover-animation
  - focus-animation
  - interaction-feedback
  - timing-consistency

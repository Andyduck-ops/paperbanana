id: GD-UI-001-M-consistency-10
priority: P1
layer: ui
title: Stage History Inconsistency With Current Stage
source: mutation
operator: consistency-history-stage-drift
parent: GD-UI-001
intent: Stage history must be internally consistent with current stage, showing valid progression without impossible jumps.

input:
  ui_scenario: current stage shows stylist but history shows visualizer was already completed
  system_state:
    session_id: session-history-drift-001
    session_status: running
    current_stage: stylist
    stage_history:
      - stage: retriever
        status: completed
        timestamp: t1
      - stage: planner
        status: completed
        timestamp: t2
      - stage: visualizer
        status: completed
        timestamp: t3
    inconsistency_cause: "resume from incorrect snapshot"

expected:
  ui_must_show:
    - detected inconsistency with warning
    - request for state reconciliation from backend
    - either corrected state or clear error
  ui_must_not_show:
    - impossible stage progression without warning
    - visualizer completed while current is stylist
    - user confusion from contradictory indicators
  interaction_contract:
    - impossible states are detected and flagged
    - user is notified of state inconsistency
    - recovery action is available

anti_patterns:
  - UI shows visualizer completed but current stage is stylist
  - No validation of stage progression logic
  - History and current stage can contradict
  - Resume from corrupted snapshot goes undetected
  - No reconciliation mechanism

notes:
  - Tests internal state consistency validation.
  - Stage progression has rules: retriever -> planner -> stylist -> visualizer.
  - Impossible transitions indicate data corruption.
  - Should trigger backend state fetch.

tags:
  - mutation
  - state-consistency
  - stage-history
  - internal-validation
  - progression-rules

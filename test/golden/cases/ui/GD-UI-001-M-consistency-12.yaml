id: GD-UI-001-M-consistency-12
priority: P1
layer: ui
title: Timestamp Monotonicity Violation
source: mutation
operator: consistency-timestamp-violation
parent: GD-UI-001
intent: Event timestamps must be monotonically increasing, detecting clock issues or out-of-order event delivery.

input:
  ui_scenario: stage complete event has earlier timestamp than stage start event
  system_state:
    session_id: session-timestamp-001
    session_status: running
    current_stage: stylist
    events:
      - type: stage_start
        stage: planner
        timestamp: "2024-01-15T10:30:00.000Z"
      - type: stage_complete
        stage: planner
        timestamp: "2024-01-15T10:25:00.000Z"
    timestamp_anomaly: "complete before start"
    possible_causes:
      - "clock drift between servers"
      - "out of order event delivery"
      - "client time used instead of server time"

expected:
  ui_must_show:
    - warning about timestamp inconsistency
    - events still displayed in logical order
    - request for backend state verification
  ui_must_not_show:
    - negative duration calculations
    - "completed in -5 minutes" display
    - broken timeline visualization
  interaction_contract:
    - timestamp anomalies are surfaced
    - logical order takes precedence over timestamp order
    - backend state is authoritative

anti_patterns:
  - Duration shows negative time
  - Timeline visualization breaks
  - No detection of timestamp anomalies
  - Client clock used for sequencing
  - event with timestamp < previous_event.timestamp accepted with no warning log

notes:
  - Tests event ordering consistency.
  - Server timestamps should be used for sequencing.
  - Clock skew is a real distributed system issue.
  - Must handle gracefully, not crash.

tags:
  - mutation
  - state-consistency
  - timestamp-anomaly
  - event-ordering
  - clock-drift

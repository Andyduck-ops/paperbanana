id: GD-UI-006-M-a11y-12
priority: P1
layer: ui
title: Text Sufficient Color Contrast
source: mutation
operator: a11y-color-contrast
parent: GD-UI-001
intent: All text content in the UI must have sufficient color contrast against its background. Users with low vision or color vision deficiencies must be able to read stage names, status messages, and error text without difficulty.
wcag_criterion: WCAG 2.1 1.4.3 Contrast (Minimum) (Level AA)

input:
  ui_scenario: user with low vision viewing task progress
  system_state:
    session_status: running
    current_stage: planner
    text_elements:
      - stage_names
      - status_messages
      - error_text
      - timestamps

expected:
  normal_text_must_have_4_5_1_contrast: true
  large_text_must_have_3_1_contrast: true
  stage_names_must_meet_contrast_requirement: true
  error_messages_must_be_highly_visible: true
  focus_indicators_must_have_3_1_contrast: true

anti_patterns:
  - stage names in light gray on white background
  - status text has 3:1 contrast ratio (too low for normal text)
  - error messages use red on dark background with poor contrast
  - timestamps are barely readable
  - focus indicator has low contrast against background
  - "disabled" state text is unreadable
  - color theme does not meet contrast requirements

notes:
  - Normal text (< 18px or < 14px bold): 4.5:1 minimum.
  - Large text (>= 18px or >= 14px bold): 3:1 minimum.
  - Use contrast checking tools during development.
  - Consider high contrast mode support.

tags:
  - mutation
  - accessibility
  - color-contrast
  - wcag-1.4.3
  - low-vision
  - visual-accessibility

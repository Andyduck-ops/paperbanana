id: GD-UI-007-M-copy-05
priority: P0
layer: ui
title: Success Messages Must Confirm What Was Created
source: mutation
operator: copy-success-not-specific
parent: GD-UI-001
intent: Success messages must explicitly state what was accomplished, not just say "Success" or "Done". Users need confirmation of the specific action that completed so they can verify their intent was fulfilled.

input:
  ui_scenario: user completes an action successfully
  system_state:
    success_contexts:
      - action: task_completed
        artifact_type: report
      - action: settings_saved
        settings_changed: theme, notifications
      - action: template_created
        template_name: "Monthly Report"
      - action: export_completed
        format: PDF
        download_size: 2.4 MB

expected:
  ui_must_show:
    - specific description of what was created or changed
    - confirmation of the action taken
    - optional: next step or follow-up action
  ui_must_not_show:
    - generic "Success" or "Done" messages
    - technical confirmations like "HTTP 200 OK"
    - success messages that don't state what succeeded
    - auto-dismissing messages before user can read them
  interaction_contract:
    - user can verify the correct action completed
    - message persists long enough to read
    - optional action to view the created item

anti_patterns:
  - Success notification showing only "Success!" with no context
  - "Done" message without saying what was done
  - "Operation completed successfully" without specifics
  - "Saved" without indicating what was saved
  - Technical message "POST /api/tasks returned 201"
  - Success message that disappears after 1 second
  - "Your request has been processed" without naming the request

notes:
  - Pattern: "[Action] completed. [What was created]."
  - Example: "Report generated. Your analysis is ready to download."
  - Include action button: "View Report", "Open Folder", "Share".
  - Success messages should be dismissible but not auto-hide quickly.

tags:
  - mutation
  - ux-writing
  - success-messages
  - confirmation
  - action-feedback
  - user-confidence

id: GD-UI-BATCH-005
priority: P1
layer: ui
title: Batch Download ZIP Integration
source: mutation
operator: batch-all-succeed
parent: GD-UI-005
intent: After batch completion with successful candidates, the UI must provide a working download-all button that retrieves a ZIP of all successful artifacts.

input:
  ui_scenario: batch completed with all candidates successful
  system_state:
    batch_id: batch-download-001
    batch_status: completed
    successful: 3
    failed: 0
    candidates:
      - candidate_id: 0
        status: completed
        artifacts:
          - id: artifact-0
            kind: rendered_figure
            mime_type: image/png
      - candidate_id: 1
        status: completed
        artifacts:
          - id: artifact-1
            kind: rendered_figure
            mime_type: image/png
      - candidate_id: 2
        status: completed
        artifacts:
          - id: artifact-2
            kind: rendered_figure
            mime_type: image/png

expected:
  ui_must_show:
    - "Download All" button visible and enabled
    - batch summary showing 3 successful
    - each candidate artifact preview accessible
  download_contract:
    - clicking download triggers POST /api/v1/batch/download
    - request body includes batch_id
    - response is valid ZIP file
    - ZIP contains 3 PNG files
    - ZIP contains metadata.json with batch info
  ui_must_not_show:
    - download button disabled when successful > 0
    - download button before batch completes
    - individual download buttons only (no batch download)

anti_patterns:
  - download button missing entirely
  - download button enabled but returns empty ZIP
  - ZIP missing metadata.json
  - ZIP file naming collision (all files named same)
  - download button shown when successful == 0
  - API call uses wrong endpoint or missing batch_id

notes:
  - Tests batch download feature integration
  - Wire against BatchProgressPanel.handleDownloadZip
  - ZIP should include metadata.json for traceability
  - Verify correct MIME type and filename in response

tags:
  - mutation
  - batch
  - batch-all-succeed
  - ui
  - download
  - zip-integration

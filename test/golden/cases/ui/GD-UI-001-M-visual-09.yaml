id: GD-UI-001-M-visual-09
priority: P1
layer: ui
title: Theme Color Token Application
source: mutation
operator: visual-theme-token-break
parent: GD-UI-001
intent: Users switch to a different theme and are confused when some elements remain unchanged in their original colors, wondering "Why didn't the theme apply everywhere? Is this a bug?"

input:
  ui_scenario: components use hard-coded color values that don't respond to theme changes
  system_state:
    theme_tokens:
      - --color-primary
      - --color-secondary
      - --color-background
      - --color-foreground
      - --color-accent
      - --color-muted
      - --color-border
    themes:
      pop-art:
        primary: 'oklch(0.70 0.25 25)'
        background: 'oklch(0.95 0.05 90)'
      classical-chinese:
        primary: 'oklch(0.45 0.08 30)'
        background: 'oklch(0.95 0.02 80)'
      minimalist-bw:
        primary: 'oklch(0.15 0 0)'
        background: 'oklch(0.98 0 0)'

expected:
  ui_must_show:
    - all colors defined via CSS custom properties
    - theme switching updates all visual elements
    - consistent color application across components
  ui_must_not_show:
    - hard-coded hex colors like #ff0000 or #ffffff
    - hard-coded rgb/rgba values bypassing theme tokens
    - colors that don't change when theme switches
    - Tailwind arbitrary values bypassing design system
  interaction_contract:
    - theme switch instantly updates all component colors
    - no visual artifacts during theme transition
    - brand colors properly applied in all themes

anti_patterns:
  - StageCard uses text-green-600 hard-coded instead of semantic token
  - Button uses bg-blue-500 that doesn't respond to theme
  - Background color hard-coded as #ffffff
  - Primary color directly applied without token variable
  - Status colors use fixed values that don't adapt to theme

notes:
  - Tests theme token usage across all components.
  - Semantic tokens should map to theme-specific values.
  - Check base.css for token definitions.

tags:
  - mutation
  - visual-design
  - theming
  - css-tokens
  - design-system

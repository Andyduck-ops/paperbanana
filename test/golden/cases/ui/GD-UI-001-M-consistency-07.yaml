id: GD-UI-001-M-consistency-07
priority: P1
layer: ui
title: Race Condition Between Cancel And Complete
source: mutation
operator: consistency-race-cancel-complete
parent: GD-UI-001
intent: When cancel and complete race, the final UI state must deterministically reflect backend resolution, not user action timing.

input:
  ui_scenario: user clicks cancel at same instant backend completes, creating race condition
  system_state:
    session_id: session-race-001
    race_condition:
      user_cancel_request_time: t5_000ms
      backend_complete_time: t5_010ms
    cancel_arrived_at_backend: true
    backend_resolution: completed
    resolution_reason: "completion processed before cancel"
    frontend_pending_cancel: true
    user_expectation: cancelled

expected:
  ui_must_show:
    - completed status reflecting backend resolution
    - indication that cancel was attempted but completion won
    - artifact available for download
  ui_must_not_show:
    - cancelled state when task actually completed
    - no indication that cancel was ignored
    - UI stuck in pending-cancel state
  interaction_contract:
    - user sees final authoritative state
    - user understands cancel lost the race
    - artifact is available for review

anti_patterns:
  - UI shows cancelled but artifact exists
  - No feedback about race condition resolution
  - User believes cancel succeeded when it did not
  - UI status = cancelling for >30s without resolution
  - Inconsistent state based on which network response arrived first

notes:
  - Tests race condition handling.
  - Backend resolution is always authoritative.
  - UI should not guess outcome before confirmation.
  - Race conditions are common with user actions.

tags:
  - mutation
  - state-consistency
  - race-condition
  - cancel-vs-complete
  - resolution-authority

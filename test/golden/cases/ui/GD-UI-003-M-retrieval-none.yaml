id: GD-UI-003-M-retrieval-none
priority: P1
layer: ui
title: Artifact Surfaced With Retrieval Disabled
source: mutation
operator: retrieval-none
parent: GD-UI-003
intent: Artifact must still be surfaced correctly in UI when retrieval is disabled, proving retrieval mode does not affect final artifact availability.

input:
  ui_scenario: task has completed successfully with retrieval disabled
  system_state:
    session_status: completed
    current_stage: critic
    retrieval_mode: none
    stages_completed:
      - retriever
      - planner
      - stylist
      - visualizer
      - critic
    final_artifact:
      kind: rendered_figure
      mime_type: image/png
      uri: memory://visualizer/current
      bytes_present: true

expected:
  ui_must_show:
    - completed status indicator
    - final artifact rendered or downloadable
    - all stages shown as completed
  ui_must_not_show:
    - running spinner
    - failure message
    - empty artifact area
    - warning about missing retrieval
  interaction_contract:
    - user can view or download the final artifact
    - user cannot distinguish artifact quality difference from retrieval enabled run

anti_patterns:
  - completed badge shown but artifact area empty due to retrieval disabled
  - UI shows warning or error about retrieval being disabled
  - artifact quality degraded message shown when retrieval_mode is none
  - download or preview action unavailable despite artifact being present

notes:
  - Tests that retrieval mode is transparent to the end user at completion.
  - The artifact may differ in quality but must still be present and accessible.
  - No negative UI indicators should appear for retrieval disabled mode.

tags:
  - mutation
  - retrieval-variation
  - retrieval-none
  - artifact-availability

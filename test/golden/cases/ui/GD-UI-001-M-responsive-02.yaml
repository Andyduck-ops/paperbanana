id: GD-UI-001-M-responsive-02
priority: P1
layer: ui
title: Touch Target Size for Interactive Elements
source: mutation
operator: responsive-touch-target
parent: GD-UI-001
intent: All interactive elements must have a minimum touch target of 44x44 pixels to ensure accessibility for users with motor impairments.

input:
  ui_scenario: user interacts with task controls and stage indicators on touch device
  system_state:
    session_status: running
    current_stage: planner
    interactive_elements:
      - element: cancel_button
        type: button
        action: cancel_task
      - element: stage_retriever
        type: clickable
        action: view_stage_details
      - element: stage_planner
        type: clickable
        action: view_stage_details
      - element: retry_button
        type: button
        action: retry_stage
    viewport:
      width: 375px
      input_method: touch

expected:
  ui_must_show:
    - all interactive elements with minimum 44x44px touch target
    - adequate spacing between touch targets (minimum 8px)
    - visible focus indicators for all interactive elements
  ui_must_not_show:
    - touch targets smaller than 44px in either dimension
    - overlapping touch target hit areas
    - interactive elements with no visible focus state
  interaction_contract:
    - user can tap any interactive element with finger without precision
    - adjacent targets are distinguishable by touch
    - focus is clearly visible for keyboard/screen reader users

anti_patterns:
  - Cancel button only 32x32px
  - Stage icons 24x24px with no padding expanding touch area
  - Retry button placed too close to other buttons
  - No visual indication of focus on interactive elements
  - Touch targets overlap making correct tap difficult

notes:
  - Tests WCAG 2.1 Success Criterion 2.5.5 (Target Size).
  - 44x44px is Apple Human Interface Guidelines minimum.
  - 48x48px is Material Design recommendation.
  - Include padding in touch target calculation.

tags:
  - mutation
  - responsive-design
  - touch-target
  - accessibility
  - wcag-2.5.5

id: GD-UI-005-M-ui-failed-with-location
priority: P1
layer: ui
title: Batch Failed Task With Location Preserved
source: mutation
operator: ui-failed-with-location
parent: GD-UI-005
intent: Failed task in batch must show precise failure location, not collapse into generic batch error.

input:
  ui_scenario: batch of tasks with one failed
  system_state:
    batch_tasks:
      - id: task-001
        session_status: completed
        final_artifact:
          available: true
      - id: task-002
        session_status: failed
        failed_stage: stylist
        failure_detail:
          phase: style_application
          error_type: timeout
      - id: task-003
        session_status: running
        current_stage: retriever

expected:
  ui_must_show:
    - task-001 as completed with artifact
    - task-002 as failed with failed_stage visible
    - task-003 as running with current stage
    - batch summary reflecting mixed states
  ui_must_not_show:
    - entire batch shown as failed
    - task-002 failure stage hidden in batch summary
    - generic "batch failed" message
  interaction_contract:
    - user can identify which task failed and where
    - user can retry task-002 individually

anti_patterns:
  - batch shows single error state for all tasks
  - task-002 failure location not visible without drill-down
  - running task-003 hidden by failed task-002
  - no option to retry only the failed task
  - failure location requires opening task detail to see

notes:
  - Tests that batch UI preserves individual task failure details.
  - Batch failures should not obscure individual failure locations.
  - User should be able to act on failed tasks independently.

tags:
  - mutation
  - ui-state
  - failed-state
  - batch
  - failure-location

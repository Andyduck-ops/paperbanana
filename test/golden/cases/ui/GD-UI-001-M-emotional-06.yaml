id: GD-UI-001-M-emotional-06
priority: P1
layer: ui
title: Cancel Action Must Provide Reassurance Not Guilt
source: mutation
operator: emotional-cancel-reassurance
parent: GD-UI-001
intent: When a user cancels a running task, the UI must reassure them that cancellation is okay and explain what happens to their partial progress. Users should not feel guilt or anxiety about cancelling.

input:
  ui_scenario: user clicks cancel button during stylist stage
  system_state:
    session_status: running
    current_stage: stylist
    user_action: cancel_requested
    stages_completed:
      - retriever
      - planner
    partial_artifacts_exist: true

expected:
  ui_must_show:
    - confirmation that cancellation is okay and safe
    - information about what is preserved (if anything)
    - reassurance that this does not count against limits unfairly
    - easy path to restart if desired
  ui_must_not_show:
    - warning-style confirmation ("Are you sure you want to cancel?")
    - guilt-inducing language ("This will waste your progress")
    - implication that cancellation is a failure
    - dark pattern that discourages cancellation
  interaction_contract:
    - user feels comfortable cancelling without anxiety
    - user understands what happens to partial results
    - cancellation is a valid user choice, not an error

anti_patterns:
  - "Are you sure? All progress will be lost!" in warning red
    - "Cancel generation?" with scary warning icon
    - no information about partial artifacts
    - cancellation counted as "failed" in metrics shown to user
    - confirmation dialog that feels like a reprimand
    - no way to see what was completed before cancel
    - language implying user made a bad choice

notes:
  - Cancellation is a user right, not a failure.
  - Consider: "No problem! Your retriever results are saved if you want to resume."
  - Avoid dark patterns that trap users in unwanted tasks.
  - Positive framing: "Cancelled - ready when you are."

tags:
  - mutation
  - emotional-design
  - cancellation
  - user-agency
  - reassurance
  - no-dark-patterns

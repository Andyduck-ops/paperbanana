id: GD-UI-021
priority: P0
layer: ui
title: Restore Refine Session Rebuilds Refine Mode and Artifact
source: mutation
parent: PB-HIST-003
intent: Restoring a persisted polish session must switch the workspace into refine mode and hydrate the refined image artifact.

input:
  ui_scenario: user selects a refine history item backed by a persisted polish session
  system_state:
    session_mode: refine
    current_stage: polish
    final_artifact_kind: polished_image
    prompt_restored: true

expected:
  ui_must_show:
    - refine tab becomes active
    - restored refined artifact is visible
    - restored prompt remains associated with the refine result
  ui_must_not_show:
    - generate result remains the active workspace state
    - restore silently drops the refined artifact

anti_patterns:
  - session restore lands in generate mode
  - polish artifact exists in session payload but not in workspace
  - restored refine result has no image data

notes:
  - This case is backed by `useHistory` restore tests and an App-level history restore integration test.

tags:
  - ui
  - history
  - restore
  - refine
  - workspace

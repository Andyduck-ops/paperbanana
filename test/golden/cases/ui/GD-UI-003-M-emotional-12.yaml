id: GD-UI-003-M-emotional-12
priority: P1
layer: ui
title: Successful Retry Must Celebrate Resilience
source: mutation
operator: emotional-retry-success
parent: GD-UI-003
intent: When a user retries after a failure and succeeds, the UI must acknowledge this resilience positively. Success after failure should feel even more rewarding, not just like a normal completion.

input:
  ui_scenario: user retries a previously failed task and it completes successfully
  system_state:
    session_status: completed
    previous_attempts: 1
    previous_status: failed
    current_attempt: 2
    final_artifact:
      kind: rendered_figure
      bytes_present: true

expected:
  ui_must_show:
    - acknowledgment of the retry success
    - positive framing that celebrates persistence
    - normal completion celebration plus extra acknowledgment
    - sense of overcoming a challenge together
  ui_must_not_show:
    - treating retry success exactly like first-try success
    - no acknowledgment of the journey to success
    - ignoring that this was a recovery from failure
    - making the previous failure feel like a stain
  interaction_contract:
    - user feels good about persisting
    - retry success feels extra rewarding
    - system acknowledges the user's effort

anti_patterns:
  - completion message identical to first-try success
    - no mention that this was a retry that worked
    - previous failure is ignored or hidden
    - UI shows same celebration as first-try success with no retry_acknowledgment field
    - no celebration of persistence
    - retry treated as completely separate event
    - no "welcome back from failure" moment

notes:
  - Success after failure is a special emotional moment.
  - Consider: "Nice persistence! Your diagram is ready."
  - Acknowledge the journey: "Second time's the charm!"
  - This builds trust that the system supports recovery.

tags:
  - mutation
  - emotional-design
  - retry-success
  - resilience
  - persistence
  - recovery-celebration

id: GD-UI-008-M-interaction-14
priority: P2
layer: ui
title: Scroll Position Preserved When Returning From Details
source: mutation
operator: interaction-scroll-position-preserve
parent: GD-UI-002
intent: When user navigates to task details and returns to history list, scroll position should be preserved. Losing scroll position causes user to lose context and creates frustration.

input:
  ui_scenario: user scrolls history list, clicks a task, then returns
  system_state:
    session_status: idle
    history_items_count: 50
    user_scroll_position: item_35
    user_action:
      - scroll_to_item_35
      - click_item_35_view_details
      - navigate_back_to_list

expected:
  ui_must_show:
    - history list scrolled to same position as before navigation
    - previously viewed item highlighted or indicated
    - smooth transition back without jarring jump
  ui_must_not_show:
    - scroll position reset to top
    - user loses place in long list
    - jarring scroll jump
  interaction_contract:
    - scroll_position_preserved: true
    - return_transition_smooth: true
    - context_preserved: true

anti_patterns:
  - Returning from details, list jumps to top
  - user must scroll back to find their place
  - no indication of which item was just viewed
  - scroll position preserved but list re-renders causing jump
  - browser back button loses scroll position
  - virtualized list resets scroll on navigation

notes:
  - Critical for long lists where finding place is difficult.
  - Virtual lists need special handling to preserve scroll.
  - Consider using URL state or session storage for position.
  - Smooth transitions improve perceived continuity.

tags:
  - mutation
  - interaction-design
  - scroll-position
  - navigation
  - context-preservation
  - user-experience

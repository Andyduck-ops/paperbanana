id: GD-UI-011-M-cognitive-stage-meaning-unclear
priority: P1
layer: ui
title: Progress Stage Names Are Technical Jargon
source: mutation
operator: cognitive-stage-meaning-unclear
parent: GD-UI-001
intent: Progress stage names must be understandable to non-technical users. Displaying "Retriever RAG Pipeline" when user expects "Finding relevant information" creates confusion and cognitive load.

input:
  ui_scenario: progress shows technical stage names
  system_state:
    current_stage: "retriever"
    technical_label: "Retriever RAG Pipeline v2.1"
    user_sees: "Running: Retriever RAG Pipeline v2.1"
    user_understands: false

expected:
  stage_labels_must_use_user_friendly_mapping:
    - technical_name: retriever
      display_must_contain_one_of:
        - "Searching"
        - "Finding"
    - technical_name: planner
      display_must_contain_one_of:
        - "Planning"
        - "Designing"
    - technical_name: critic
      display_must_contain_one_of:
        - "Reviewing"
        - "Validating"
  stage_tooltip_must_contain_description: true
  elapsed_time_must_be_visible: true

anti_patterns:
  - progress shows "Running: Critic LLM Evaluation Node"
  - stage names use internal system terminology
  - no explanation of what each stage does
  - user sees "Planner Agent Executing" with no context
  - technical pipeline names exposed in UI
  - abbreviations without expansion (RAG, LLM, NLP)
  - no way to understand progress meaning

notes:
  - "Retriever" -> "Searching knowledge base..."
  - "Planner" -> "Planning your response..."
  - "Critic" -> "Reviewing for quality..."
  - Provide tooltips or info icons with explanations.
  - Consider "What's happening?" expandable section.
  - Verification: stage display text does not contain "LLM", "RAG", or "Pipeline".
  - Verification: each stage has a tooltip or info icon with plain-language description.

tags:
  - mutation
  - user-cognitive-trap
  - technical-jargon
  - unclear-progress
  - terminology-gap
  - user-comprehension

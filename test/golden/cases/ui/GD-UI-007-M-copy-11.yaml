id: GD-UI-007-M-copy-11
priority: P1
layer: ui
title: Undo Confirmation Must State What Will Be Restored
source: mutation
operator: copy-undo-not-specific
parent: GD-UI-001
intent: Undo actions must clearly communicate what will be restored. Users need to know the scope of undo to decide whether to proceed. Undo messages should be immediate and specific.

input:
  ui_scenario: user triggers undo after an action
  system_state:
    undo_contexts:
      - action: deleted_item
        scope: single artifact, with its metadata
      - action: cleared_history
        scope: all task history from current session
      - action: reverted_settings
        scope: previous settings state
      - action: cancelled_task
        scope: partial progress already made

expected:
  ui_must_show:
    - specific statement of what will be restored
    - timeframe if applicable (undo available for X minutes)
    - confirmation for bulk undo operations
  ui_must_not_show:
    - generic "Undo successful" without specifics
    - undo that doesn't state scope of restoration
    - undo that takes longer than 1 second without feedback
    - undo that creates confusion about current state
  interaction_contract:
    - user knows exactly what state is restored
    - undo completes within 1 second for single items
    - bulk undo requires confirmation

anti_patterns:
  - Toast "Undo successful" without stating what was undone
  - "Item restored" without specifying which item
  - Undo that restores deleted item but not its position in list
  - Undo that takes 5+ seconds with no loading indicator
  - "Restored to previous state" without describing that state
  - Undo that appears to work but data is not actually restored
  - Bulk undo without confirmation showing item count

notes:
  - Pattern: "Restored [item name]. Undo available for 30 seconds."
  - Example: "Restored 'Q3 Report' to your history."
  - Show what state is restored, not just that undo happened.
  - Provide redo option after undo.

tags:
  - mutation
  - ux-writing
  - undo-messages
  - state-restoration
  - user-recovery
  - action-feedback

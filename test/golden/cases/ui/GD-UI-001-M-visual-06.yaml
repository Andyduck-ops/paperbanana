id: GD-UI-001-M-visual-06
priority: P1
layer: ui
title: Spacing Consistency Between Components
source: mutation
operator: visual-spacing-inconsistency
parent: GD-UI-001
intent: Users subconsciously notice when some cards feel cramped with tight padding while others feel spacious, creating a sense that the UI is "messy" or "unprofessional" without being able to articulate exactly why.

input:
  ui_scenario: components use inconsistent padding and margin values
  system_state:
    spacing_tokens:
      - name: spacing-1
        value: '0.25rem (4px)'
      - name: spacing-2
        value: '0.5rem (8px)'
      - name: spacing-3
        value: '0.75rem (12px)'
      - name: spacing-4
        value: '1rem (16px)'
      - name: spacing-6
        value: '1.5rem (24px)'
      - name: spacing-8
        value: '2rem (32px)'
    expected_usage:
      card_padding: 'spacing-4 (p-4)'
      card_gap: 'spacing-2 (gap-2)'
      section_gap: 'spacing-4 (space-y-4)'
      container_padding: 'spacing-4 md:spacing-6 lg:spacing-8'

expected:
  ui_must_show:
    - StageCard uses consistent p-4 padding
    - ProgressPanel cards use space-y-2 between stages
    - Layout main content uses p-4 md:p-6 lg:p-8
    - All gaps use defined spacing tokens
  ui_must_not_show:
    - StageCard using p-3 while BatchProgressPanel uses p-4
    - Inconsistent gap values (gap-2 vs gap-3 vs gap-4 randomly)
    - Hard-coded pixel values (15px, 23px) instead of tokens
    - Different spacing patterns in same component types
  interaction_contract:
    - visual rhythm is consistent and predictable
    - spacing reflects information hierarchy
    - professional appearance maintained

anti_patterns:
  - StageCard has p-4, BatchProgressPanel candidate card has p-3
  - ProgressPanel uses space-y-4, EvolutionTimeline uses space-y-2
  - Header uses px-4 py-3, Footer uses px-6 py-4
  - Magic numbers like p-[15px] or gap-[23px]
  - Inconsistent margin between sections

notes:
  - Tests spacing token usage consistency.
  - All spacing should use Tailwind classes (p-*, gap-*, space-*).
  - No hard-coded pixel values should appear.

tags:
  - mutation
  - visual-design
  - spacing
  - tokens
  - visual-rhythm

id: GD-UI-001-M-emotional-07
priority: P1
layer: ui
title: Stage Transitions Must Build Anticipation
source: mutation
operator: emotional-stage-anticipation
parent: GD-UI-001
intent: During stage transitions, the UI must create a sense of anticipation and momentum. Each stage completion should feel like progress toward something exciting, not just a checklist item.

input:
  ui_scenario: task completes retriever stage and enters planner stage
  system_state:
    session_status: running
    previous_stage: retriever
    current_stage: planner
    stage_transition_just_occurred: true

expected:
  ui_must_show:
    - brief celebration of completed stage
    - anticipatory message about upcoming stage
    - sense of momentum and progress
    - optional: preview of what next stage will do
  ui_must_not_show:
    - silent instant transition with no acknowledgment
    - stages that feel like bureaucratic checkpoints
    - clinical "Stage 2 of 5" with no emotional context
    - transition animation that feels like waiting
  interaction_contract:
    - user feels excitement about progress
    - user understands what's happening next
    - transitions create positive anticipation, not impatience

anti_patterns:
  - stage completes and next stage starts with no visual feedback
    - "Stage 2 complete" with no transition celebration
    - progress bar that just increments with no fanfare
    - no preview of what next stage accomplishes
    - transition feels like loading, not progress
    - user loses sense of momentum
    - clinical stage names with no context

notes:
  - Transitions are opportunities for micro-delight.
  - Consider: "Found your references! Now planning your diagram..."
  - Momentum keeps users engaged during multi-stage processes.
  - Each stage should feel like a step toward something exciting.

tags:
  - mutation
  - emotional-design
  - stage-transition
  - anticipation
  - momentum
  - micro-delight

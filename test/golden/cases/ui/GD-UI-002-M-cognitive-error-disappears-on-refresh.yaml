id: GD-UI-002-M-cognitive-error-disappears-on-refresh
priority: P1
layer: ui
title: Error Message Disappears On Page Refresh
source: mutation
operator: cognitive-error-disappears-on-refresh
parent: GD-UI-002
intent: Error state and messages must persist across page refreshes. If a user refreshes after a failure, they must still see what went wrong, otherwise they cannot report or debug the issue.

input:
  ui_scenario: task fails with error, user refreshes page
  system_state:
    session_status: failed
    error_message: "Critic stage failed: invalid output format"
    after_refresh_shows: no_error_visible

expected:
  error_must_persist_after_refresh: true
  session_must_include_error_details:
    - key: error_message
      value_contains: "Critic stage failed"
    - key: failed_stage
      value: "critic"
  ui_must_show_after_refresh:
    - session_status: failed
    - error_message_visible: true
  must_allow_copy_error_details: true

anti_patterns:
  - error shows on screen but disappears on page refresh
  - session shows "failed" but no error details are visible after reload
  - user cannot report bug because error message is gone
  - error state only exists in frontend memory, not persisted
  - refresh returns to blank state as if task never ran
  - no error history or log accessible to user
  - user loses critical debugging information

notes:
  - Error persistence is critical for debugging and support.
  - Users often refresh to try to fix issues.
  - Losing error details wastes user and support time.
  - Error should be stored in session state on backend.
  - Consider error export feature for support tickets.
  - Verification: session record contains error_message and failed_stage fields.
  - Verification: UI displays error message after page refresh.

tags:
  - mutation
  - user-cognitive-trap
  - error-persistence
  - refresh-state-loss
  - debugging-support
  - information-loss

id: GD-UI-001-M-ambiguous-prompt
priority: P1
layer: ui
title: Ambiguous Prompt Must Still Show Stage Progress
source: mutation
operator: ambiguous-prompt
parent: GD-UI-001
intent: When a vague prompt is submitted, the UI must still display meaningful stage progress. Prompt ambiguity must not cause the UI to fall back to a generic spinner.

input:
  ui_scenario: task with vague prompt is mid-execution
  system_state:
    session_status: running
    current_stage: planner
    stages_completed:
      - retriever
    stages_remaining:
      - stylist
      - visualizer
      - critic
    prompt_quality: ambiguous

expected:
  ui_must_show:
    - current active stage name
    - stages already completed
    - overall pipeline structure
  ui_must_not_show:
    - generic spinner with no stage information
    - error indicator while still running
    - completed badge
  interaction_contract:
    - user can see the task is processing despite vague prompt
    - user can identify which agent is currently working

anti_patterns:
  - UI shows only "generating..." spinner because prompt was underspecified
  - stage progress is hidden while system attempts to interpret vague prompt
  - UI shows error state while pipeline is still running
  - completed stages not visible because retriever returned ambiguous results
  - user has no way to know if the system is working or stuck

notes:
  - The key insight is that prompt ambiguity is a backend concern.
  - UI progress visibility should be independent of prompt quality.
  - Even with "make something", stages should run and report progress.
  - This protects against UI degradation on edge-case inputs.

tags:
  - mutation
  - input-ambiguity
  - ambiguous-prompt
  - progress-visibility
  - stage-semantics

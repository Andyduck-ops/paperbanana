id: GD-UI-001-M-cognitive-progress-bar-stuck-at-99
priority: P1
layer: ui
title: Progress Bar Stuck At 99 Percent While Critic Runs
source: mutation
operator: cognitive-progress-bar-stuck-at-99
parent: GD-UI-001
intent: Progress indicators must not create the impression that completion is imminent when it is not. A stuck 99% progress bar causes user frustration and the impression that the system has frozen.

input:
  ui_scenario: progress bar reaches 99% during critic stage
  system_state:
    session_status: running
    current_stage: critic
    stage_progress: indeterminate
    overall_progress_ui: 99_percent_stuck

expected:
  ui_state_must_show_current_stage: critic
  progress_bar_must_not_show_exact_percent: 99
  stage_progress_indicator_must_show:
    - stage_name: critic
      indicator_type: indeterminate
  ui_must_display_stage_label: true
  elapsed_time_must_be_visible: true
  progress_must_not_freeze_at_any_percent: true

anti_patterns:
  - progress bar shows 99% and stays there for 2+ minutes during critic
  - no indication which stage is responsible for the delay
  - progress_percentage field = 99 for >120s with no stage_progress event
  - no distinction between "almost done" and "critic validating"
  - progress bar animates to 99% immediately then never updates
  - page refresh triggered by user within 120s of stuck progress
  - no estimate or time remaining shown during long stages

notes:
  - 99% stuck is a UX anti-pattern that causes frustration.
  - Critic stage duration is unpredictable.
  - Show indeterminate progress for stages with unknown duration.
  - Consider showing "validating quality..." instead of % for critic.
  - Time estimates help set user expectations.
  - Verification: UI state shows current_stage field with value "critic".
  - Verification: Progress indicator for critic stage is indeterminate (spinner or pulsing).

tags:
  - mutation
  - user-cognitive-trap
  - stuck-progress
  - 99-percent-problem
  - progress-accuracy
  - stage-visibility

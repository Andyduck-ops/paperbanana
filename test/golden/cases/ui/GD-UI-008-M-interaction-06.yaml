id: GD-UI-008-M-interaction-06
priority: P1
layer: ui
title: Loading State Prevents Interaction With Incomplete Content
source: mutation
operator: interaction-loading-state-disable
parent: GD-UI-001
intent: While content is loading, interactive elements that depend on that content must be disabled. Allowing interaction with incomplete data causes errors and confusing behavior.

input:
  ui_scenario: task history is loading from server
  system_state:
    session_status: idle
    history_load_status: loading
    history_items: []
    user_action: attempts_to_click_history_item

expected:
  ui_must_show:
    - loading indicator in history panel
    - history items disabled or skeleton placeholders shown
    - clear visual distinction between loaded and loading states
  ui_must_not_show:
    - clickable empty history items
    - interactive elements that would fail when clicked
    - no indication that content is still loading
  interaction_contract:
    - dependent_elements_disabled_while_loading: true
    - loading_indicator_visible: true
    - no_interaction_with_incomplete_data: true

anti_patterns:
  - History shows clickable items while data is still loading
  - user clicks history item but nothing happens or error occurs
  - no loading indicator, UI appears frozen
  - skeleton placeholders are clickable
  - user can interact with elements that have no data
  - loading state and loaded state look identical

notes:
  - Prevent interaction with incomplete content to avoid errors.
  - Show clear loading states for async content.
  - Use skeleton placeholders or disabled states appropriately.
  - Test all async loading scenarios.

tags:
  - mutation
  - interaction-design
  - loading-state
  - disabled-state
  - async-content
  - error-prevention

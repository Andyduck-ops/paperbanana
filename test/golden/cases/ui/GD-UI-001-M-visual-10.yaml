id: GD-UI-001-M-visual-10
priority: P1
layer: ui
title: Animation Consistency for Running State
source: mutation
operator: visual-animation-inconsistency
parent: GD-UI-001
intent: When one running stage pulses while another running stage sits completely still, users think "Is the second one actually running? Or is it stuck? The UI is giving me mixed signals."

input:
  ui_scenario: running status displays inconsistent animations across components
  system_state:
    expected_animation:
      name: 'animate-pulse'
      duration: '2s (Tailwind default)'
      timing: 'ease-in-out'
    components_with_running_state:
      - StageCard: 'animate-pulse on running status'
      - EvolutionTimeline: 'running status indicator'
      - BatchProgressPanel: 'running candidate'
    animation_properties:
      opacity_range: '1 to 0.5'
      should_pause_on_hover: false

expected:
  ui_must_show:
    - consistent animate-pulse on all running status indicators
    - same animation duration across all components
    - smooth animation without jarring transitions
  ui_must_not_show:
    - StageCard uses animate-pulse, EvolutionTimeline has no animation
    - Different animation durations (1s vs 2s vs 3s)
    - Jarring or inconsistent animation styles
    - Running icon static in one component, animated in another
  interaction_contract:
    - user can reliably identify running state by animation
    - animation does not cause performance issues
    - animation is subtle and professional

anti_patterns:
  - StageCard has animate-pulse, EvolutionTimeline running is static
  - BatchProgressPanel uses custom animation different from StageCard
  - Animation duration varies (some 1s, some 2s)
  - Running icon 🔄 spins at different speeds in different places
  - No animation on running state anywhere

notes:
  - Tests animation consistency for running/loading states.
  - Tailwind's animate-pulse should be used consistently.
  - Consider reduced-motion media query for accessibility.

tags:
  - mutation
  - visual-design
  - animation
  - consistency
  - running-state

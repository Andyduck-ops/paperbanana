id: GD-UI-015-M-cognitive-partial-failure-masking
priority: P1
layer: ui
title: Partial Failure Hidden In Success State
source: mutation
operator: cognitive-partial-failure-masking
parent: GD-UI-BATCH-003
intent: When batch tasks have partial failures, the UI must clearly show which items failed. Masking partial failures with an overall "completed" state misleads users about actual results.

input:
  ui_scenario: batch with mixed success/failure shows as completed
  system_state:
    batch_size: 5
    successful: 3
    failed: 2
    ui_shows: "Batch completed"
    failed_items: [2, 4]

expected:
  batch_ui_must_show:
    - key: success_count
      value: "3"
    - key: failed_count
      value: "2"
    - key: failed_item_indices
      value: "[2, 4]"
  batch_status_must_be: partial_failure
  must_allow_view_failed_details: true
  must_allow_retry_failed_only: true

anti_patterns:
  - batch shows green checkmark when 2 of 5 failed
  - only shows "Completed" with no indication of failures
  - failed items mixed with successful, no distinction
  - user must click into each item to find failures
  - no summary of "3 succeeded, 2 failed"
  - download button includes failed items with no warning
  - notification says "All tasks completed" when not all succeeded

notes:
  - Show "3/5 completed successfully, 2 failed".
  - Red/yellow indicator for partial failure.
  - List failed items prominently with error reasons.
  - Allow "Retry failed items" without redoing all.
  - Progress bar shows success portion in green, failed in red.
  - Verification: UI displays success_count and failed_count numerically.
  - Verification: batch_status is "partial_failure", not "completed".

tags:
  - mutation
  - user-cognitive-trap
  - partial-failure
  - success-masking
  - result-inaccuracy
  - batch-transparency

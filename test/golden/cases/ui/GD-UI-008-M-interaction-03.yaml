id: GD-UI-008-M-interaction-03
priority: P1
layer: ui
title: All Interactive Elements Have Visible Hover State
source: mutation
operator: interaction-hover-state-consistency
parent: GD-UI-001
intent: Every interactive element (buttons, links, cards, tabs) must show visible hover feedback. Lack of hover state creates uncertainty about clickability and degrades user confidence.

input:
  ui_scenario: user hovers over various interactive elements
  system_state:
    interactive_elements:
      - element: generate_button
        type: primary_action
        expected_hover: background_darken_or_scale
      - element: stage_card
        type: navigation
        expected_hover: border_highlight_or_shadow
      - element: help_link
        type: navigation
        expected_hover: underline_or_color_change
      - element: mode_toggle
        type: toggle
        expected_hover: background_or_border_change

expected:
  ui_must_show:
    - visible state change on hover for all interactive elements
    - consistent hover effect timing (150-300ms transition)
    - cursor change to pointer for clickable elements
  ui_must_not_show:
    - no visual change on hover for interactive elements
    - inconsistent hover effects across similar elements
    - hover effect only on some buttons but not others
  interaction_contract:
    - all_buttons_must_have_hover: true
    - all_links_must_have_hover: true
    - hover_transition_ms: 150-300
    - cursor_indicator: pointer

anti_patterns:
  - Generate button has no hover effect, looks identical to static state
  - StageCard shows hover effect but ResultPanel card does not
  - hover effect is instant (0ms) making it feel jarring
  - hover effect takes 500ms+ making UI feel sluggish
  - cursor remains default arrow over clickable buttons
  - hover effect exists but is too subtle to notice
  - only primary buttons have hover, secondary buttons do not

notes:
  - Hover feedback is essential for discoverability and confidence.
  - Transition timing should feel smooth, not instant or slow.
  - Test all interactive elements systematically.
  - Consider both mouse and touch contexts.

tags:
  - mutation
  - interaction-design
  - hover-state
  - visual-feedback
  - affordance
  - consistency

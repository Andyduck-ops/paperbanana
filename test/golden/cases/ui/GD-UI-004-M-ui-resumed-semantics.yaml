id: GD-UI-004-M-ui-resumed-semantics
priority: P1
layer: ui
title: Resumed State With Clear Origin Indication
source: mutation
operator: ui-resumed-semantics
parent: GD-UI-004
intent: UI must clearly distinguish resumed runs from fresh runs with visible indicators of resume origin and inherited state.

input:
  ui_scenario: task resumed from checkpoint after prolonged pause
  system_state:
    session_status: running
    resumed_from_stage: visualizer
    current_stage: visualizer
    resume_metadata:
      original_session_id: session-abc123
      paused_at: 2024-01-15T10:30:00Z
      resumed_at: 2024-01-15T14:45:00Z
      paused_duration_hours: 4.25
    stages_completed_before_resume:
      - retriever
      - planner
      - stylist

expected:
  ui_must_show:
    - clear visual indicator this is a resumed run
    - stages completed before resume marked as inherited
    - current stage shown as running, not pending
    - resume origin timestamp or session reference
  ui_must_not_show:
    - pipeline presented as starting from scratch
    - prior completed stages shown as pending
    - no indication that this is not a fresh execution
  interaction_contract:
    - user can distinguish resumed from fresh at a glance
    - user can access resume metadata if needed

anti_patterns:
  - resumed task visually identical to fresh task
  - no badge, label, or icon indicating resume status
  - pause duration not visible anywhere in UI
  - original session id not available for audit trail
  - stages shown as "completed now" instead of "completed before pause"

notes:
  - Tests semantic distinction of resumed executions.
  - Resume indicator can be subtle but must be present.
  - This is critical for debugging and audit purposes.

tags:
  - mutation
  - ui-state
  - resumed-state
  - resume-indicator
  - state-continuity

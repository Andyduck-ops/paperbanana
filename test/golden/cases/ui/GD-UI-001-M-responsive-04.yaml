id: GD-UI-001-M-responsive-04
priority: P1
layer: ui
title: Desktop Sidebar Progress Panel
source: mutation
operator: responsive-desktop-sidebar
parent: GD-UI-001
intent: At desktop viewport widths (1440px+), progress stages must be displayed in a persistent sidebar panel, maximizing main content area for results.

input:
  ui_scenario: user views task progress on large desktop monitor
  system_state:
    session_status: running
    current_stage: planner
    stages_completed:
      - retriever
    stages_remaining:
      - stylist
      - visualizer
      - critic
    viewport:
      width: 1440px
      height: 900px
    breakpoint: desktop

expected:
  ui_must_show:
    - progress stages in dedicated sidebar panel (minimum 280px, maximum 360px)
    - main content area for artifact preview
    - sidebar remains visible during scrolling
    - vertical stage layout within sidebar
  ui_must_not_show:
    - progress taking up full width of viewport
    - sidebar narrower than 280px or wider than 360px
    - progress in main content area instead of sidebar
    - horizontal stage layout in sidebar
  interaction_contract:
    - user can see progress while viewing results
    - sidebar provides always-visible status context
    - main content gets maximum useful space

anti_patterns:
  - Progress bar spans full 1440px width
  - Sidebar narrower than 200px with cramped content
  - Sidebar wider than 400px wasting space
  - Progress embedded in main content area
  - No sidebar at all on desktop layout

notes:
  - Tests desktop breakpoint at 1440px.
  - Sidebar pattern optimizes information density.
  - Main content should be primary focus on desktop.

tags:
  - mutation
  - responsive-design
  - desktop-layout
  - sidebar-panel
  - viewport-1440px

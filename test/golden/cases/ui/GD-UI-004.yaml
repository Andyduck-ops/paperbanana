id: GD-UI-004
priority: P0
layer: ui
title: Resumed Task Exposes Resume Semantics
source: seed
intent: When a task was resumed from a snapshot, the UI must not present it as a fresh execution. Prior completed stages and resume origin must be distinguishable.

input:
  ui_scenario: task was resumed from a snapshot after planner
  system_state:
    session_status: running
    resumed_from_stage: planner
    current_stage: stylist
    stages_completed_before_resume:
      - retriever
      - planner
    stages_running_after_resume:
      - stylist
    resume_metadata_preserved: true

expected:
  ui_must_show:
    - stages completed before resume are shown as already done
    - current stage is stylist, not retriever
    - some indication that this is a resumed run, not a fresh one
  ui_must_not_show:
    - retriever or planner shown as currently running
    - pipeline presented as starting from scratch
    - resume metadata discarded from visible state
  interaction_contract:
    - user can see which stages were inherited from snapshot
    - user can see which stages are being run in this resume

anti_patterns:
  - resumed task appears identical to a brand new task
  - prior completed stages shown as pending again
  - pipeline progress resets to zero on resume
  - no visual or semantic distinction between fresh run and resumed run
  - resume metadata present in backend but not surfaced to UI layer

notes:
  - This case does not require a specific visual badge design.
  - It requires that the semantic distinction between resumed and fresh is present.
  - Wire against the session state consumer that distinguishes resume_metadata.

tags:
  - ui
  - resume
  - snapshot
  - resume-semantics
  - state-continuity

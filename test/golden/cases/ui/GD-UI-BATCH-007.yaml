id: GD-UI-BATCH-007
priority: P1
layer: ui
title: Batch Retriever Failure UI Display
source: mutation
operator: batch-partial-failure
parent: GD-UI-005
intent: When shared retriever fails for entire batch, the UI must show batch-level failure clearly without misleading per-candidate states.

input:
  ui_scenario: batch failed at retriever stage
  system_state:
    batch_id: batch-retriever-fail-001
    batch_status: failed
    successful: 0
    failed: 3
    error:
      stage: retriever
      message: "Retriever service unavailable"
    candidates:
      - candidate_id: 0
        status: failed
        failed_stage: retriever
      - candidate_id: 1
        status: failed
        failed_stage: retriever
      - candidate_id: 2
        status: failed
        failed_stage: retriever

expected:
  ui_must_show:
    - batch-level error message visible
    - all candidates marked as failed
    - retriever failure attribution clear
    - "Download All" button hidden (no successful artifacts)
  ui_must_not_show:
    - candidates shown as "pending" or "running"
    - misleading progress indicator
    - download button enabled
    - individual candidate errors differing from batch error
  interaction_contract:
    - user understands the failure was at retriever stage
    - user can retry the entire batch
    - user does not attempt to download non-existent artifacts

anti_patterns:
  - UI shows candidates as "pending" when retriever failed
  - each candidate shows different error message
  - batch spinner still showing after failure
  - download button visible but returns error
  - no indication that retriever caused the cascade failure
  - UI state stuck in "running" after batch_complete with failure

notes:
  - Tests UI handling of catastrophic batch failure
  - All candidates fail at same stage (retriever)
  - UI should show unified failure, not confusing individual states
  - Verify SSE batch_complete with failure handled correctly

tags:
  - mutation
  - batch
  - batch-partial-failure
  - ui
  - retriever-failure
  - error-display

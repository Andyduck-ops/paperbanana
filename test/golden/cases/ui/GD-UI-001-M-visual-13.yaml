id: GD-UI-001-M-visual-13
priority: P1
layer: ui
title: Form Input Visual Consistency
source: mutation
operator: visual-input-inconsistency
parent: GD-UI-001
intent: Users tabbing through a form notice the textarea highlights with one focus ring style while the select dropdown shows a completely different focus indicator, making the form feel "inconsistent" and "patched together".

input:
  ui_scenario: Form inputs have inconsistent styling across the application
  system_state:
    input_styles:
      border: 'border border-border'
      background: 'bg-background'
      text: 'text-foreground'
      focus: 'focus:outline-none focus:ring-2 focus:ring-primary'
      placeholder: 'placeholder-muted-foreground'
      padding: 'px-4 py-3'
      border_radius: 'rounded-lg'
    input_types:
      - textarea (DualInputPanel)
      - select (GeneratePanel visualizer node)
      - number input (batch candidates)
      - checkbox (batch mode)

expected:
  ui_must_show:
    - consistent border style across all input types
    - consistent focus ring appearance
    - consistent padding and sizing
    - theme-aware colors (using tokens)
  ui_must_not_show:
    - textarea with different border than select
    - number input with different focus style
    - inconsistent padding between input types
    - hard-coded colors in any input
  interaction_contract:
    - all inputs feel part of cohesive design system
    - focus behavior is predictable
    - inputs are clearly interactive

anti_patterns:
  - Textarea has rounded-lg, select has no border-radius
  - Number input has different focus ring color
  - Checkbox styling inconsistent with other inputs
  - Select dropdown doesn't match theme colors
  - Placeholder text different color in different inputs
  - Input heights vary unexpectedly

notes:
  - Tests form input consistency in GeneratePanel, DualInputPanel.
  - All inputs should share base styling classes.
  - Focus states must be consistent for accessibility.

tags:
  - mutation
  - visual-design
  - form-inputs
  - consistency
  - focus-states

id: GD-UI-001-M-consistency-03
priority: P0
layer: ui
title: Database Session vs In-Memory Session Divergence
source: mutation
operator: consistency-db-memory-drift
parent: GD-UI-001
intent: When database session state differs from in-memory session state, the UI must reflect the authoritative source and handle reconciliation gracefully.

input:
  ui_scenario: database shows failed but in-memory session shows running
  system_state:
    database_session:
      id: session-db-mem-001
      status: failed
      failed_at_stage: stylist
      error_message: "style application timeout"
      updated_at: t3
    memory_session:
      id: session-db-mem-001
      status: running
      current_stage: visualizer
      started_at: t1
    divergence_cause: process_crash_before_db_sync
    ui_polling_source: memory

expected:
  ui_must_show:
    - failed status after source reconciliation
    - failure at stylist stage (from database truth)
    - error message from database
  ui_must_not_show:
    - running state that contradicts persisted truth
    - visualizer as current stage when failure was at stylist
    - eternal spinner with no failure indication
  interaction_contract:
    - UI shows authoritative state within reconciliation window
    - User sees failure with retry option
    - State inconsistency is detected and corrected

anti_patterns:
  - UI shows status=running for >60s when database.status = failed
  - Polling only memory source ignores database truth
  - No fallback to database when memory state is stale
  - User waits for completion that will never come
  - No detection of memory-database discrepancy

notes:
  - Tests authoritative source handling.
  - Database is source of truth for session status.
  - Memory is optimization for speed but must be validated.
  - Periodic database sync prevents permanent drift.

tags:
  - mutation
  - state-consistency
  - database-truth
  - memory-drift
  - source-authority

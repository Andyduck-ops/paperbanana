id: GD-UI-004-M-resume-shows-inherited-stages
priority: P1
layer: ui
title: Resume Shows Inherited Stage Status
source: mutation
operator: resume-after-planner
parent: GD-UI-004
intent: When a task is resumed, the UI must visually distinguish stages completed before resume from stages run during current resume session.

input:
  ui_scenario: task was resumed from a snapshot after planner
  system_state:
    session_status: running
    resumed_from_stage: planner
    current_stage: stylist
    stages_completed_before_resume:
      - retriever
      - planner
    stages_running_after_resume:
      - stylist
    resume_metadata_preserved: true
    resume_timestamp_present: true

expected:
  ui_must_show:
    - retriever and planner marked as "completed (from previous run)"
    - stylist shown as currently running
    - visualizer and critic shown as pending
    - visual distinction between inherited and current run stages
    - resume timestamp or "resumed at" indicator
  ui_must_not_show:
    - all stages appearing as if run in current session
    - no indication that this is a resumed task
    - retriever or planner shown with same timestamp as stylist
    - resume_metadata not displayed in UI or detail view
  interaction_contract:
    - user can see which stages were inherited from snapshot
    - user can see when the resume occurred
    - user can understand the execution timeline

anti_patterns:
  - inherited stages look identical to newly completed stages
  - no visual marker distinguishing resume from fresh run
  - resume_timestamp not displayed anywhere in UI
  - user cannot tell if task is fresh or resumed
  - inherited stages shown with current timestamp

notes:
  - Tests UI transparency for resume semantics.
  - Users need to understand execution history for debugging.
  - Visual distinction could be a badge, icon, or timestamp difference.
  - Supports user mental model of what work was done when.

tags:
  - mutation
  - resume-boundary
  - ui-resume-semantics
  - inherited-stages
  - transparency

<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="description" content="PaperBanana — AI-powered academic illustration generation and refinement. Transform research ideas into publication-ready scientific figures." />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Open Graph -->
    <meta property="og:title" content="PaperBanana — AI Academic Illustration Generator" />
    <meta property="og:description" content="Transform research ideas into publication-ready scientific figures with AI-powered generation and refinement." />
    <meta property="og:type" content="website" />

    <link rel="icon" type="image/png" href="/images/logo.png" />
    <title>PaperBanana — AI Academic Illustration Generator</title>

    <!--
      Anchor fonts (per .trellis/spec/ui-design/design-principles.md §0):
        Source Serif 4   — Claude/Anthropic light-anchor display headings (weight 500)
        Inter Variable   — Linear dark-anchor + universal body (cv01/ss03/cv11, weight 510 signature)
        JetBrains Mono   — code/monospace
    -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="dns-prefetch" href="https://fonts.gstatic.com" />
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400..700&family=Source+Serif+4:opsz,wght@8..60,400..600&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet" />

    <script>
      // Sync color-scheme attribute before first paint to avoid theme flash.
      // §0 of design principles: only `data-color-scheme="light" | "dark"` is supported.
      (function () {
        var colorScheme = 'system';
        try {
          var raw = localStorage.getItem('paperbanana-app-store');
          if (raw) {
            var parsed = JSON.parse(raw);
            if (parsed && parsed.state && parsed.state.colorScheme) {
              colorScheme = parsed.state.colorScheme;
            }
          }
        } catch (e) {
          // Persisted state unreadable — fall through to system preference.
        }

        var effective = colorScheme;
        if (colorScheme === 'system') {
          effective = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
        }
        document.documentElement.setAttribute('data-color-scheme', effective);

        // Cleanup any legacy `data-theme` attribute that may have been persisted.
        document.documentElement.removeAttribute('data-theme');
      })();
    </script>
  </head>
  <body>
    <a href="#main-content" class="skip-link">Skip to main content</a>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
